<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Fractions Number Line Quiz | Mills Maths Tools</title>
  <style>
    :root{
      --bg:#f8fafc; --card:#ffffff; --ink:#0f172a; --muted:#64748b; --border:#e2e8f0;

      --amber:#d97706; --line:#334155; --line-soft:#94a3b8; --pink:#db2777;
      --uiFont:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      --mathFont:"STIX Two Math","Cambria Math","Latin Modern Math","Times New Roman",Georgia,serif;
    }
    *{ box-sizing:border-box; }
    body{ margin:0; font-family:var(--uiFont); color:var(--ink); min-height:100dvh;
      background:radial-gradient(circle at top left,rgba(37,99,235,.14),transparent 32rem),radial-gradient(circle at top right,rgba(124,58,237,.12),transparent 34rem),var(--bg); overflow-x:hidden; }
    button,input{ font:inherit; }
    .app{ min-height:100dvh; display:flex; flex-direction:column; }

    /* bilingual lines: target language on top, English beneath */
    .tl{ display:block; }
    .tl[lang="ar"], .tl[lang="fa"]{ font-size:1.02em; }
    .el{ display:block; font-size:.78em; opacity:.72; font-weight:600; margin-top:1px; }
    bdi{ unicode-bidi:isolate; }

    .mmtTopbar{ background:linear-gradient(135deg,#0f172a,#123b7a 55%,#2563eb); color:#fff; padding:12px 22px;
      display:grid; grid-template-columns:minmax(150px,1fr) auto minmax(150px,1fr); align-items:center; gap:14px; }
    .mmtBrand{ display:flex; align-items:center; gap:11px; text-decoration:none; color:#fff; font-weight:900; }
    .mmtBrandLogo{ width:40px; height:40px; border-radius:9px; background:#fff; color:#1d4ed8; display:grid; place-items:center; font-weight:1000; letter-spacing:-.08em; }
    .mmtBrandText strong{ display:block; font-size:1.05rem; line-height:1; } .mmtBrandText span{ display:block; font-size:.72rem; opacity:.82; font-weight:650; }
    .mmtTopTitle{ font-weight:850; font-size:clamp(1rem,2vw,1.4rem); letter-spacing:-.03em; text-align:center; }
    .topActions{ justify-self:end; display:flex; align-items:center; gap:10px; font-size:.82rem; font-weight:800; }
    .langTog{ display:inline-flex; border:1px solid rgba(255,255,255,.3); border-radius:10px; overflow:hidden; }
    .langTog button{ border:none; background:transparent; color:#fff; font-weight:900; font-size:.82rem; padding:6px 10px; cursor:pointer; }
    .langTog button.on{ background:#fff; color:#1d4ed8; }
    .whoami{ opacity:.92; }

    .signin{ background:#eef4ff; border-bottom:1px solid var(--border); padding:8px 18px; display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; font-size:.88rem; font-weight:700; color:#334155; }

    .wrap{ width:min(940px, calc(100vw - 32px)); margin:16px auto 30px; display:flex; flex-direction:column; gap:14px; }

    .progress{ background:#fff; border:1px solid var(--border); border-radius:16px; padding:12px 16px; box-shadow:var(--shadow); }
    .progTop{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
    .progTop .ttl{ font-weight:950; font-size:1.02rem; letter-spacing:-.02em; }
    .progTop .ttl b{ color:var(--purple); }
    .progTop .rst{ border:none; background:none; color:var(--muted); font-weight:800; font-size:.8rem; cursor:pointer; text-decoration:underline; }
    .dots{ display:flex; gap:7px; flex-wrap:wrap; }
    .dot{ width:30px; height:30px; border-radius:50%; border:2px solid var(--border); background:#fff; color:var(--muted); font-weight:900; font-size:.82rem; cursor:pointer; display:grid; place-items:center; transition:.14s; }
    .dot:hover{ border-color:var(--blue); }
    .dot.current{ border-color:var(--purple); color:var(--purple); box-shadow:0 0 0 3px rgba(124,58,237,.16); }
    .dot.done{ background:var(--green); border-color:var(--green); color:#fff; }

    .task{ background:linear-gradient(135deg,#faf5ff,#eef4ff); border:1px solid var(--border); border-radius:18px; padding:16px 20px; box-shadow:var(--shadow); }
    .tags{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
    .tag{ font-size:.66rem; font-weight:900; letter-spacing:.04em; text-transform:uppercase; color:#6d28d9; background:#ede9fe; border-radius:999px; padding:3px 9px; }
    .prompt{ font-size:clamp(1.04rem,2.1vw,1.22rem); font-weight:800; line-height:1.5; }
    .prompt.small{ font-size:clamp(.98rem,1.9vw,1.12rem); }
    .prompt b{ color:var(--purple); }
    .partLabel{ display:inline-block; font-size:.7rem; font-weight:950; letter-spacing:.06em; text-transform:uppercase; color:var(--purple); background:#ede9fe; border-radius:999px; padding:3px 10px; margin-bottom:8px; }
    .partLabel.b{ color:var(--green-dark); background:#dcfce7; }
    .partB{ margin-top:14px; border-top:2px dashed var(--border); padding-top:14px; animation:revealB .35s ease; }
    .partB[hidden]{ display:none; }
    @keyframes revealB{ from{ opacity:0; transform:translateY(-6px); } to{ opacity:1; transform:none; } }
    .predictRow{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; align-items:center; }
    .predictRow .plabel{ font-weight:850; color:var(--muted); font-size:.86rem; }
    .pchip{ border:1px solid var(--border); background:#fff; color:var(--ink); font-weight:850; padding:8px 14px; border-radius:16px; cursor:pointer; text-align:center; }
    .pchip[aria-pressed="true"]{ background:#dbeafe; border-color:var(--blue); color:var(--blue-dark); }
    .taskBtns{ display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; align-items:center; }
    .checkBtn{ border:1px solid var(--green); background:var(--green); color:#fff; font-weight:900; font-size:.96rem; padding:10px 18px; border-radius:12px; cursor:pointer; text-align:center; }
    .checkBtn:hover{ background:var(--green-dark); }
    .shareBtn{ border:1px solid var(--purple); background:var(--purple); color:#fff; font-weight:900; padding:10px 16px; border-radius:12px; cursor:pointer; text-align:center; }
    .shareBtn.stop{ background:#ef4444; border-color:#ef4444; }
    .shareBtn[hidden]{ display:none; }
    .feedback{ margin-top:12px; min-height:0; font-weight:800; font-size:.98rem; line-height:1.45; border-radius:12px; }
    .feedback.show{ padding:11px 14px; }
    .feedback.ok{ background:#dcfce7; color:#166534; border:1px solid #86efac; }
    .feedback.nudge{ background:#fef9c3; color:#854d0e; border:1px solid #fde68a; }
    .feedback.reveal{ background:#e0e7ff; color:#3730a3; border:1px solid #c7d2fe; }
    .feedback .el{ opacity:.8; }
    .disc details{ background:#fff; border:1px solid var(--border); border-radius:10px; padding:2px 12px; margin-top:8px; }
    .disc summary{ cursor:pointer; font-weight:900; padding:8px 0; color:var(--purple); }
    .disc p{ margin:0 0 10px; color:var(--line); font-weight:650; line-height:1.5; }
    .furtherInput{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:4px 0 10px; }
    .fin{ display:inline-flex; flex-direction:column; align-items:center; gap:5px; }
    .fbox{ width:64px; text-align:center; border:2px solid var(--border); border-radius:10px; padding:7px 6px; background:#fff; font-family:var(--mathFont); font-weight:700; font-size:1.35rem; outline:none; }
    .fbox.wide{ width:96px; }
    .fbox:focus{ border-color:var(--blue); box-shadow:0 0 0 3px rgba(37,99,235,.16); }
    .fin .fbar{ width:52px; height:3px; background:var(--line); border-radius:2px; }
    .fchips{ display:flex; gap:8px; flex-wrap:wrap; }
    .fchoice{ border:1px solid var(--border); background:#fff; color:var(--ink); font-weight:850; padding:8px 14px; border-radius:16px; cursor:pointer; text-align:center; }
    .fchoice[aria-pressed="true"]{ background:#dbeafe; border-color:var(--blue); color:var(--blue-dark); }
    .furtherReasons{ margin:2px 0 10px; }
    .rlabel{ font-size:.82rem; font-weight:850; color:var(--muted); margin-bottom:6px; }
    .rchip{ border:1px dashed var(--line-soft); background:#fff; color:var(--line); font-weight:750; font-size:.86rem; padding:7px 12px; border-radius:14px; cursor:pointer; margin:0 6px 6px 0; text-align:center; }
    .rchip.on{ background:#ede9fe; border:1px solid var(--purple); color:#6d28d9; font-weight:850; }
    .furtherBtns{ display:flex; gap:10px; }
    .fCheck{ border:1px solid var(--amber); background:var(--amber); color:#fff; font-weight:900; padding:9px 16px; border-radius:11px; cursor:pointer; text-align:center; }
    .ffb{ margin-top:8px; font-weight:800; font-size:.92rem; line-height:1.4; }
    .ffb.show{ border-radius:10px; padding:9px 12px; }
    .ffb.ok{ background:#dcfce7; color:#166534; border:1px solid #86efac; }
    .ffb.nudge{ background:#fef9c3; color:#854d0e; border:1px solid #fde68a; }
    .navRow{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:14px; }
    .navBtn{ border:1px solid var(--border); background:#fff; color:var(--line); font-weight:900; padding:10px 16px; border-radius:12px; cursor:pointer; text-align:center; }
    .navBtn:disabled{ opacity:.4; cursor:not-allowed; }
    .navBtn.next{ background:var(--blue); border-color:var(--blue); color:#fff; }
    .navBtn.next:hover:not(:disabled){ background:var(--blue-dark); }

    .work{ background:#fff; border:1px solid var(--border); border-radius:18px; padding:12px clamp(8px,2vw,16px) 12px; box-shadow:var(--shadow); margin:12px 0 2px; }
    .stepper{ display:flex; align-items:center; justify-content:center; gap:12px; flex-wrap:wrap; padding:2px 0 8px; font-weight:850; color:var(--line); }
    .stepper .lbl{ font-size:.92rem; }
    .stepBtn{ width:38px; height:38px; border-radius:11px; border:1px solid var(--border); background:#fff; color:var(--blue-dark); font-size:1.3rem; font-weight:900; cursor:pointer; display:grid; place-items:center; }
    .stepBtn:hover{ background:#eef4ff; }
    .stepBtn:disabled{ opacity:.4; cursor:not-allowed; }
    .partsVal{ min-width:44px; text-align:center; font-size:1.15rem; font-weight:950; font-variant-numeric:tabular-nums; }
    .nline{ width:100%; height:auto; max-height:42vh; display:block; margin:0 auto; touch-action:none; cursor:ew-resize; user-select:none; -webkit-user-select:none; }
    .nline text{ font-family:var(--mathFont); }
    .chips{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; padding-top:8px; }
    .chip{ border:1px solid var(--border); background:#fff; color:var(--line); font-weight:850; font-size:.86rem; padding:7px 13px; border-radius:14px; cursor:pointer; display:inline-flex; align-items:center; gap:7px; text-align:center; }
    .chip .d{ width:11px; height:11px; border-radius:3px; background:var(--line-soft); flex:0 0 auto; }
    .chip[aria-pressed="true"]{ background:#eef2ff; border-color:var(--blue); color:var(--blue-dark); }
    .chip[aria-pressed="true"] .d{ background:var(--blue); }
    .chip.suggest{ box-shadow:0 0 0 3px rgba(124,58,237,.16); border-color:var(--purple); }
    .animArrows{ display:flex; align-items:center; justify-content:center; gap:14px; padding-top:8px; }
    .animArrows[hidden]{ display:none; }
    .arrowBtn{ width:42px; height:42px; border-radius:50%; border:1px solid var(--border); background:#fff; color:var(--purple); font-size:1.4rem; font-weight:900; display:grid; place-items:center; cursor:pointer; }
    .arrowBtn:disabled{ opacity:.35; cursor:not-allowed; }
    .animCaption{ font-size:clamp(.9rem,1.8vw,1.05rem); font-weight:750; text-align:center; min-width:min(64vw,480px); }
    .animCaption .hl{ color:var(--purple); font-weight:900; } .animCaption .dec{ color:var(--blue); font-weight:900; }

    .savebar{ display:flex; align-items:center; justify-content:center; gap:12px; flex-wrap:wrap; font-weight:800; color:var(--muted); font-size:.9rem; }
    .saveBtn{ border:1px solid var(--blue); background:var(--blue); color:#fff; font-weight:900; padding:10px 18px; border-radius:12px; cursor:pointer; text-align:center; }
    .saveBtn:disabled{ opacity:.5; cursor:not-allowed; }

    @media (max-width:640px){ .mmtTopbar{ grid-template-columns:1fr; justify-items:center; } }
    @media (prefers-reduced-motion:reduce){ *{ animation-duration:.001ms !important; transition-duration:.001ms !important; } }
  </style>

  <div class="app">

          <button type="button" data-lang="fa">فا</button>

        <span class="whoami" id="whoami"></span>
      </div>
    </header>

    <div class="signin" id="signinBar">
      <span id="siPrompt">Sign in to save your progress (optional):</span>
      <input id="codeInput" placeholder="Student code" maxlength="12" autocomplete="off" />
      <button class="sBtn" id="signinBtn" type="button">Sign in</button>
      <button class="sGhost" id="skipBtn" type="button">Just explore</button>
      <span class="sMsg" id="signinMsg"></span>
    </div>

    <main class="wrap">
      <div class="progress">
        <div class="progTop">
          <div class="ttl" id="stageLine"></div>
          <button class="rst" id="resetBtn" type="button">Start over</button>
        </div>
        <div class="dots" id="dots"></div>
      </div>

      <div class="task">
        <div class="tags" id="tags"></div>
        <span class="partLabel" id="lblPartA">Part (a)</span>

        <div class="predictRow" id="predictRow" hidden></div>

        <div class="work">
          <div class="stepper">
            <span class="lbl" id="lblParts">Equal parts (denominator):</span>

            <button class="stepBtn" id="partsUp" type="button" aria-label="More parts">+</button>

          <div class="animArrows" id="animArrows" hidden>
            <button class="arrowBtn" id="animBack" type="button" aria-label="Previous step">‹</button>
            <div class="animCaption" id="animCaption"></div>
            <button class="arrowBtn" id="animNext" type="button" aria-label="Next step">›</button>
          </div>
          <div class="chips" id="chips">
            <button class="chip" id="barChip" type="button" aria-pressed="false"><span class="d"></span><span>Bar</span></button>
            <button class="chip" id="decChip" type="button" aria-pressed="false"><span class="d"></span><span>Decimal</span></button>
            <button class="chip" id="simChip" type="button" aria-pressed="false"><span class="d"></span><span>Simplify</span></button>
          </div>
        </div>

        <div class="taskBtns">
          <button class="checkBtn" id="checkBtn" type="button">Check my thinking</button>

          <div class="furtherInput" id="furtherInput"></div>
          <div class="furtherReasons" id="furtherReasons"></div>
          <div class="furtherBtns"><button class="fCheck" id="furtherCheck" type="button">Check part (b)</button></div>
          <div class="ffb" id="furtherFb"></div>
        </div>

        <div class="navRow">
          <button class="navBtn" id="prevBtn" type="button">‹ Previous</button>
          <button class="navBtn next" id="nextBtn" type="button">Next stage ›</button>
        </div>
      </div>

      <div class="savebar">
        <span id="progressText">Stages completed: 0 / 8</span>
        <button class="saveBtn" id="saveBtn" type="button" disabled>Save my progress</button>
        <span id="saveMsg"></span>
      </div>
    </main>
  </div>

    function lerpGeo(a,b,e){ return a*Math.pow(b/a,e); }

      $("animArrows").hidden=false; $("shareBtn").innerHTML=L(UI.stop); $("shareBtn").classList.add("stop");
      const startMax=state.rangeMax,endMax=animRangeFor(1),tickMax=Math.max(startMax,endMax);
      animTween(950,(p,e)=>{ const remnant=Math.max(0,Math.min(1,(0.35-p)/0.35)); const zp=Math.max(0,Math.min(1,(p-0.30)/0.70)); const ze=zp<0.5?2*zp*zp:1-Math.pow(-2*zp+2,2)/2;
        renderAnim({animMax:lerpGeo(startMax,endMax,ze),tickMax:tickMax,remnant:remnant,int:zp,bracket:zp,blue:0,point:0}); },()=>renderAnim()); }
    function exitAnim(){ if(animRAF) cancelAnimationFrame(animRAF); animating=false; state.animMode=false; $("animArrows").hidden=true; $("shareBtn").innerHTML=L(UI.share); $("shareBtn").classList.remove("stop"); render(); }
    $("shareBtn").addEventListener("click",()=>{ state.animMode?exitAnim():enterAnim(); });
    $("animBack").addEventListener("click",()=>{ if(!animating) goToStep(state.animStep-1); });
    $("animNext").addEventListener("click",()=>{ if(!animating) goToStep(state.animStep+1); });
    document.addEventListener("keydown",e=>{ if(!state.animMode) return; if(e.key==="Escape"){ exitAnim(); return; } if(animating) return; if(e.key==="ArrowRight") goToStep(state.animStep+1); else if(e.key==="ArrowLeft") goToStep(state.animStep-1); });

    // ================= STAGES (trilingual) =================
    function setV(n,d){ if(state.animMode) exitAnim(); state.den=d; state.num=n; state._targetV=n/d; state.rangeMax=Math.max(1,Math.ceil(n/d-1e-9)); render(); }
    const opt=(en,ar,fa)=>({en,ar,fa});

    const pick=a=>a[Math.floor(Math.random()*a.length)];
    const round1=x=>Math.round(x*10)/10;
    const STAGES=[
      { id:"s1", title:{en:"Fractions are numbers",ar:"الكسور أعداد",fa:"کسرها عدد هستند"}, tags:["Understand","Compare"],
        prompt:{en:`Every fraction has a <b>place on the line</b>. Drag the point to a fraction that is <b>more than 1/2 but less than 1</b>. Turn on the <b>Bar</b> — is more than half the whole shaded?`,
                ar:`لكل كسر <b>موضع على الخط</b>. اسحب النقطة إلى كسر <b>أكبر من 1/2 وأصغر من 1</b>. شغّل <b>الشريط</b> — هل ظُلِّل أكثر من نصف الكل؟`,
                fa:`هر کسر <b>جایی روی خط</b> دارد. نقطه را به کسری ببر که <b>بیشتر از 1/2 و کمتر از 1</b> باشد. <b>نوار</b> را روشن کن — آیا بیش از نیمی رنگ شده؟`},
        chips:["bar"], gen:()=>{ const b=pick([[2,3],[3,4],[4,5]]); const sd=rint(6,12); return {b:b[0]+"/"+b[1], bv:b[0]/b[1], sn:Math.max(1,rint(1,Math.floor(sd*0.45))), sd}; },
        setup:p=>{ setChips(true,false,false); setV(p.sn,p.sd); },
        check:p=>{ const v=val(), eq=md(fmt(state.num,state.den)+" = "+round2(v));
          if(v>0.5+1e-9 && v<1-1e-9) return {tone:"ok",msg:{en:`${eq} — yes, more than 1/2 and less than 1, and the bar is over half shaded. How do you know it's past a half?`,ar:`${eq} — نعم، أكبر من 1/2 وأصغر من 1، والشريط مظلّل لأكثر من النصف. كيف عرفت أنه تجاوز النصف؟`,fa:`${eq} — بله، بیشتر از 1/2 و کمتر از 1 است و بیش از نیمی از نوار رنگ شده. از کجا فهمیدی از نصف گذشته؟`}};
          if(v>=1) return {tone:"nudge",msg:{en:`${eq} — that's a whole or more. Come back under 1.`,ar:`${eq} — هذا واحد صحيح أو أكثر. ارجع إلى أقل من 1.`,fa:`${eq} — این یک کامل یا بیشتر است. به کمتر از 1 برگرد.`}};
          return {tone:"nudge",msg:{en:`${eq} — half is 0.5. Drag past halfway (but before 1).`,ar:`${eq} — النصف هو 0.5. اسحب إلى ما بعد المنتصف (وقبل 1).`,fa:`${eq} — نصف 0.5 است. از وسط بگذر (اما قبل از 1).`}}; },
        hint:{en:`Half of your parts is halfway. Go past the middle (but stay under 1).`,ar:`نصف أجزائك هو المنتصف. تجاوز الوسط (وابقَ أقل من 1).`,fa:`نصف بخش‌هایت یعنی وسط. از وسط بگذر (اما زیر 1 بمان).`},
        further:{ text:{en:`Make a fraction <b>more than {b}</b> (still under 1) and enter it.`,ar:`اصنع كسراً <b>أكبر من {b}</b> (وأقل من 1) وأدخله.`,fa:`کسری <b>بیشتر از {b}</b> (و کمتر از 1) بساز و وارد کن.`}, input:{kind:"fraction"},
          check:(p,f)=>{ if(f.d<2||f.d>100) return {ok:false,msg:UI.range2100}; const v=f.n/f.d, eq=md(fmt(f.n,f.d)+" = "+round2(v));
            return {ok:v>p.bv+1e-9&&v<1-1e-9, msg:(v>p.bv&&v<1)?{en:`${eq} — past ${md(p.b)} and under 1. 👍`,ar:`${eq} — تجاوز ${md(p.b)} وأقل من 1. 👍`,fa:`${eq} — از ${md(p.b)} گذشت و کمتر از 1 است. 👍`}:{en:`${eq} — aim above ${md(p.b)} and below 1.`,ar:`${eq} — استهدف أكبر من ${md(p.b)} وأقل من 1.`,fa:`${eq} — هدف: بیشتر از ${md(p.b)} و کمتر از 1.`}}; },
          reasons:[opt("I compared it to {b}","قارنته بـ {b}","با {b} مقایسه کردم"),opt("I turned it into a decimal","حوّلته إلى عدد عشري","به عدد اعشاری تبدیل کردم"),opt("I saw the bar was past it","رأيت الشريط تجاوزه","دیدم نوار از آن گذشته")] } },

      { id:"s2", title:{en:"The same place, a new name",ar:"المكان نفسه، اسم جديد",fa:"همان جا، نامی جدید"}, tags:["Equivalence","Reasoning"],
        gen:()=>{ const bs=pick([[1,2],[1,3],[2,3],[1,4],[3,4],[1,5],[2,5],[3,5],[4,5]]); const a=bs[0],b=bs[1],k=rint(2,4); return {a,b,k,parts:b,sn:a*k,sd:b*k,start:(a*k)+"/"+(b*k),target:a+"/"+b,tv:a/b}; },
        prompt:{en:`The point is on <b>{start}</b>. Use the <b>Equal parts</b> stepper to change it to <b>{parts}</b> parts and watch the point. <b>Does the point move?</b>`,
                ar:`النقطة على <b>{start}</b>. استخدم مبدّل <b>الأجزاء المتساوية</b> لتغييره إلى <b>{parts}</b> أجزاء وراقب النقطة. <b>هل تتحرّك النقطة؟</b>`,
                fa:`نقطه روی <b>{start}</b> است. با دکمه <b>بخش‌های مساوی</b> آن را به <b>{parts}</b> بخش تغییر بده و نقطه را نگاه کن. <b>آیا نقطه جابه‌جا می‌شود؟</b>`},
        chips:["sim"], setup:p=>{ setChips(false,true,false); setV(p.sn,p.sd); },
        predict:{ label:{en:"When you change to {parts} parts, the point…",ar:"عند التغيير إلى {parts} أجزاء، النقطة…",fa:"وقتی به {parts} بخش تغییر می‌دهی، نقطه…"},
          options:[opt("moves to a new place","تنتقل إلى مكان جديد","به جای جدید می‌رود"),opt("stays exactly where it is","تبقى في مكانها تماماً","دقیقاً همان جا می‌ماند")], answer:1,
          require:p=>state.den!==p.sd, requireMsg:{en:`First use the stepper to change the Equal parts to {parts} — then answer.`,ar:`أولاً غيّر الأجزاء المتساوية إلى {parts} بالمبدّل — ثم أجب.`,fa:`اول با دکمه، بخش‌های مساوی را به {parts} تغییر بده — بعد پاسخ بده.`},
          reveal:p=>({en:`It <b>stays put</b>: ${md(p.start)} and ${md(p.target)} are the same number, so they share the point. New parts just give the same place a new name.`,ar:`تبقى في مكانها: ${md(p.start)} و ${md(p.target)} هما العدد نفسه، فيتشاركان النقطة. الأجزاء الجديدة تعطي المكان نفسه اسماً جديداً.`,fa:`همان جا می‌ماند: ${md(p.start)} و ${md(p.target)} یک عدد هستند و نقطه مشترک دارند. بخش‌های جدید فقط نامی تازه به همان جا می‌دهند.`}) },
        hint:{en:`Equivalent fractions are different names for the same number, so they share a point.`,ar:`الكسور المتكافئة أسماء مختلفة للعدد نفسه، لذا تتشارك النقطة.`,fa:`کسرهای هم‌ارز نام‌های مختلف یک عددند، پس یک نقطه دارند.`},
        further:{ text:{en:`Read the point's new name (with {parts} parts) and enter it as a fraction.`,ar:`اقرأ الاسم الجديد للنقطة (بـ {parts} أجزاء) وأدخله ككسر.`,fa:`نام جدید نقطه (با {parts} بخش) را بخوان و به‌صورت کسر وارد کن.`}, input:{kind:"fraction"},
          check:(p,f)=>{ const v=f.n/f.d, eq=md(fmt(f.n,f.d)+" = "+round2(v));
            if(f.n===p.a&&f.d===p.b) return {ok:true,msg:{en:`Yes — ${md(p.target+" = "+round2(p.tv))}, the very same point as ${md(p.start)}.`,ar:`نعم — ${md(p.target+" = "+round2(p.tv))}، النقطة نفسها مثل ${md(p.start)}.`,fa:`بله — ${md(p.target+" = "+round2(p.tv))}، همان نقطه‌ی ${md(p.start)}.`}};
            if(Math.abs(v-p.tv)<1e-9) return {ok:false,msg:{en:`${eq} is equal, but with ${md(p.parts)} parts the name is ${md(p.target)}.`,ar:`${eq} مساوٍ، لكن بـ ${md(p.parts)} أجزاء الاسم هو ${md(p.target)}.`,fa:`${eq} برابر است، اما با ${md(p.parts)} بخش نامش ${md(p.target)} است.`}};
            return {ok:false,msg:{en:`${eq} — the point is at ${md(round2(p.tv))} with ${md(p.parts)} parts. What's it called?`,ar:`${eq} — النقطة عند ${md(round2(p.tv))} بـ ${md(p.parts)} أجزاء. ماذا تُسمّى؟`,fa:`${eq} — نقطه با ${md(p.parts)} بخش روی ${md(round2(p.tv))} است. نامش چیست؟`}}; },
          reasons:[opt("I read the new name off the line","قرأت الاسم الجديد من الخط","نام جدید را از خط خواندم"),opt("I grouped the small parts into bigger ones","جمعت الأجزاء الصغيرة في أكبر","بخش‌های کوچک را در بزرگ‌تر گروه کردم"),opt("I kept the same point","حافظت على النقطة نفسها","همان نقطه را نگه داشتم")] } },

      { id:"s3", title:{en:"Squeeze in between",ar:"اعثر على كسر بينهما",fa:"جا دادن در میان"}, tags:["Construct","Density"],
        prompt:{en:`Make a fraction that sits <b>between 0.3 and 0.4</b>. Turn on <b>Decimal</b> to check. Then find a <b>different</b> one — how many do you think fit in the gap?`,
                ar:`اصنع كسراً يقع <b>بين 0.3 و 0.4</b>. شغّل <b>العدد العشري</b> للتحقق. ثم اعثر على كسر <b>مختلف</b> — كم كسراً تظنّ أنه يقع في الفجوة؟`,
                fa:`کسری بساز که <b>بین 0.3 و 0.4</b> باشد. برای بررسی <b>اعشاری</b> را روشن کن. سپس یکی <b>دیگر</b> پیدا کن — فکر می‌کنی چند تا در این فاصله جا می‌شود؟`},
        chips:["dec"], gen:()=>{ const t=rint(2,8); return {t,lo:round1(t/10),hi:round1((t+1)/10)}; },
        setup:p=>{ setChips(false,true,false); setV(p.t,10); },
        check:p=>{ const v=val(), eq=md(fmt(state.num,state.den)+" = "+round2(v));
          if(between(p.lo,p.hi)) return {tone:"ok",msg:{en:`${eq} — between ${md(p.lo)} and ${md(p.hi)}. Now find another with different parts. Could you keep finding more?`,ar:`${eq} — بين ${md(p.lo)} و ${md(p.hi)}. الآن اعثر على آخر بأجزاء مختلفة. هل يمكنك إيجاد المزيد باستمرار؟`,fa:`${eq} — بین ${md(p.lo)} و ${md(p.hi)}. حالا یکی دیگر با بخش‌های متفاوت پیدا کن. می‌توانی همیشه بیشتر پیدا کنی؟`}};
          return {tone:"nudge",msg:{en:`${eq} — ${v<p.lo?"too small, drag right":"too big, drag left"}. Aim between ${md(p.lo)} and ${md(p.hi)} (more parts gives smaller steps).`,ar:`${eq} — ${v<p.lo?"صغير جداً، اسحب يميناً":"كبير جداً، اسحب يساراً"}. استهدف بين ${md(p.lo)} و ${md(p.hi)} (أجزاء أكثر = خطوات أصغر).`,fa:`${eq} — ${v<p.lo?"خیلی کوچک، به راست بکش":"خیلی بزرگ، به چپ بکش"}. هدف بین ${md(p.lo)} و ${md(p.hi)} (بخش بیشتر = گام کوچک‌تر).`}}; },
        hint:{en:`Tenths land ON {lo} and {hi}. Use more parts (like 20 or 100) to fit between.`,ar:`الأعشار تقع على {lo} و {hi}. استخدم أجزاء أكثر (مثل 20 أو 100) لتقع بينهما.`,fa:`دهم‌ها روی {lo} و {hi} می‌افتند. برای جا شدن در میان از بخش بیشتر (مثل 20 یا 100) استفاده کن.`},
        further:{ text:{en:`How many fractions fit between {lo} and {hi}?`,ar:`كم كسراً يقع بين {lo} و {hi}؟`,fa:`چند کسر بین {lo} و {hi} جا می‌شود؟`}, input:{kind:"choice",options:[opt("just a few","قليلة فقط","فقط چند تا"),opt("lots, but a fixed number","كثيرة، لكن عدد محدود","زیاد، اما تعداد معیّن"),opt("infinitely many","عدد لا نهائي","بی‌نهایت")]},
          check:(p,i)=>({ ok:i===2, msg:i===2?{en:`Right — infinitely many. You can always cut into more parts and fit another one in.`,ar:`صحيح — عدد لا نهائي. يمكنك دائماً التقسيم إلى أجزاء أكثر وإيجاد كسر آخر.`,fa:`درست — بی‌نهایت. همیشه می‌توانی به بخش‌های بیشتر تقسیم کنی و یکی دیگر جا دهی.`}:{en:`Think about using more and more parts — is there ever a 'last' one?`,ar:`فكّر في استخدام أجزاء أكثر فأكثر — هل هناك كسر 'أخير'؟`,fa:`به بخش‌های بیشتر و بیشتر فکر کن — آیا اصلاً «آخری» وجود دارد؟`} }),
          reasons:[opt("I can always split into more parts","يمكنني دائماً التقسيم إلى أجزاء أكثر","همیشه می‌توانم به بخش بیشتر تقسیم کنم"),opt("There's always room for one more","هناك دائماً متسع لواحد آخر","همیشه جا برای یکی دیگر هست"),opt("Bigger denominators make smaller gaps","المقامات الأكبر تصنع فجوات أصغر","مخرج بزرگ‌تر فاصله کوچک‌تر می‌سازد")] } },

      { id:"s4", title:{en:"Does it stop, or go forever?",ar:"هل ينتهي أم يستمر؟",fa:"تمام می‌شود یا بی‌پایان است؟"}, tags:["Recurring","Reasoning"],
        prompt:{en:`Make a fraction whose decimal <b>never ends</b> (it recurs — watch for the dots). Then make one that <b>stops</b> exactly. What's different about the number of equal parts?`,
                ar:`اصنع كسراً عدده العشري <b>لا ينتهي</b> (دوري — راقب النقاط). ثم اصنع كسراً <b>ينتهي</b> تماماً. ما الفرق في عدد الأجزاء المتساوية؟`,

        chips:["dec"], gen:()=>{ const s=pick([[1,2],[3,4],[2,5],[1,4],[3,8],[1,5],[7,10],[3,10]]); return {sn:s[0],sd:s[1]}; },
        setup:p=>{ setChips(false,true,false); setV(p.sn,p.sd); },
        check:p=>{ const t=terminating(state.num,state.den), eq=md(fmt(state.num,state.den)+" = "+decimalStr(state.num,state.den));
          if(!t) return {tone:"ok",msg:{en:`${eq} — it recurs. Now make one that stops. What factors do the 'stopping' ones have?`,ar:`${eq} — إنه دوري. الآن اصنع كسراً ينتهي. ما عوامل الكسور 'المنتهية'؟`,fa:`${eq} — متناوب است. حالا یکی بساز که متوقف شود. مخرجِ کسرهای «متوقف‌شونده» چه عامل‌هایی دارد؟`}};
          return {tone:"nudge",msg:{en:`${eq} — that one stops (its decimal ends). Change it to a fraction whose decimal never ends.`,ar:`${eq} — هذا ينتهي (عدده العشري ينتهي). غيّره إلى كسر لا ينتهي عدده العشري.`,fa:`${eq} — این متوقف می‌شود (اعشارش تمام می‌شود). به کسری تغییرش بده که اعشارش تمام نشود.`}}; },
        hint:{en:`Some denominators give a decimal that stops; others go on forever. Try a few and watch for the dots.`,ar:`بعض المقامات تعطي عدداً عشرياً ينتهي، وأخرى تستمر. جرّب عدة كسور وراقب النقاط.`,fa:`بعضی مخرج‌ها اعشار متوقف می‌دهند، بعضی بی‌پایان. چند تا امتحان کن و به نقطه‌ها نگاه کن.`},
        further:{ text:{en:`Make a recurring decimal with a <b>2-digit repeating block</b> (like 0.1̇8̇). Enter the fraction.`,ar:`اصنع عدداً عشرياً دورياً بكتلة تكرار من <b>رقمين</b> (مثل 0.1̇8̇). أدخل الكسر.`,fa:`یک اعشار متناوب با <b>دوره‌ی تکرار ۲ رقمی</b> بساز (مثل 0.1̇8̇). کسر را وارد کن.`}, input:{kind:"fraction"},
          check:(p,f)=>{ if(f.d<2||f.d>100) return {ok:false,msg:UI.range2100}; const t=terminating(f.n,f.d), rep=decimalParts(f.n,f.d).rep, eq=md(fmt(f.n,f.d)+" = "+decimalStr(f.n,f.d));
            if(t) return {ok:false,msg:{en:`${md(fmt(f.n,f.d))} stops — you need one that recurs.`,ar:`${md(fmt(f.n,f.d))} ينتهي — تحتاج كسراً دورياً.`,fa:`${md(fmt(f.n,f.d))} متوقف می‌شود — به یکی متناوب نیاز داری.`}};

          reasons:[opt("I checked how long the repeating block was","تحققت من طول كتلة التكرار","طول دوره‌ی تکرار را بررسی کردم"),opt("I tried a few denominators and watched the dots","جربت عدة مقامات وراقبت النقاط","چند مخرج امتحان کردم و نقطه‌ها را دیدم"),opt("I reasoned about the denominator's factors","استدللت من عوامل المقام","درباره‌ی عامل‌های مخرج استدلال کردم")] } },

      { id:"s5", title:{en:"Sharing it out (fraction as division)",ar:"التوزيع (الكسر كقسمة)",fa:"تقسیم کردن (کسر به‌عنوان تقسیم)"}, tags:["Division","Reasoning"],

    let cur=0, predictChoice=-1;
    const done=new Set(), extMet=new Set(), reasonSel={}, P={};
    function stageP(id){ if(!P[id]){ const st=STAGES.find(x=>x.id===id); P[id]= (st&&st.gen)? st.gen():{}; } return P[id]; }
    function fbShow(tone,msgObj,vars){ const f=$("feedback"); f.className="feedback show "+tone; f.innerHTML=L(msgObj,vars); }
    function fbClear(){ const f=$("feedback"); f.className="feedback"; f.innerHTML=""; }
    function renderDots(){ const d=$("dots"); d.innerHTML=""; STAGES.forEach((s,i)=>{ const b=document.createElement("button"); b.className="dot"+(i===cur?" current":"")+(done.has(s.id)?" done":""); b.textContent=done.has(s.id)?"✓":String(i+1); b.title=(s.title[LANG]||s.title.en); b.addEventListener("click",()=>goStage(i)); d.appendChild(b); }); }
    function goStage(i){ cur=Math.max(0,Math.min(STAGES.length-1,i)); const s=STAGES[cur]; const p=stageP(s.id); predictChoice=-1; fbClear();
      $("stageLine").innerHTML = L(UI.stageOf,{n:cur+1,t:STAGES.length}) + L(s.title);
      $("tags").innerHTML=s.tags.map(t=>`<span class="tag">${L(TAGS[t]||{en:t})}</span>`).join("");
      $("prompt").innerHTML=L(s.prompt,p); $("hintText").innerHTML=L(s.hint||{en:""},p);
      document.querySelectorAll(".disc details").forEach(x=>x.open=false);
      renderFurther(s,p);
      $("partB").hidden = !done.has(s.id);
      const pr=$("predictRow");
      if(s.predict){ pr.hidden=false; const opts=(typeof s.predict.options==="function")?s.predict.options(p):s.predict.options;
        pr.innerHTML=`<span class="plabel">${L(s.predict.label,p)}</span>`+opts.map((o,i)=>`<button class="pchip" data-i="${i}" type="button" aria-pressed="false">${L(o,p)}</button>`).join("");
        pr.querySelectorAll(".pchip").forEach(b=>b.addEventListener("click",()=>{ predictChoice=+b.dataset.i; pr.querySelectorAll(".pchip").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false")); }));
        $("checkBtn").innerHTML=L(UI.checkPrediction); }
      else { pr.hidden=true; pr.innerHTML=""; $("checkBtn").innerHTML=L(UI.checkThinking); }
      $("shareBtn").hidden=!s.share;
      if(state.animMode) exitAnim();
      suggestChips(s.chips||[]);
      if(s.setup) s.setup(p);
      $("prevBtn").disabled=cur===0; $("nextBtn").disabled=cur===STAGES.length-1;
      renderDots(); saveLocal();
    }
    function renderFurther(s,p){
      const f=s.further, inp=$("furtherInput"), rz=$("furtherReasons"), fb=$("furtherFb");
      $("furtherText").innerHTML=L((f&&f.text)||{en:""},p); fb.className="ffb"; fb.innerHTML=""; inp._sel=-1;
      if(!f||!f.input){ inp.innerHTML=""; rz.innerHTML=""; $("furtherCheck").style.display="none"; return; }
      $("furtherCheck").style.display=""; $("furtherCheck").innerHTML=L(UI.checkPartB);
      if(f.input.kind==="fraction") inp.innerHTML=`<span class="fin"><input class="fbox" id="fNum" inputmode="numeric" placeholder="?" autocomplete="off"><span class="fbar"></span><input class="fbox" id="fDen" inputmode="numeric" placeholder="?" autocomplete="off"></span>`;
      else if(f.input.kind==="number") inp.innerHTML=`<input class="fbox wide" id="fVal" inputmode="numeric" placeholder="?" autocomplete="off">`;
      else if(f.input.kind==="choice"){ inp.innerHTML=`<div class="fchips">`+f.input.options.map((o,i)=>`<button class="fchoice" data-i="${i}" type="button" aria-pressed="false">${L(o,p)}</button>`).join("")+`</div>`;
        inp.querySelectorAll(".fchoice").forEach(b=>b.addEventListener("click",()=>{ inp._sel=+b.dataset.i; inp.querySelectorAll(".fchoice").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false")); })); }
      const chosen=reasonSel[s.id]||[];
      rz.innerHTML=`<div class="rlabel">${L(UI.howKnow)}</div>`+
        (f.reasons||[]).map((r,i)=>`<button class="rchip${chosen.indexOf(i)>=0?' on':''}" data-i="${i}" type="button" aria-pressed="${chosen.indexOf(i)>=0}">${L(r,p)}</button>`).join("");
      rz.querySelectorAll(".rchip").forEach(b=>b.addEventListener("click",()=>{ const i=+b.dataset.i; const arr=reasonSel[s.id]||(reasonSel[s.id]=[]); const q=arr.indexOf(i); if(q>=0)arr.splice(q,1); else arr.push(i); const on=arr.indexOf(i)>=0; b.classList.toggle("on",on); b.setAttribute("aria-pressed",on); saveLocal(); if(signedIn) autoSave(); }));
    }
    function ffbShow(ok,msgObj,vars){ const fb=$("furtherFb"); fb.className="ffb show "+(ok?"ok":"nudge"); fb.innerHTML=L(msgObj,vars); }
    function furtherCheck(){
      const s=STAGES[cur], p=stageP(s.id), f=s.further, inp=$("furtherInput"); if(!f||!f.input) return; let r;
      if(f.input.kind==="fraction"){ const n=parseInt(($("fNum")||{}).value,10), d=parseInt(($("fDen")||{}).value,10); if(!(n>=0)||!(d>=1)){ ffbShow(false,UI.typeFrac); return; } r=f.check(p,{n,d}); }
      else if(f.input.kind==="number"){ const v=parseInt(($("fVal")||{}).value,10); if(!(v>=0)){ ffbShow(false,UI.typeNum); return; } r=f.check(p,v); }
      else { const sel=inp._sel; if(sel==null||sel<0){ ffbShow(false,UI.pickOne); return; } r=f.check(p,sel); }
      ffbShow(r.ok, r.msg);
      if(r.ok){ extMet.add(s.id); updateProgress(); saveLocal(); if(signedIn) autoSave(); }
    }
    $("furtherCheck").addEventListener("click",furtherCheck);
    function markDone(){ const s=STAGES[cur]; $("partB").hidden=false; if(!done.has(s.id)){ done.add(s.id); renderDots(); updateProgress(); saveLocal(); if(signedIn) autoSave(); } }
    function combine(prefixObj,vars,revObj,extraObj){ const j={}; ["en","ar","fa"].forEach(k=>{ j[k]=fill(prefixObj[k]||prefixObj.en,vars)+(revObj[k]||revObj.en)+((extraObj&&(extraObj[k]||extraObj.en))||""); }); return j; }
    function evaluate(){ const s=STAGES[cur], p=stageP(s.id);
      if(s.predict){
        if(s.predict.require && !s.predict.require(p)){ fbShow("nudge", s.predict.requireMsg||UI.useToolFirst, p); return; }
        if(predictChoice<0){ fbShow("nudge",UI.chooseFirst); return; }
        const opts=(typeof s.predict.options==="function")?s.predict.options(p):s.predict.options;
        const ans=(typeof s.predict.answer==="function")?s.predict.answer(p):s.predict.answer;
        const ok=predictChoice===ans, rv=s.predict.reveal(p), o=opts[predictChoice];
        if(ok){ fbShow("ok", combine(UI.chose,{opt:(o[LANG]||o.en)}, rv, s.share?UI.shareHint:null)); markDone(); }
        else { fbShow("nudge", combine(UI.chose,{opt:(o[LANG]||o.en)}, rv, UI.lookAgain)); } }
      else if(s.check){ const r=s.check(p); fbShow(r.tone, r.msg); if(r.tone==="ok") markDone(); }
    }
    function updateProgress(){ $("progressText").innerHTML=L(UI.completed,{d:done.size,t:STAGES.length})+(extMet.size?L(UI.extensions,{e:extMet.size}):""); $("saveBtn").disabled=!(signedIn && (done.size>0||extMet.size>0)); }
    $("checkBtn").addEventListener("click",evaluate);
    $("prevBtn").addEventListener("click",()=>goStage(cur-1));
    $("nextBtn").addEventListener("click",()=>goStage(cur+1));
    $("resetBtn").addEventListener("click",()=>{ done.clear(); extMet.clear(); Object.keys(reasonSel).forEach(k=>delete reasonSel[k]); Object.keys(P).forEach(k=>delete P[k]); cur=0; try{localStorage.removeItem(LS);}catch(_){ } updateProgress(); goStage(0); });

    // ---------- static UI translation ----------
    function applyLang(){
      try{ localStorage.setItem("mmt-ftq-lang",LANG); }catch(_){ }
      document.querySelectorAll("#langTog button").forEach(b=>b.classList.toggle("on",b.dataset.lang===LANG));
      $("ttlTop").innerHTML=L(UI.title);
      $("siPrompt").innerHTML=L(UI.siPrompt);
      $("codeInput").setAttribute("placeholder", UI.codeph[LANG]||UI.codeph.en);
      $("signinBtn").innerHTML=L(UI.signIn); $("skipBtn").innerHTML=L(UI.justExplore);
      $("resetBtn").innerHTML=L(UI.startover);
      $("lblPartA").innerHTML=L(UI.partA); $("lblPartB").innerHTML=L(UI.partB);
      $("lblParts").innerHTML=L(UI.partsLabel);
      $("barChip").innerHTML='<span class="d"></span>'+L(UI.chipBar);
      $("decChip").innerHTML='<span class="d"></span>'+L(UI.chipDec);
      $("simChip").innerHTML='<span class="d"></span>'+L(UI.chipSim);
      $("hintSummary").innerHTML=L(UI.hint);
      $("prevBtn").innerHTML=L(UI.prev); $("nextBtn").innerHTML=L(UI.next);
      $("saveBtn").innerHTML=L(UI.save);
      if(!state.animMode) $("shareBtn").innerHTML=L(UI.share);
      updateProgress(); goStage(cur);
    }
    $("langTog").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return; LANG=b.dataset.lang; applyLang(); });

    // ---------- local resume ----------
    const LS="mmt-ftq-progress-v1";
    function saveLocal(){ try{ localStorage.setItem(LS, JSON.stringify({cur, done:[...done], ext:[...extMet], reasons:reasonSel})); }catch(_){ } }
    function loadLocal(){ try{ const j=JSON.parse(localStorage.getItem(LS)||"null"); if(j){ (j.done||[]).forEach(x=>done.add(x)); (j.ext||[]).forEach(x=>extMet.add(x)); if(j.reasons) Object.assign(reasonSel,j.reasons); cur=Math.max(0,Math.min(STAGES.length-1,j.cur||0)); } }catch(_){ } }

    // ================= SECURE SAVE (optional) =================
    let mmt=null, signedIn=false, lastSaved="", saveTimer=null;
    async function loadQuiz(){ if(mmt) return mmt; mmt=(await import("/portal/shared/quizClient.js")).MMTQuiz; mmt.init(); return mmt; }
    function payload(){ const types=[...done]; extMet.forEach(id=>types.push("ext:"+id)); Object.keys(reasonSel).forEach(id=>(reasonSel[id]||[]).forEach(i=>types.push("why:"+id+":"+i)));
      return { tool:"Fractions Number Line Quiz — Student", topic:"Fractions, Decimals and Percentages", level:"Quiz", score:done.size, total:STAGES.length, types }; }
    function progSig(){ let rc=0; Object.keys(reasonSel).forEach(id=>rc+=(reasonSel[id]||[]).length); return done.size+"|"+extMet.size+"|"+rc; }
    function autoSave(){ if(!signedIn) return; clearTimeout(saveTimer); saveTimer=setTimeout(async()=>{ if(progSig()===lastSaved) return; try{ const q=await loadQuiz(); await q.saveAchievement(payload()); lastSaved=progSig(); }catch(_){ } },1800); }
    $("signinBtn").addEventListener("click",async()=>{ const code=$("codeInput").value.trim(), msg=$("signinMsg"); msg.style.color="var(--pink)"; msg.innerHTML="";
      if(!code){ msg.innerHTML=L(UI.enterCode); return; } msg.style.color="var(--muted)"; msg.innerHTML=L(UI.checking);
      try{ const q=await loadQuiz(); const res=await q.signIn(code); if(res.ok){ signedIn=true; const nm=(res.profile&&(res.profile.firstName||res.profile.name))||""; $("whoami").textContent="👤 "+nm; $("signinBar").classList.add("hide"); updateProgress(); autoSave(); }
        else { msg.style.color="var(--pink)"; msg.textContent=res.error||"Could not sign in."; } }
      catch(e){ msg.style.color="var(--pink)"; msg.innerHTML=L(UI.signUnavail); } });
    $("skipBtn").addEventListener("click",()=>{ $("signinBar").classList.add("hide"); $("whoami").innerHTML=L(UI.working); });
    $("codeInput").addEventListener("keydown",e=>{ if(e.key==="Enter") $("signinBtn").click(); });
    $("saveBtn").addEventListener("click",async()=>{ const msg=$("saveMsg"); msg.style.color="var(--muted)"; msg.innerHTML=L(UI.saving);
      try{ const q=await loadQuiz(); const res=await q.saveAchievement(payload()); if(res&&res.saved){ lastSaved=progSig(); msg.style.color="var(--green-dark)"; msg.innerHTML=L(UI.saved); } else { msg.style.color="var(--pink)"; msg.innerHTML=L(UI.signFirst); } }
      catch(e){ msg.style.color="var(--pink)"; msg.innerHTML=L(UI.saveErr); } });

    // init
    loadLocal(); render(); applyLang();
  })();
  </script>
</body>
</html>
