<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Bin Toss: Student Interactive | Mills Maths Tools</title>
  <meta name="description" content="A 3D classroom game. Choose your spot, set your throwing angle, time the power meter and collect data on how often the paper goes in the bin. Then set a cost to play and run the prize stall for a profit." />
  <script src="/portal/shared/portalHandoff.js?v=16b9c759" data-input="#btCode" data-button="#btCodeGo"></script>
  <style>
:root{--bg:#f8fafc;--ink:#0f172a;--muted:#64748b;--border:#e2e8f0;--soft:#f1f5f9;--blue:#2563eb;--blue-dark:#1d4ed8;
  --green:#16a34a;--green-dark:#15803d;--red:#dc2626;--orange:#f97316;--purple:#7c3aed;--amber:#f59e0b;
  --uiFont:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --glass:rgba(255,255,255,.94);--shadow:0 14px 34px rgba(15,23,42,.2)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--uiFont);color:var(--ink);background:#0f172a;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input{font:inherit}
[hidden]{display:none!important}
.app{height:100dvh;display:flex;flex-direction:column;min-width:0}

/* ---------- topbar (shared MMT shell) ---------- */
.mmtTopbar{position:relative;z-index:40;flex:0 0 auto;background:linear-gradient(135deg,#0f172a,#123b7a 55%,#2563eb);color:#fff;padding:10px 20px;
  display:grid;grid-template-columns:minmax(150px,1fr) auto minmax(150px,1fr);align-items:center;gap:14px;box-shadow:0 10px 28px rgba(15,23,42,.22)}
.mmtBrand{display:flex;align-items:center;gap:12px;justify-self:start;text-decoration:none;color:#fff;border-radius:14px;padding:6px 10px;margin-left:-10px;font-weight:900}
.mmtBrand:hover{background:rgba(255,255,255,.12)}
.mmtBrandLogo{width:40px;height:40px;border-radius:9px;background:#fff;color:#1d4ed8;display:grid;place-items:center;font-weight:1000;letter-spacing:-.08em;flex:0 0 auto}
.mmtBrandText strong{display:block;font-size:1.1rem;line-height:1;letter-spacing:-.03em}
.mmtBrandText span{display:block;font-size:.76rem;opacity:.82;font-weight:650}
.mmtTopTitle{font-weight:850;font-size:clamp(1rem,1.7vw,1.35rem);letter-spacing:-.03em;text-align:center;white-space:nowrap}
.mmtTopTitle small{display:block;font-size:.68rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#fcd34d;margin-bottom:1px}
.topActions{justify-self:end;display:flex;align-items:center;gap:8px}
.btn{appearance:none;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.14);color:#fff;padding:9px 13px;border-radius:13px;font-weight:900;font-size:14px;cursor:pointer;transition:.18s ease;user-select:none;white-space:nowrap}
.btn:hover:not(:disabled){background:rgba(255,255,255,.22);transform:translateY(-1px)}
.btn:focus-visible{outline:none;box-shadow:0 0 0 4px rgba(255,255,255,.3)}
.btn-primary{background:#fff;color:#1d4ed8;border-color:#fff}
.btn-primary:hover:not(:disabled){background:#eef2ff}
.btn.icon{padding:9px 11px;min-width:42px}

/* ---------- stage ---------- */
#stage{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;background:linear-gradient(#bfdbfe,#e0f2fe)}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.hud{position:absolute;pointer-events:none;z-index:5}
.hud>*{pointer-events:auto}
.cardG{background:var(--glass);border:1px solid rgba(226,232,240,.9);border-radius:18px;box-shadow:var(--shadow);backdrop-filter:blur(6px)}
.eyebrow{font-size:.68rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}

/* status (top-left) */
#status{left:14px;top:14px;width:min(300px,calc(100vw - 28px))}
#status .cardG{padding:12px 14px}
.stTop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:4px 10px;font-size:.7rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;background:#eef2ff;color:var(--blue-dark)}
.chip.money{background:#f5f3ff;color:#6d28d9}
.stSpot{font-weight:850;font-size:.92rem}
.stThrow{margin-top:8px;font-weight:800;color:var(--muted);font-size:.86rem}
.dots{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px;min-height:14px}
.dots i{width:14px;height:14px;border-radius:50%;background:#e2e8f0;display:block}
.dots i.in{background:var(--green-dark)}
.dots i.out{background:#f87171}
.dots i.now{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--blue)}
.counts{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:7px;margin-top:10px}
.cnt{border-radius:12px;padding:6px 9px;background:var(--soft);border:1px solid var(--border)}
.cnt small{display:block;font-size:.62rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.cnt b{font-size:1.35rem;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.15}
.cnt.in{background:#f0fdf4;border-color:#bbf7d0}.cnt.in b{color:var(--green-dark)}
.cnt.out{background:#fef2f2;border-color:#fecaca}.cnt.out b{color:#b91c1c}
.cnt.p b{font-size:1.15rem}
.cnt.p b span{font-size:.8rem;color:var(--muted);font-weight:800}
.stLinks{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.lnk{appearance:none;border:1px solid var(--border);background:#fff;border-radius:10px;padding:6px 10px;font-weight:800;font-size:.78rem;color:var(--ink);cursor:pointer}
.lnk:hover{background:#eef2ff;color:var(--blue-dark);border-color:#c7d2fe}
.lnk.go{background:var(--blue);border-color:var(--blue);color:#fff}
.lnk.go:hover{background:var(--blue-dark);color:#fff}

/* money (stall) */
.moneyG{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}
.moneyG .cnt.wide{grid-column:1/-1;display:flex;align-items:baseline;justify-content:space-between}
.moneyG .cnt.wide b{font-size:1.7rem}
.pos{color:var(--green-dark)!important}.neg{color:#b91c1c!important}
.qRow{display:flex;align-items:center;justify-content:space-between;margin-top:9px;font-weight:800;font-size:.86rem;color:var(--muted)}
.qRow b{color:var(--ink)}

/* controls (right) */
#controls{right:14px;top:50%;transform:translateY(-50%);width:236px}
#controls .cardG{padding:12px 12px 12px}
.stepPills{display:flex;gap:6px;margin-bottom:10px}
.stepPills span{flex:1;text-align:center;border-radius:99px;padding:5px 4px;font-size:.7rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;background:var(--soft);color:var(--muted);border:1px solid var(--border)}
.stepPills span.on{background:var(--blue);border-color:var(--blue);color:#fff}
.stepPills span.done{background:#dcfce7;border-color:#bbf7d0;color:var(--green-dark)}
.ctlCols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ctl{display:flex;flex-direction:column;align-items:center;gap:6px;border-radius:14px;padding:8px 6px 10px;border:2px solid transparent;transition:.2s}
.ctl.on{border-color:#bfdbfe;background:#eff6ff}
.ctl.off{opacity:.55}
.ctl h4{margin:0;font-size:.68rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.read{font-size:1.9rem;font-weight:900;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.03em}
.read small{font-size:.9rem;color:var(--muted);font-weight:800}
.vTrack{position:relative;width:54px;height:var(--trackH,210px);touch-action:none;cursor:ns-resize;outline:none}
.vTrack .rail{position:absolute;left:50%;top:0;bottom:0;width:14px;transform:translateX(-50%);border-radius:99px;background:linear-gradient(#bfdbfe,#dbeafe);border:1px solid #93c5fd}
.vTrack .fill{position:absolute;left:50%;bottom:0;width:14px;transform:translateX(-50%);border-radius:99px;background:linear-gradient(#60a5fa,#2563eb)}
.vTrack .tick{position:absolute;left:0;width:9px;height:2px;background:#94a3b8;border-radius:1px}
.vTrack .tickL{position:absolute;right:calc(100% - 6px);transform:translate(-8px,50%);font-size:.6rem;font-weight:800;color:var(--muted)}
.vTrack .thumb{position:absolute;left:50%;width:38px;height:38px;border-radius:50%;transform:translate(-50%,50%);background:#fff;border:3px solid var(--blue);box-shadow:0 4px 12px rgba(37,99,235,.35);display:grid;place-items:center;color:var(--blue);font-weight:900;font-size:.9rem}
.vTrack:focus-visible .thumb{box-shadow:0 0 0 4px rgba(37,99,235,.3)}
.ctl.off .vTrack{cursor:default}
.meter{position:relative;width:54px;height:var(--trackH,210px)}
.meter .bar{position:absolute;left:50%;top:0;bottom:0;width:30px;transform:translateX(-50%);border-radius:10px;overflow:hidden;border:2px solid #1e293b;
  background:linear-gradient(to top,#38bdf8 0%,#a3e635 38%,#facc15 62%,#fb923c 82%,#ef4444 100%)}
.meter .zone{position:absolute;left:0;right:0;min-height:7px;background:#15803d;border-top:2px solid #fff;border-bottom:2px solid #fff;box-shadow:0 0 0 1px #14532d,0 0 9px 2px rgba(255,255,255,.95)}
.meter .zoneL{position:absolute;right:calc(100% - 4px);text-align:right;transform:translateY(50%);font-size:.56rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:#15803d;border-radius:5px;padding:2px 4px;white-space:nowrap;line-height:1.05}
.meter .mark{position:absolute;left:-3px;right:-3px;height:8px;transform:translateY(50%);border-radius:4px;background:#0f172a;border:2px solid #fff;box-shadow:0 2px 6px rgba(15,23,42,.5)}
.meter .mark::before,.meter .mark::after{content:"";position:absolute;top:50%;border:6px solid transparent;transform:translateY(-50%)}
.meter .mark::before{right:100%;border-right-color:#0f172a}
.meter .mark::after{left:100%;border-left-color:#0f172a}
.noZone{font-size:.66rem;font-weight:800;color:#b91c1c;text-align:center;line-height:1.2;min-height:2.4em}
.zoneNote{font-size:.66rem;font-weight:800;color:var(--green-dark);text-align:center;line-height:1.2;min-height:2.4em}
.bigBtn{appearance:none;width:100%;margin-top:10px;border:none;border-radius:16px;padding:14px 10px;font-weight:1000;font-size:1.12rem;letter-spacing:.01em;color:#fff;cursor:pointer;
  background:linear-gradient(180deg,#3b82f6,#1d4ed8);box-shadow:0 5px 0 #1e3a8a,0 12px 22px rgba(37,99,235,.35);transition:transform .08s,box-shadow .08s}
.bigBtn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 #1e3a8a}
.bigBtn.throw{background:linear-gradient(180deg,#fb923c,#ea580c);box-shadow:0 5px 0 #9a3412,0 12px 22px rgba(234,88,12,.4);animation:pulse 1s infinite}
.bigBtn:disabled{filter:grayscale(.7);opacity:.6;cursor:default;animation:none}
.bigBtn kbd{font:inherit;font-size:.68rem;font-weight:900;opacity:.85;border:1px solid rgba(255,255,255,.6);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle}
@keyframes pulse{50%{filter:brightness(1.12)}}
.backLnk{display:block;margin:8px auto 0;appearance:none;border:none;background:none;color:var(--muted);font-weight:800;font-size:.78rem;cursor:pointer;text-decoration:underline}

/* pop text */
#pop{left:50%;top:26%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}
#pop .pp{display:inline-block;border-radius:99px;padding:10px 26px;font-weight:1000;font-size:clamp(1.6rem,4vw,2.6rem);color:#fff;letter-spacing:.02em;box-shadow:0 12px 30px rgba(15,23,42,.35);animation:popIn .5s cubic-bezier(.2,1.6,.4,1) both}
#pop .pp.in{background:linear-gradient(180deg,#22c55e,#15803d)}
#pop .pp.out{background:linear-gradient(180deg,#f87171,#b91c1c)}
#pop .why{display:block;margin-top:8px;font-weight:850;font-size:1rem;color:#0f172a;background:rgba(255,255,255,.92);border-radius:99px;padding:4px 14px;animation:popIn .5s .08s both}
#pop .cash{display:block;margin-top:6px;font-weight:1000;font-size:1.3rem;text-shadow:0 1px 0 #fff,0 0 8px #fff}
@keyframes popIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
#hint{left:50%;bottom:14px;transform:translateX(-50%);font-weight:800;font-size:.86rem;color:#0f172a;background:rgba(255,255,255,.9);border-radius:99px;padding:7px 16px;box-shadow:0 6px 16px rgba(15,23,42,.18);max-width:calc(100vw - 28px);text-align:center}
#skip{right:14px;bottom:14px}
#skip button{appearance:none;border:none;border-radius:14px;padding:11px 16px;font-weight:900;background:#0f172a;color:#fff;cursor:pointer;box-shadow:var(--shadow)}

/* panels */
#veil{position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:14px;background:rgba(15,23,42,.38);overflow:auto}
#veil.clear{background:rgba(15,23,42,.12);place-items:end center;pointer-events:none}
#veil.clear .panel{pointer-events:auto;margin-bottom:6px}
.panel{width:min(640px,100%);background:#fff;border-radius:24px;box-shadow:0 30px 70px rgba(15,23,42,.4);padding:24px 26px 22px;animation:rise .35s cubic-bezier(.2,1,.3,1) both;max-height:100%;overflow:auto}
.panel.wide{width:min(760px,100%)}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
.panel h2{margin:4px 0 8px;font-size:clamp(1.35rem,3vw,1.85rem);letter-spacing:-.03em;line-height:1.12}
.panel p{margin:0 0 12px;line-height:1.45;color:#334155}
.panel p b{color:var(--ink)}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 18px}
.steps3 div{border-radius:16px;border:1px solid var(--border);background:var(--soft);padding:12px;font-size:.88rem;line-height:1.35;color:#334155}
.steps3 b{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:.95rem;margin-bottom:4px}
.steps3 i{font-style:normal;width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#1e3a6e,#2563eb);color:#fff;display:grid;place-items:center;font-weight:900;flex:0 0 auto}
.prizeRow{display:flex;align-items:center;gap:16px}
.prizeRow svg{width:128px;flex:0 0 auto;transform:rotate(-4deg);filter:drop-shadow(0 6px 10px rgba(15,23,42,.2))}
.pBtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.pb{appearance:none;border:1px solid var(--border);background:#fff;border-radius:14px;padding:12px 16px;font-weight:900;cursor:pointer;color:var(--ink);font-size:.95rem}
.pb:hover:not(:disabled){background:#eef2ff;border-color:#c7d2fe;color:var(--blue-dark)}
.pb.main{flex:1 1 200px;border:none;color:#fff;background:linear-gradient(90deg,#2563eb,#7c3aed);box-shadow:0 8px 20px rgba(37,99,235,.3);font-size:1.05rem}
.pb.main:hover:not(:disabled){filter:brightness(1.08);color:#fff;background:linear-gradient(90deg,#2563eb,#7c3aed);border:none}
.pb:disabled{opacity:.45;cursor:default}
.spotCards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.spotCard{appearance:none;text-align:left;border:2px solid var(--border);background:#fff;border-radius:18px;padding:12px 13px;cursor:pointer;transition:.15s;color:var(--ink)}
.spotCard:hover,.spotCard:focus-visible{border-color:var(--blue);background:#eff6ff;transform:translateY(-2px);outline:none}
.spotCard .m{font-size:1.7rem;font-weight:1000;letter-spacing:-.03em;line-height:1}
.spotCard .m small{font-size:.85rem;font-weight:800;color:var(--muted)}
.spotCard b{display:block;margin-top:4px}
.spotCard span{display:block;margin-top:6px;font-size:.8rem;font-weight:750;color:var(--muted)}
.spotCard span.has{color:var(--green-dark)}
.bigFrac{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin:6px 0 12px}
.bigFrac .n{font-size:clamp(2.4rem,7vw,3.6rem);font-weight:1000;letter-spacing:-.04em;line-height:1}
.bigFrac .n small{font-size:.38em;font-weight:850;color:var(--muted);letter-spacing:0}
.eq{display:flex;align-items:center;gap:10px;font-size:1.25rem;font-weight:850;flex-wrap:wrap}
.fr{display:inline-flex;flex-direction:column;text-align:center;line-height:1.05;font-variant-numeric:tabular-nums}
.fr span:first-child{border-bottom:2.5px solid currentColor;padding:0 5px 1px}
.fr span:last-child{padding:1px 5px 0}
table.tb{width:100%;border-collapse:collapse;font-size:.9rem;margin:6px 0 2px}
.tb th{text-align:left;font-size:.66rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:2px solid var(--border)}
.tb td{padding:7px 8px;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums}
.tb .r{text-align:right}
.tb tr.cur td{background:#eff6ff;font-weight:800}
.tb tr.tot td{border-top:2px solid var(--ink);border-bottom:none;font-weight:900;font-size:1.05rem}
.note{border-radius:14px;padding:10px 13px;font-size:.9rem;line-height:1.4;margin:10px 0 0}
.note.blue{background:#eff6ff;border:1px solid #bfdbfe;color:#1e3a8a}
.note.violet{background:#f5f3ff;border:1px solid #ddd6fe;color:#4c1d95}
.note.amber{background:#fffbeb;border:1px solid #fde68a;color:#78350f}
.note b{color:inherit}
/* price */
.priceRow{display:flex;align-items:center;gap:14px;margin:8px 0 4px}
.priceBig{font-size:clamp(2.4rem,7vw,3.4rem);font-weight:1000;letter-spacing:-.04em;min-width:2.6ch;font-variant-numeric:tabular-nums;color:#6d28d9}
.stepper{appearance:none;width:46px;height:46px;border-radius:14px;border:1px solid var(--border);background:var(--soft);font-weight:1000;font-size:1.5rem;cursor:pointer;color:var(--ink)}
.stepper:hover{background:#eef2ff;border-color:#c7d2fe}
input[type=range].hr{flex:1;accent-color:#7c3aed;height:30px;min-width:120px}
.queue{display:flex;flex-wrap:wrap;gap:3px;min-height:26px;margin:4px 0 2px}
.queue i{width:13px;height:24px;display:block;position:relative}
.queue i::before{content:"";position:absolute;left:3px;top:0;width:7px;height:7px;border-radius:50%;background:#f1c9a5}
.queue i::after{content:"";position:absolute;left:1px;top:8px;width:11px;height:15px;border-radius:4px 4px 2px 2px;background:var(--c,#2563eb)}
.qCount{font-weight:900}
.predRow{display:flex;align-items:center;gap:10px;margin-top:12px;font-weight:800;flex-wrap:wrap}
.predRow input{width:74px;border:2px solid var(--border);border-radius:12px;padding:8px 10px;font-weight:900;font-size:1.05rem;text-align:center}
.predRow input:focus{outline:none;border-color:#7c3aed}
.predRow small{font-weight:700;color:var(--muted)}
.stars{font-size:1.6rem;letter-spacing:4px;color:#e2e8f0}
.stars b{color:#f59e0b}
.dayHead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
details.log{margin-top:12px;border:1px solid var(--border);border-radius:14px;padding:8px 12px}
details.log summary{font-weight:900;cursor:pointer}
.kbd{font-size:.7rem;font-weight:900;border:1px solid var(--border);border-bottom-width:2px;border-radius:6px;padding:1px 6px;background:#fff;color:var(--muted)}
/* choose your character */
.chGrp{font-size:.66rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:12px 0 6px}
.chGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:10px}
@media (max-width:700px){.chGrid{grid-template-columns:repeat(4,1fr)}.chImg{width:60px!important;height:75px!important}}
.chCard{appearance:none;border:2px solid var(--border);background:linear-gradient(#f8fafc,#eef2ff);border-radius:16px;padding:6px 4px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink);transition:.15s}
.chCard:hover,.chCard:focus-visible{border-color:var(--blue);transform:translateY(-3px);box-shadow:0 8px 18px rgba(37,99,235,.22);outline:none}
.chCard.on{border-color:var(--blue);background:linear-gradient(#dbeafe,#bfdbfe)}
.chImg{width:72px;height:90px;display:block;background-image:url('chars.webp?v=09b19fd5');background-size:700% 300%;background-repeat:no-repeat}
.chCard b{font-size:.78rem;font-weight:850;line-height:1.15;text-align:center}
#loading{position:absolute;inset:0;display:grid;place-items:center;z-index:30;background:#0f172a;color:#fff;font-weight:800;text-align:center;padding:20px}

@media (max-width:900px){
  .mmtTopbar{grid-template-columns:auto 1fr auto;padding:8px 12px}
  .mmtBrandText{display:none}
  .btn .lbl{display:none}
}
@media (max-width:700px),(max-height:620px){
  #controls{width:196px;right:8px}
  #controls .cardG{padding:9px}
  .vTrack,.meter{--trackH:150px}
  .read{font-size:1.5rem}
  #status{left:8px;top:8px;width:min(232px,calc(100vw - 220px))}
  #status .cardG{padding:9px 10px}
  .cnt b{font-size:1.1rem}.cnt.p b{font-size:.95rem}
  .counts{grid-template-columns:1fr 1fr}.cnt.p{grid-column:1/-1}
  .steps3,.spotCards{grid-template-columns:1fr}
  .panel{padding:18px 16px;border-radius:20px}
  .prizeRow svg{width:92px}
  #hint{display:none}
}

/* ---------------- characters from Mills Maths Adventure ----------------
   All 21 models share one 24-bone skeleton (Hips, Spine…, RightArm, RightForeArm, RightHand…) but none has a throwing clip.
   So the throw is made in code: the arm bones are AIMED at directions for each moment of the throw (hold, wind up, release,
   follow through). One set of directions works for every character, whatever its size or shape. Walking uses each model's
   own walk clip, with the hip translation taken out so the code decides where the figure goes. */
const CHARS=[
  {id:'main1',name:'Explorer'},{id:'main2',name:'Cool Cat'},{id:'main3',name:'DJ Goat'},
  {id:'pip',name:'Pip'},{id:'fern',name:'Fern'},{id:'alby',name:'Alby'},{id:'pete',name:'Pete'},
  {id:'mills',name:'Mr. Mills'},{id:'pearce',name:'Mr. Pearce'},{id:'mahoney',name:'Ms. Mahoney'},{id:'ewings',name:'Ms. Ewings'},
  {id:'dawson',name:'Mr. Dawson'},{id:'heywood',name:'Mr. Heywood'},{id:'morgan',name:'Mr. Morgan'},{id:'bacon',name:'Ms. Bacon'},{id:'brookes',name:'Ms. Brookes'},
  {id:'farmer',name:'Sunny'},{id:'farmer1',name:'The Milkman'},{id:'trevor',name:'Trevor'},{id:'steve',name:'Steve'},{id:'robot',name:'Robot'}
];
const WALK_CLIP={main1:'Running'};                              // main1's clip names are shifted: "Running" holds the walk
const CHAR_URL='../../../../../game-platforms/mills-maths-adventure/models/characters/';
const charName=id=>(CHARS.find(c=>c.id===id)||{name:''}).name;
const gltf=new GLTFLoader();gltf.setMeshoptDecoder(MeshoptDecoder);
const modelCache={};
function loadModel(id){
  return modelCache[id]||(modelCache[id]=gltf.loadAsync(CHAR_URL+id+'.glb').then(g=>{
    const sc=g.scene;sc.updateMatrixWorld(true);const bx=new THREE.Box3().setFromObject(sc),h=bx.max.y-bx.min.y;let sh=h*.7;
    sc.traverse(o=>{if(o.isBone&&o.name==='RightArm'){const v=new THREE.Vector3();o.getWorldPosition(v);sh=v.y-bx.min.y}});
    let walk=g.animations.find(c=>c.name===(WALK_CLIP[id]||'Walking'))||g.animations.find(c=>/walk/i.test(c.name))||null;
    if(walk){walk=walk.clone();walk.tracks=walk.tracks.filter(tr=>!/^Hips\.position$/.test(tr.name))}
    return {scene:sc,walk,scale:clamp(1.05/sh,1.25/h,1.5/h),minY:bx.min.y};   // shoulders near 1.05 m; between 1.25 m and 1.5 m tall
  }).catch(e=>{delete modelCache[id];throw e}));
}
function makeActor(m){
  const root=new THREE.Group(),inner=skClone(m.scene);inner.rotation.y=Math.PI;inner.scale.setScalar(m.scale);inner.position.y=-m.minY*m.scale;root.add(inner);
  const B={},all=[];inner.traverse(o=>{if(o.isBone){B[o.name]=o;all.push([o,o.quaternion.clone(),o.position.clone()])}if(o.isMesh){o.castShadow=true;o.frustumCulled=false}});
  const bind={};for(const n of ['RightArm','RightForeArm','LeftArm','LeftForeArm','Spine','Spine01','Spine02'])if(B[n])bind[n]=B[n].quaternion.clone();
  const low=B.Hips?B.Hips.children.find(c=>c.isBone&&/^Spine/.test(c.name)):null;
  let mixer=null,walk=null;if(m.walk){mixer=new THREE.AnimationMixer(inner);walk=mixer.clipAction(m.walk)}
  return {root,B,bind,low,all,mixer,walk};
}
function restAll(a){for(const [b,q,p] of a.all){b.quaternion.copy(q);b.position.copy(p)}}
// directions in the figure's own frame: +x right, +y up, -z forward
const POSE={hold:{U:[.5,-.35,.2],F:[.05,.95,-.3],lean:0},wind:{U:[.45,.05,.8],F:[.1,.75,.65],lean:.2},rel:{U:[.2,.6,-.75],F:[.02,.8,-.6],lean:-.1},fol:{U:[.05,-.2,-.95],F:[-.15,-.6,-.75],lean:-.28}};
const SHAPES={
  cheer:{RU:[.4,.9,-.1],RF:[.12,1,-.1],LU:[-.4,.9,-.1],LF:[-.12,1,-.1],lean:.1},           // a winner: both arms up
  groan:{RU:[.75,.55,-.2],RF:[-.75,.55,-.1],LU:[-.75,.55,-.2],LF:[.75,.55,-.1],lean:.18}, // the stall owner pays out: hands on head
  pump:{RU:[.55,-.1,-.25],RF:[-.1,.95,-.25],lean:-.05}                                    // the stall owner keeps the money: fist pump
};
const _a=new THREE.Vector3(),_b=new THREE.Vector3(),_d=new THREE.Vector3(),_t=new THREE.Vector3(),_q=new THREE.Quaternion(),_qw=new THREE.Quaternion(),_qp=new THREE.Quaternion(),_qr=new THREE.Quaternion();
function turnWorld(bone,q){bone.getWorldQuaternion(_qw);bone.parent.getWorldQuaternion(_qp);bone.quaternion.copy(_qp.invert().multiply(_q.copy(q).multiply(_qw)))}
function aimBone(bone,child,dir){if(!bone||!child)return;bone.updateWorldMatrix(true,true);_a.setFromMatrixPosition(bone.matrixWorld);_b.setFromMatrixPosition(child.matrixWorld);
  _d.subVectors(_b,_a).normalize();turnWorld(bone,_qr.setFromUnitVectors(_d,dir))}
function poseActor(a,x){
  for(const n in a.bind)a.B[n].quaternion.copy(a.bind[n]);
  if(x==null){a.root.updateMatrixWorld(true);return}
  let A,Bk,k;if(x>=3.3){A=POSE.hold;Bk=POSE.wind;k=(x-3.3)/.4}else if(x>=2.786){A=POSE.rel;Bk=POSE.hold;k=(x-2.786)/.514}else{A=POSE.rel;Bk=POSE.fol;k=(2.786-x)/1.086}
  k=clamp(k,0,1);a.root.updateWorldMatrix(true,false);a.root.getWorldQuaternion(_qp);const rq=_qp.clone();
  const lean=A.lean+(Bk.lean-A.lean)*k;
  if(a.low&&lean){_t.set(1,0,0).applyQuaternion(rq);turnWorld(a.low,_qr.setFromAxisAngle(_t,lean))}
  const dir=(u,v)=>_t.set(u[0]+(v[0]-u[0])*k,u[1]+(v[1]-u[1])*k,u[2]+(v[2]-u[2])*k).normalize().applyQuaternion(rq);
  aimBone(a.B.RightArm,a.B.RightForeArm,dir(A.U,Bk.U).clone());aimBone(a.B.RightForeArm,a.B.RightHand,dir(A.F,Bk.F).clone());
  a.root.updateMatrixWorld(true);
}
function poseShape(a,sh){
  for(const n in a.bind)a.B[n].quaternion.copy(a.bind[n]);
  a.root.updateWorldMatrix(true,false);a.root.getWorldQuaternion(_qp);const rq=_qp.clone(),d=v=>new THREE.Vector3(v[0],v[1],v[2]).normalize().applyQuaternion(rq);
  if(a.low&&sh.lean){_t.set(1,0,0).applyQuaternion(rq);turnWorld(a.low,_qr.setFromAxisAngle(_t,sh.lean))}
  if(sh.RU){aimBone(a.B.RightArm,a.B.RightForeArm,d(sh.RU));aimBone(a.B.RightForeArm,a.B.RightHand,d(sh.RF))}
  if(sh.LU){aimBone(a.B.LeftArm,a.B.LeftForeArm,d(sh.LU));aimBone(a.B.LeftForeArm,a.B.LeftHand,d(sh.LF))}
  a.root.updateMatrixWorld(true);
}
/* A figure on the floor: one of the Adventure characters, or the simple block kid until its model has loaded (or if it can't). */
class Fig{
  constructor(shirt,o){this.g=new THREE.Group();this.box=makeKid(shirt,o);this.g.add(this.box.g);this.actors={};this.actor=null;this.id=null;this.armX=3.3;this.mode='arm';this.walking=false;scene.add(this.g)}
  use(id){this.id=id||null;if(!id){this.swap(null);return Promise.resolve()}
    if(this.actors[id]){this.swap(this.actors[id]);return Promise.resolve()}
    return loadModel(id).then(m=>{if(!this.actors[id])this.actors[id]=makeActor(m);if(this.id===id)this.swap(this.actors[id])}).catch(e=>{console.warn('character',id,e);if(this.id===id)this.swap(null)})}
  swap(a){if(this.actor&&this.actor!==a){this.stopWalk();this.g.remove(this.actor.root)}this.actor=a;this.box.g.visible=!a;if(a){this.g.add(a.root);this.reapply()}}
  reapply(){if(this.walking&&this.actor&&this.actor.walk){this.actor.walk.reset().play();return}if(this.mode==='arm')this.setArm(this.armX);else this.shape(this.mode)}
  tint(c){this.box.sm.color.set(c)}
  cheer(){this.shape('cheer')}
  shape(name){this.mode=name;const sh=SHAPES[name];this.box.arm.rotation.x=name==='pump'?3.0:3.05;if(this.actor&&!this.walking){restAll(this.actor);poseShape(this.actor,sh)}}
  setArm(x){this.mode='arm';this.armX=x;this.box.arm.rotation.x=x==null?0:x;if(this.actor&&!this.walking){if(this._restNeeded){restAll(this.actor);this._restNeeded=false}poseActor(this.actor,x)}}
  startWalk(){this.walking=true;const a=this.actor;if(a&&a.walk){a.walk.reset();a.walk.timeScale=1.15;a.walk.play()}}
  stopWalk(){if(!this.walking)return;this.walking=false;const a=this.actor;if(a&&a.walk){a.walk.stop();restAll(a);this._restNeeded=false}this.box.g.position.y=0}
  update(dt){if(this.walking){if(this.actor&&this.actor.mixer)this.actor.mixer.update(dt);else this.box.g.position.y=Math.abs(Math.sin(performance.now()/90))*.05}}
  hand(out){this.g.updateMatrixWorld(true);
    if(this.actor&&this.actor.B.RightHand){const B=this.actor.B;out.setFromMatrixPosition(B.RightHand.matrixWorld);if(B.RightForeArm){_a.setFromMatrixPosition(B.RightForeArm.matrixWorld);_d.subVectors(out,_a).normalize();out.addScaledVector(_d,.07)}return out}
    out.set(0,-.36,0);return this.box.arm.localToWorld(out)}
}

/* ---------------- the stall ---------------- */
/* Customers throw about as well as the student did: same favourite angle, and the same spread of power around the sweet spot.
   The spread is measured robustly (median miss), so throwing badly on purpose in practice does not make customers bad. */
function customerModel(id){
  const tr=S.data[id],withBand=tr.map(x=>({x,b:P.band(id,x.a)})).filter(o=>o.b);
  let ang;
  if(withBand.length){const as=withBand.map(o=>o.x.a).sort((a,b)=>a-b);ang=as[Math.floor(as.length/2)]}
  else{ang=40;let best=null;for(let a=P.ANGLE.min;a<=P.ANGLE.max;a+=5){const b=P.band(id,a);if(b&&(!best||b.w>best.w)){best=b;ang=a}}}
  const b=P.band(id,ang);
  const errs=withBand.map(o=>Math.abs(o.x.p-o.b.mid)).sort((a,b)=>a-b);
  const med=errs.length?errs[Math.floor(errs.length/2)]:4;
  return {angle:ang,mid:b.mid,sigma:clamp(med/0.6745,1.6,7)};
}
const customerThrow=(id,m)=>P.run(id,m.angle,clamp(m.mid+P.gauss()*m.sigma,0,100),P.noise()).in;
let poolIds=null;
function stallPool(){if(!poolIds){const o=CHARS.map(c=>c.id).filter(id=>id!==S.char);for(let i=o.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[o[i],o[j]]=[o[j],o[i]]}poolIds=o.slice(0,4);poolIds.forEach(id=>loadModel(id).catch(()=>{}))}return poolIds}
function openStall(pred){
  const n=queueFor(S.price,S.prize);if(n<1)return;
  closePanel();clearThrows();save();
  stall={spot:S.spot,price:S.price,prize:S.prize,n,i:0,wins:0,pred,model:customerModel(S.spot),pool:stallPool(),fps:{t:0,f:0}};
  timeScale=1.9;show('controls',false);show('skip',true);hint('');camFor('stall');
  world.kid.g.visible=false;world.ball.visible=false;placeOwner();layoutQueue(true);renderStatus();SFX.lock();
  phase='after';afterT=.5;
}
function placeOwner(){
  const o=world.owner,d=curSpot().d;o.tint('#2563eb');o.use(S.char);o.g.position.set(.62,0,-.38);o.g.rotation.y=Math.atan2(.62,-(d+.38));o.setArm(null);o.g.visible=true;
}
function ownerReact(isIn){const o=world.owner;if(!o.g.visible)return;o.shape(isIn?'groan':'pump');ownerT=isIn?1.1:.7}
function hideStallCast(){world.queue.forEach(k=>k.g.visible=false);world.owner.g.visible=false;world.walker.g.visible=false;world.walker.stopWalk()}
const queueSpot=(j,d)=>{const col=j%3,row=Math.floor(j/3);return [-1.25-col*.48,Math.min(P.ROOM.z1-.5,d+.35+row*.5)]};
function layoutQueue(first){
  const d=curSpot().d,left=stall.n-stall.i-(first?0:1),cap=lowGfx()?3:9;
  world.queue.forEach((k,j)=>{const on=j<Math.min(left,cap);k.g.visible=on;if(!on)return;const [x,z]=queueSpot(j,d);k.tx=x;k.tz=z;
    if(!k.placed||first){k.g.position.set(x,0,z);k.placed=true}k.g.rotation.y=.5;
    const ci=stall.i+(first?0:1)+j;k.tint(QCOL[ci%QCOL.length]);const cid=stall.pool[ci%stall.pool.length];if(k.id!==cid)k.use(cid);k.setArm(null)});
}
function nextCustomer(){
  const d=stall,m=d.model,cid=d.pool[d.i%d.pool.length],col=QCOL[d.i%QCOL.length],dz=curSpot().d;
  world.kid.g.visible=false;world.ball.visible=false;
  launchPlan={spot:d.spot,angle:m.angle,power:clamp(m.mid+P.gauss()*m.sigma,0,100),nz:P.noise()};
  if(lowGfx()){toLine(cid,col);return}
  const [x,z]=queueSpot(0,dz),w=world.walker;w.tint(col);w.use(cid);w.g.position.set(x,0,z);w.g.visible=true;w.startWalk();
  if(world.queue[0])world.queue[0].g.visible=false;
  layoutQueue(false);
  walk={x0:x,z0:z,t:0,dur:Math.hypot(x,z-dz)/1.35,cid,col};phase='walk';
}
function toLine(cid,col){
  const w=world.walker;w.stopWalk();w.g.visible=false;walk=null;
  world.kid.tint(col);world.kid.use(cid);world.kid.g.rotation.y=0;world.kid.g.position.set(0,0,curSpot().d);world.kid.g.visible=true;world.kid.setArm(3.3);holdBall();
  if(lowGfx())layoutQueue(false);
  phase='wind';armT=-.15;renderStatus();
}
function skipStall(){
  if(!stall||phase==='day')return;const d=stall,m=d.model;
  if(phase==='fly'){while(!sim.done)P.step(sim,P.DT);d.i++;if(sim.result==='in')d.wins++}
  if(phase==='wind'||phase==='walk'){}
  while(d.i<d.n){d.i++;if(customerThrow(d.spot,m))d.wins++}
  world.ball.visible=false;$('pop').innerHTML='';endDay();
}
function endDay(){
  phase='day';show('skip',false);const d=stall,c=cnt(d.spot),pr=d.n*d.price-d.wins*d.prize;
  const day={spot:d.spot,price:d.price,prize:d.prize,n:d.n,wins:d.wins,profit:pr,p:c.p,pred:d.pred&&d.pred.result||null,predW:d.pred&&d.pred.winners!=null?d.pred.winners:null,at:Date.now()};
  S.days.push(day);save();renderStatus();hideStallCast();world.kid.g.visible=false;
  if(pr>0)SFX.win();
  checkGoals({day});
  dayPanel(day,S.days.length);
}

/* ---------------- main loop ---------------- */
let last=0;
function frame(now){
  const dt=Math.min(.1,(now-last)/1000||0);last=now;
  cam.sway+=dt;const k=1-Math.pow(.0015,dt);
  const gt=cam.gt.clone();if(phase==='fly'&&sim)gt.lerp(new THREE.Vector3(sim.x,sim.y,sim.z),.3);
  cam.pos.lerp(cam.gp,k);cam.tgt.lerp(gt,k);
  camera.position.copy(cam.pos);if(phase==='intro'||phase==='spot'||phase==='char'){camera.position.x+=Math.sin(cam.sway*.35)*.25;camera.position.y+=Math.sin(cam.sway*.27)*.06}
  camera.lookAt(cam.tgt);
  if(phase==='spot')for(const s of P.SPOTS){const m=world.markers[s.id];m.ring.material.opacity=.45+.35*Math.sin(cam.sway*4);m.ring.scale.setScalar(1+.08*Math.sin(cam.sway*4))}
  if(phase==='aim'){const pp=window.__BTG__&&window.__BTG__.pausePose;world.kid.setArm(pp!==undefined?pp:3.3+Math.sin(cam.sway*2.2)*.04);holdBall()}
  if(phase==='power'){
    meterT+=dt;const ph=(meterT/meterPeriod())%1;power=ph<.5?ph*200:(1-ph)*200;
    $('mark').style.bottom=power+'%';$('powRead').textContent=Math.round(power);
    world.kid.setArm(3.3+power/100*.35);holdBall();
  }
  if(phase==='walk'&&walk){
    walk.t+=dt*timeScale;const u=Math.min(1,walk.t/walk.dur),w=world.walker,dz=curSpot().d;
    const x=walk.x0*(1-u),z=walk.z0+(dz-walk.z0)*u;w.g.position.set(x,0,z);w.g.rotation.y=u<.85?Math.atan2(-(0-walk.x0),-(dz-walk.z0)):0;
    w.update(dt*timeScale);if(u>=1)toLine(walk.cid,walk.col);
  }
  if(phase==='wind'){
    armT+=dt*(stall?timeScale:1);const w=.2,sw=.11;let su=0;
    if(armT<0){}else if(armT<w)world.kid.setArm(3.3+(armT/w)*.4);
    else{const u=Math.min(1,(armT-w)/sw);su=u;world.kid.setArm(3.7-(3.7-2.786)*u*u);if(u>=1){release()}}
    if(phase==='wind'){holdBall();if(su>0&&launchPlan)world.ball.position.lerp(_a.set(P.REL.x,P.REL.y,P.spot(launchPlan.spot).d),su*su*su)}
  }
  if(phase==='fly'){
    simAcc+=dt*(stall?timeScale:1);
    if(world.kid.armX>1.7&&world.kid.mode==='arm')world.kid.setArm(Math.max(1.7,world.kid.armX-dt*7));
    while(simAcc>=P.DT&&!sim.done){P.step(sim,P.DT);simAcc-=P.DT;
      if(sim.ev){if(!firstEv&&sim.ev!=='in')firstEv={ev:sim.ev,x:sim.x,z:sim.z};
        if(sim.ev==='rim'&&rimIdx<0)rimIdx=rec.length/3;
        if(sim.ev==='floor'||sim.ev==='wall'||sim.ev==='ceil'||sim.ev==='side')SFX.thud();else if(sim.ev==='rim')SFX.rim()}
      if(++trail.n%2===0)rec.push(sim.x,sim.y,sim.z);
      if(trail.n%6===0&&!sim.inBin&&trail.pts.length<400&&!firstEv)trail.pts.push(new THREE.Vector3(sim.x,sim.y,sim.z))}
    world.ball.position.set(sim.x,sim.y,sim.z);world.ball.rotation.x+=dt*9;world.ball.rotation.z+=dt*6;
    if(sim.done)landed();
  }
  if(phase==='replay'&&replay){
    replay.t+=dt;const i=Math.min(replay.pts.length-1,Math.floor(replay.t*120*.32));const p=replay.pts[i];world.ball.position.set(p[0],p[1],p[2]);world.ball.rotation.x+=dt*3;
    if(replay.t>=replay.dur+.5)endReplay();
  }
  if(cheerT>0){cheerT-=dt;world.kid.g.position.y=cheerT>0?Math.abs(Math.sin(cheerT*11))*.13:0}
  if(ownerT>0){ownerT-=dt;if(ownerT<=0)world.owner.setArm(null)}
  if(phase==='after'){afterT-=dt;if(afterT<=0)afterThrow()}
  if(stall){
    world.queue.forEach(q=>{if(!q.g.visible)return;q.g.position.x+=(q.tx-q.g.position.x)*Math.min(1,dt*6);q.g.position.z+=(q.tz-q.g.position.z)*Math.min(1,dt*6)});
    autoGfx(dt);
  }
  updConfetti(dt);
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
/* If the stall is running slowly (older iPads), switch to low graphics once, by itself. */
function autoGfx(dt){
  if(PREF.low!==null||!stall)return;const f=stall.fps;f.t+=dt;f.f++;
  if(f.t>=3){if(f.f/f.t<24){PREF.low=true;savePrefs();applyGfx();layoutQueue(false);toast(t('Switched to low graphics to keep it smooth'))}else{PREF.low=PREF.low===null?null:PREF.low;f.t=-1e9}}
}

/* one-axis line chart; a dashed reference line through 0 with a given slope */
function lineChartH(o){
  const W=560,H=200,Lm=56,Rm=16,T=14,B=30,pw=W-Lm-Rm,ph=H-T-B,n=o.series[0].ys.length;
  const ref=o.ref?Array.from({length:n},(_,i)=>(i+1)*o.ref.slope):[];
  const all=[0,...o.series.flatMap(s=>s.ys),...ref],lo=Math.min(...all),hi=Math.max(...all),st=niceStep(Math.max(1,hi-lo)),yMin=Math.floor(lo/st)*st,yMax=Math.max(yMin+st,Math.ceil(hi/st)*st);
  const X=i=>Lm+(n<=1?pw/2:i/(n-1)*pw),Y=v=>T+ph-(v-yMin)/(yMax-yMin)*ph;
  let g='';for(let v=yMin;v<=yMax+1e-9;v+=st)g+=`<path d="M${Lm} ${Y(v)}H${W-Rm}" stroke="${v===0?'#94a3b8':'#e2e8f0'}" stroke-width="1"/><text x="${Lm-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="#64748b">${o.yFmt(v)}</text>`;
  const xs=niceStep(n);for(let k=xs;k<=n;k+=xs)g+=`<text x="${X(k-1)}" y="${H-12}" text-anchor="middle" font-size="11" fill="#64748b">${k}</text>`;
  g+=`<text x="${W-Rm}" y="${H-1}" text-anchor="end" font-size="10.5" font-weight="700" fill="#94a3b8">${esc(o.xLab)}</text>`;
  const path=ys=>ys.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join('');
  let s='';if(o.ref)s+=`<path d="${path(ref)}" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 5"/><text x="${X(Math.floor(n*.62))}" y="${Y(ref[Math.floor(n*.62)]||0)+(o.ref.slope<0?22:-10)}" text-anchor="middle" font-size="11.5" font-weight="800" fill="#334155" paint-order="stroke" stroke="#fff" stroke-width="4">${esc(o.ref.name)}</text>`;
  for(const se of o.series)s+=`<path class="ln" d="${path(se.ys)}" fill="none" stroke="${se.color}" stroke-width="2.2" stroke-linejoin="round"/>`;
  const ly=o.series[0].ys[n-1];s+=`<circle cx="${X(n-1)}" cy="${Y(ly)}" r="5" fill="${o.series[0].color}" stroke="#fff" stroke-width="2"/><text x="${X(n-1)-8}" y="${Y(ly)+(Y(ly)<T+20?18:-10)}" text-anchor="end" font-size="12.5" font-weight="900" fill="#0f172a" paint-order="stroke" stroke="#fff" stroke-width="4">${esc(o.end)}</text>`;
  return `<div class="chartBox" data-chart="${o.id}" data-n="${n}" data-l="${Lm}" data-pw="${pw}"><svg viewBox="0 0 ${W} ${H}" dir="ltr" role="img" aria-label="${esc(o.series[0].name)}">${g}${s}<path class="xh" stroke="#334155" stroke-width="1" opacity=".5"/><rect class="hit" x="${Lm}" y="${T}" width="${pw}" height="${ph}" fill="transparent"/></svg><div class="tip" hidden></div></div>`;
}
function niceStep(n){const raw=n/5,p=Math.pow(10,Math.floor(Math.log10(raw||1)));for(const m of [1,2,5,10])if(m*p>=raw)return m*p;return 10*p}

/* Throws are sent in batches; anything not yet sent waits on the device (marked up:0) and goes next time. */
function pending(){const out=[];for(const s of P.SPOTS)S.data[s.id].forEach(r=>{if(r.up===0)out.push([s.id,r])});return out}
const pendingCount=()=>AUTH.mode==='student'?pending().length:0;
async function queueUpload(force){
  if(AUTH.mode!=='student'||AUTH.saving||AUTH.saveBroken)return;const pd=pending();if(!pd.length||(!force&&pd.length<BATCH))return;
  AUTH.saving=true;const cl=await cloud();if(!cl){AUTH.saving=false;return}
  const take=pd.slice(0,20),preds={};for(const s of P.SPOTS)if(S.pred[s.id]!=null&&!S.predSent[s.id]&&take.some(x=>x[0]===s.id))preds[s.id]=S.pred[s.id];
  const r=await cl.recordThrows({throws:take.map(([s,x])=>({s,a:x.a,p:x.p,i:x.in?1:0,h:x.h?1:0})),preds});
  AUTH.saving=false;
  if(r.ok){take.forEach(x=>{x[1].up=1});for(const k in preds)S.predSent[k]=true;save();renderStatus();if(pending().length>=(force?1:BATCH))queueUpload(force)}
  else if(r.missing){AUTH.saveBroken=true;toast(t('Saving to your class isn’t switched on yet. Your throws are kept on this device.'))}
  else console.warn('save throws',r.error);
}
