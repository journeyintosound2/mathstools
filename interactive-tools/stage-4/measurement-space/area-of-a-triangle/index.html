<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Area of a Triangle — Half the Rectangle</title>
<style>
  :root{
    --bg:#f6f7fb;
    --card:#ffffff;
    --ink:#111827;
    --muted:#6b7280;
    --border:#e5e7eb;
    --shadow:0 14px 40px rgba(0,0,0,.10);
    --blue:#2563eb;
    --green:#16a34a;
    --yellow:#f2cb05;
    --purple:#8b5cf6;
    --teal:#169eaa;
    --red:#dc2626;
    --mathFont:"Cambria Math","STIX Two Math","STIXGeneral","Times New Roman",serif;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }

  body{
    margin:0;
    font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
  }

  .page{ min-height:100vh; padding:10px; }

  .shell{
    max-width:1500px;
    margin:0 auto;
    background:linear-gradient(180deg, rgba(255,255,255,.98), rgba(255,255,255,.94));
    border:1px solid rgba(229,231,235,.95);
    border-radius:28px;
    box-shadow:var(--shadow);
    min-height:calc(100vh - 20px);
    padding:14px 18px 18px;
    display:flex;
    flex-direction:column;
  }

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    margin-bottom:6px;
  }

  .back-btn{
    display:inline-flex;
    align-items:center;
    gap:10px;
    text-decoration:none;
    color:var(--ink);
    font-weight:900;
    font-size:14px;
    padding:6px 8px;
    border-radius:12px;
  }
  .back-btn:hover{ background:#f1f5f9; }
  .back-logo{ width:30px; height:30px; object-fit:contain; display:block; }

  .tools-menu{ position:relative; }
  .chip{
    border:1px solid var(--border);
    background:#eef2ff;
    color:#1d4ed8;
    border-radius:12px;
    padding:8px 12px;
    font-weight:900;
    font-size:14px;
    cursor:pointer;
  }
  .tools-dropdown{
    position:absolute;
    right:0;
    top:calc(100% + 6px);
    background:#fff;
    border:1px solid var(--border);
    border-radius:14px;
    box-shadow:var(--shadow);
    padding:6px;
    display:none;
    min-width:190px;
    z-index:30;
  }
  .tools-menu.open .tools-dropdown{ display:block; }
  .tools-link{
    display:block;
    padding:9px 12px;
    border-radius:10px;
    text-decoration:none;
    color:var(--ink);
    font-weight:800;
    font-size:14px;
  }
  .tools-link:hover{ background:#f1f5f9; }

  .headline{ margin:4px 2px 10px; }
  .title{ font-size:26px; font-weight:1000; margin:0; letter-spacing:.2px; }
  .subtitle{ margin:4px 0 0; color:var(--muted); font-weight:750; font-size:15px; }

  .layout{
    display:grid;
    grid-template-columns:minmax(0,1fr) 340px;
    gap:16px;
    flex:1 1 auto;
    align-items:start;
  }
  @media (max-width:900px){
    .layout{ grid-template-columns:1fr; }
  }

  .stageCard{
    background:#fff;
    border:1px solid var(--border);
    border-radius:20px;
    padding:8px;
    box-shadow:0 8px 22px rgba(15,23,42,.06);
  }
  svg.stage{ width:100%; height:auto; display:block; touch-action:none; }

  .panel{
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .group{
    background:#fff;
    border:1px solid var(--border);
    border-radius:18px;
    padding:14px;
  }
  .group h3{
    margin:0 0 10px;
    font-size:13px;
    letter-spacing:.4px;
    text-transform:uppercase;
    color:var(--muted);
    font-weight:950;
  }

  .sliderRow{ margin-bottom:12px; }
  .sliderRow:last-child{ margin-bottom:0; }
  .sliderTop{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:6px;
  }
  .sliderTop label{ font-weight:950; font-size:15px; }
  .sliderTop .val{
    font-weight:1000;
    font-size:16px;
    color:var(--blue);
    font-family:var(--mathFont);
  }
  input[type="range"]{ width:100%; accent-color:var(--blue); height:22px; }

  .btnRow{ display:flex; gap:8px; flex-wrap:wrap; }
  .pill{
    border:1px solid var(--border);
    background:#f8fafc;
    color:var(--ink);
    border-radius:999px;
    padding:8px 12px;
    font-weight:900;
    font-size:13px;
    cursor:pointer;
    transition:all .12s ease;
  }
  .pill:hover{ background:#eef2ff; }
  .pill.active{ background:var(--blue); color:#fff; border-color:var(--blue); }

  .preset{
    flex:1;
    min-width:78px;
    text-align:center;
    border:1px solid var(--border);
    background:#fff;
    border-radius:12px;
    padding:9px 6px;
    font-weight:950;
    font-size:13px;
    cursor:pointer;
  }
  .preset:hover{ background:#f1f5f9; }
  .preset .glyph{ font-size:17px; display:block; margin-bottom:2px; }

  .metricBox{
    border:1px solid var(--border);
    border-radius:14px;
    padding:10px 12px;
    background:#f9fafb;
    margin-bottom:10px;
  }
  .metricBox:last-child{ margin-bottom:0; }
  .metric-head{
    font-size:12px;
    font-weight:950;
    text-transform:uppercase;
    letter-spacing:.4px;
    color:var(--muted);
    margin-bottom:4px;
  }
  .metric-formula{
    font-family:var(--mathFont);
    font-size:17px;
    font-weight:800;
  }
  .metric-formula .res{ color:var(--blue); font-weight:1000; }
  .metricBox.tri{ background:rgba(37,99,235,.08); border-color:#bfdbfe; }
  .metricBox.tri .metric-formula .res{ color:var(--blue); }
  .metricBox.shape .metric-formula .res{ color:var(--ink); }

  .callout{
    background:rgba(22,163,74,.08);
    border:1px solid #bbf7d0;
    color:#14532d;
    border-radius:14px;
    padding:10px 12px;
    font-weight:800;
    font-size:14px;
    line-height:1.35;
  }

  .btnBig{
    width:100%;
    border:none;
    border-radius:14px;
    padding:12px 14px;
    font-weight:1000;
    font-size:15px;
    cursor:pointer;
    background:var(--green);
    color:#fff;
    margin-bottom:8px;
  }
  .btnBig.secondary{ background:#eef2ff; color:#1d4ed8; }
  .btnBig:last-child{ margin-bottom:0; }

  .footer{
    margin-top:14px;
    text-align:center;
    font-weight:800;
    color:var(--muted);
    font-size:13px;
  }
  .footer a{ color:var(--blue); text-decoration:none; font-weight:950; }
  .footer a:hover{ text-decoration:underline; }

  /* SVG element styles */
  .grid-line{ stroke:#e5e7eb; stroke-width:1; }
  .shape-fill{ fill:rgba(148,163,184,.14); }
  .shape-edge{ stroke:#94a3b8; stroke-width:2; fill:none; stroke-dasharray:6 5; }
  .tri-fill{ fill:rgba(37,99,235,.34); stroke:var(--blue); stroke-width:3; stroke-linejoin:round; }
  .comp-fill{ fill:rgba(242,203,5,.34); stroke:#b8890b; stroke-width:2; stroke-linejoin:round; }
  .split-line{ stroke:var(--red); stroke-width:2.4; stroke-dasharray:5 5; }
  .dim-line{ stroke:var(--ink); stroke-width:1.6; }
  .dim-tick{ stroke:var(--ink); stroke-width:1.6; }
  .dim-label{
    font-family:var(--mathFont);
    font-size:16px; font-weight:800; fill:var(--ink);
  }
  .right-angle{ stroke:var(--blue); stroke-width:2.6; fill:none; stroke-linejoin:miter; }
  .vhandle{ fill:#fff; stroke:var(--blue); stroke-width:3; cursor:grab; }
  .vhandle.apex{ fill:var(--blue); }
  .vdot{ fill:var(--blue); }
  .hint-text{ font-family:ui-sans-serif,system-ui,sans-serif; font-size:13px; font-weight:800; fill:var(--muted); }
</style>

<body>
<div class="page">
  <div class="shell">

    <div class="topbar">
      <a class="back-btn" href="https://millsmathstools.au">
        <img class="back-logo" src="../../../../assets/mmt.png" alt="Mills Maths Tools logo" onerror="this.style.display='none';" />
        <span>Back to Mills Maths Tools</span>
      </a>
      <div class="tools-menu" id="toolsMenu">
        <button class="chip" id="toolsBtn" type="button" aria-haspopup="true" aria-expanded="false">Tools ▾</button>
        <div class="tools-dropdown">
          <a class="tools-link" href="../../../../online-quizzes/stage-4/measurement-space/area-of-a-triangle.html">Student Quiz</a>
          <a class="tools-link" href="../../../../worksheet-creators/stage-4/measurement-space/area-of-a-triangle.html">Worksheet Creator</a>
        </div>
      </div>
    </div>

    <div class="headline">
      <h1 class="title">Area of a Triangle</h1>
      <p class="subtitle">A triangle is exactly <strong>half</strong> its surrounding rectangle — and half a parallelogram when it leans past the base. Drag the top corner and watch.</p>
    </div>

    <div class="layout">
      <div class="stageCard">
        <svg class="stage" id="svg" viewBox="0 0 800 500" role="img" aria-label="Triangle inside its surrounding shape"></svg>
      </div>

      <div class="panel">
        <div class="group">
          <h3>Shape</h3>
          <div class="sliderRow">
            <div class="sliderTop"><label for="baseR">Base</label><span class="val" id="baseVal">9</span></div>
            <input id="baseR" type="range" min="2" max="12" step="1" value="9" />
          </div>
          <div class="sliderRow">
            <div class="sliderTop"><label for="heightR">Height</label><span class="val" id="heightVal">6</span></div>
            <input id="heightR" type="range" min="1" max="10" step="1" value="6" />
          </div>
          <div class="btnRow" style="margin-top:4px;">
            <button class="pill" id="tObtuse">Obtuse (parallelogram)</button>
          </div>
        </div>

        <div class="group">
          <h3>Show</h3>
          <div class="btnRow">
            <button class="pill active" id="tComp">Other half</button>
            <button class="pill" id="tSplit">Split line</button>
          </div>
        </div>

        <div class="group">
          <button class="btnBig" id="foldBtn">▶ Show Animation</button>
          <button class="btnBig secondary" id="resetBtn">Reset</button>
        </div>
      </div>
    </div>

    <div class="footer">This tool and more can be found at <a href="https://www.millsmathstools.au">www.millsmathstools.au</a></div>
  </div>
</div>

<script>
(() => {
  const svg = document.getElementById("svg");
  const SVGNS = "http://www.w3.org/2000/svg";
  const VW = 800, VH = 500;
  const PAD = { l:46, r:46, t:40, b:70 };
  const innerW = VW - PAD.l - PAD.r;
  const innerH = VH - PAD.t - PAD.b;
  const cx = PAD.l + innerW/2;
  const cy = PAD.t + innerH/2;

  const state = {
    base: 9,
    height: 6,
    apexX: 3,          // horizontal position of apex, in units from left base vertex A
    obtuse: false,     // off => explore right + acute (apex over base); on => explore obtuse only
    showComp: true,    // "other half" (also draws the surrounding shape)
    showSplit: false,
    fold: 0,           // 0..1 animation progress of the "other half" folding onto the triangle
    foldTarget: 0,     // where the animation is heading (0 = unfolded, 1 = folded)
    animating: false
  };

  // ---------- geometry ----------
  function isRect(){ return state.apexX >= 0 && state.apexX <= state.base; }

  // math-coord vertices (y up). A=(0,0) B=(b,0)
  function shapeVerts(){
    const b = state.base, h = state.height, ax = state.apexX;
    if (isRect()){
      return [ [0,0],[b,0],[b,h],[0,h] ];              // rectangle
    }
    return [ [0,0],[b,0],[b+ax,h],[ax,h] ];            // parallelogram A,B,Q,P
  }
  function triVerts(){
    const b = state.base, h = state.height, ax = state.apexX;
    return [ [0,0],[b,0],[ax,h] ];                     // A,B,P
  }
  // "other half" complement piece(s), each with its rotation pivot (math coords)
  function compPieces(){
    const b = state.base, h = state.height, ax = state.apexX;
    if (isRect()){
      // two corner right-triangles; each folds 180° about the shared triangle edge midpoint
      return [
        { poly: [ [0,0],[ax,h],[0,h] ],       pivot: [ax/2, h/2] },        // left corner -> left half
        { poly: [ [b,0],[b,h],[ax,h] ],       pivot: [(b+ax)/2, h/2] }     // right corner -> right half
      ];
    }
    // parallelogram: single triangle B,Q,P folds 180° about midpoint of B-P
    return [ { poly: [ [b,0],[b+ax,h],[ax,h] ], pivot: [(b+ax)/2, h/2] } ];
  }

  // fit transform (recomputed each render from the surrounding shape bbox)
  function computeFit(){
    const sv = shapeVerts();
    let minX=Infinity,maxX=-Infinity,minY=0,maxY=state.height;
    sv.forEach(([x,y])=>{ if(x<minX)minX=x; if(x>maxX)maxX=x; });
    const bw = Math.max(0.001, maxX-minX);
    const bh = Math.max(0.001, maxY-minY);
    let scale = Math.min(innerW/bw, innerH/bh);
    scale = Math.min(scale, 46);           // don't blow tiny shapes up too far
    const bcx = (minX+maxX)/2, bcy = (minY+maxY)/2;
    return { scale, bcx, bcy };
  }
  let FIT = computeFit();
  function toS(x,y){ return [ cx + (x-FIT.bcx)*FIT.scale, cy - (y-FIT.bcy)*FIT.scale ]; }
  function ptStr(pts){ return pts.map(([x,y])=>{ const p=toS(x,y); return p[0].toFixed(1)+","+p[1].toFixed(1); }).join(" "); }

  // ---------- svg helpers ----------
  function el(name, attrs){
    const e = document.createElementNS(SVGNS, name);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  // rotate a math point by angle (deg) about pivot, return math point
  function rot(p, pivot, deg){
    const r = deg*Math.PI/180;
    const dx = p[0]-pivot[0], dy = p[1]-pivot[1];
    return [ pivot[0] + dx*Math.cos(r) - dy*Math.sin(r), pivot[1] + dx*Math.sin(r) + dy*Math.cos(r) ];
  }

  // ---------- render ----------
  function render(){
    FIT = computeFit();
    while (svg.firstChild) svg.removeChild(svg.firstChild);

    const b = state.base, h = state.height, ax = state.apexX;
    const sv = shapeVerts();

    // grid of unit squares over the shape bbox (always on)
    {
      let minX=Infinity,maxX=-Infinity; sv.forEach(([x])=>{ if(x<minX)minX=x; if(x>maxX)maxX=x; });
      const g = el("g",{});
      for (let x=Math.ceil(minX); x<=Math.floor(maxX); x++){
        const a=toS(x,0), c=toS(x,h);
        g.appendChild(el("line",{x1:a[0],y1:a[1],x2:c[0],y2:c[1],class:"grid-line"}));
      }
      for (let y=0; y<=h; y++){
        const a=toS(minX,y), c=toS(maxX,y);
        g.appendChild(el("line",{x1:a[0],y1:a[1],x2:c[0],y2:c[1],class:"grid-line"}));
      }
      svg.appendChild(g);
    }

    // surrounding shape (shown together with the "other half")
    if (state.showComp){
      svg.appendChild(el("polygon",{points:ptStr(sv),class:"shape-fill"}));
      svg.appendChild(el("polygon",{points:ptStr(sv),class:"shape-edge"}));
    }

    // "other half" complement, possibly mid-fold
    if (state.showComp){
      compPieces().forEach(pc=>{
        const deg = 180*state.fold;
        const poly = pc.poly.map(p=>rot(p, pc.pivot, deg));
        svg.appendChild(el("polygon",{points:ptStr(poly),class:"comp-fill"}));
      });
    }

    // the triangle
    svg.appendChild(el("polygon",{points:ptStr(triVerts()),class:"tri-fill"}));

    // right-angle marker when the apex is directly above a base vertex
    if (ax === 0 || ax === b){
      const s = Math.min(0.75, h*0.5, b*0.5);
      let p1, mid, p2;
      if (ax === 0){ p1=[s,0]; mid=[s,s]; p2=[0,s]; }
      else { p1=[b-s,0]; mid=[b-s,s]; p2=[b,s]; }
      svg.appendChild(el("polyline",{points:ptStr([p1,mid,p2]),class:"right-angle"}));
    }

    // split line (altitude for rectangle, diagonal B-P for parallelogram)
    if (state.showSplit){
      if (isRect()){
        const top=toS(ax,h), foot=toS(ax,0);
        svg.appendChild(el("line",{x1:top[0],y1:top[1],x2:foot[0],y2:foot[1],class:"split-line"}));
      } else {
        const p1=toS(b,0), p2=toS(ax,h);
        svg.appendChild(el("line",{x1:p1[0],y1:p1[1],x2:p2[0],y2:p2[1],class:"split-line"}));
      }
    }

    // base dimension line + label
    {
      const a=toS(0,0), c=toS(b,0);
      const y = a[1] + 26;
      svg.appendChild(el("line",{x1:a[0],y1:y,x2:c[0],y2:y,class:"dim-line"}));
      svg.appendChild(el("line",{x1:a[0],y1:y-6,x2:a[0],y2:y+6,class:"dim-tick"}));
      svg.appendChild(el("line",{x1:c[0],y1:y-6,x2:c[0],y2:y+6,class:"dim-tick"}));
      const lbl=el("text",{x:(a[0]+c[0])/2,y:y+20,"text-anchor":"middle",class:"dim-label"});
      lbl.textContent = "base = "+b;
      svg.appendChild(lbl);
    }

    // height dimension (left of shape)
    {
      const minXv = Math.min(0, ax);
      const top=toS(minXv,h), bot=toS(minXv,0);
      const x = Math.min(top[0],bot[0]) - 22;
      svg.appendChild(el("line",{x1:x,y1:top[1],x2:x,y2:bot[1],class:"dim-line"}));
      svg.appendChild(el("line",{x1:x-6,y1:top[1],x2:x+6,y2:top[1],class:"dim-tick"}));
      svg.appendChild(el("line",{x1:x-6,y1:bot[1],x2:x+6,y2:bot[1],class:"dim-tick"}));
      const lbl=el("text",{x:x-8,y:(top[1]+bot[1])/2,"text-anchor":"middle",class:"dim-label",transform:`rotate(-90 ${x-8} ${(top[1]+bot[1])/2})`});
      lbl.textContent = "height = "+h;
      svg.appendChild(lbl);
    }

    // base vertex dots + draggable apex handle
    const A=toS(0,0), B=toS(b,0), P=toS(ax,h);
    svg.appendChild(el("circle",{cx:A[0],cy:A[1],r:5,class:"vdot"}));
    svg.appendChild(el("circle",{cx:B[0],cy:B[1],r:5,class:"vdot"}));
    const handle = el("circle",{cx:P[0],cy:P[1],r:11,class:"vhandle apex","data-handle":"apex"});
    svg.appendChild(handle);
    const hint = el("text",{x:P[0],y:P[1]-18,"text-anchor":"middle",class:"hint-text"});
    hint.textContent = "drag";
    svg.appendChild(hint);

    updatePanel();
  }

  function updatePanel(){
    document.getElementById("baseVal").textContent=state.base;
    document.getElementById("heightVal").textContent=state.height;
  }

  // ---------- fold animation ----------
  let rafId=null;
  function updateFoldBtn(){
    document.getElementById("foldBtn").textContent =
      state.foldTarget===1 ? "↺ Undo Animation" : "▶ Show Animation";
  }
  function playFold(target){
    if (state.animating) return;
    if (target===1){ state.showComp=true; document.getElementById("tComp").classList.add("active"); }
    state.animating=true;
    state.foldTarget=target;
    updateFoldBtn();
    const start=performance.now(), dur=1000;
    const from=state.fold;
    function step(now){
      const t=Math.min(1,(now-start)/dur);
      const e = t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; // easeInOut
      state.fold = from + (target-from)*e;
      render();
      if (t<1){ rafId=requestAnimationFrame(step); }
      else { state.fold=target; state.animating=false; render(); }
    }
    rafId=requestAnimationFrame(step);
  }
  function resetFold(){
    if(rafId) cancelAnimationFrame(rafId);
    state.animating=false; state.fold=0; state.foldTarget=0;
    updateFoldBtn();
  }

  // ---------- apex dragging ----------
  let dragging=false;
  function clientToWorldX(clientX, clientY){
    const pt=svg.createSVGPoint(); pt.x=clientX; pt.y=clientY;
    const loc=pt.matrixTransform(svg.getScreenCTM().inverse());
    return FIT.bcx + (loc.x - cx)/FIT.scale;
  }
  svg.addEventListener("pointerdown",(e)=>{
    const t=e.target;
    if (t && t.getAttribute && t.getAttribute("data-handle")==="apex"){
      dragging=true; t.setPointerCapture&&t.setPointerCapture(e.pointerId);
      resetFold(); e.preventDefault();
    }
  });
  function apexRange(){
    // Obtuse OFF: apex stays over the base (right + acute only).
    // Obtuse ON: apex stays past the right base vertex (parallelogram only).
    return state.obtuse ? [state.base+0.5, state.base+4] : [0, state.base];
  }
  svg.addEventListener("pointermove",(e)=>{
    if(!dragging) return;
    let wx=clientToWorldX(e.clientX,e.clientY);
    const [lo,hi]=apexRange();
    wx=Math.max(lo, Math.min(hi, wx));
    state.apexX=Math.round(wx*2)/2;   // snap to half units
    render();
  });
  function endDrag(){ dragging=false; }
  svg.addEventListener("pointerup",endDrag);
  svg.addEventListener("pointercancel",endDrag);
  svg.addEventListener("pointerleave",endDrag);

  // ---------- controls ----------
  function clampApexToRange(){
    const [lo,hi]=apexRange();
    state.apexX=Math.max(lo, Math.min(hi, state.apexX));
  }

  document.getElementById("baseR").addEventListener("input",(e)=>{
    state.base=+e.target.value;
    clampApexToRange();
    resetFold(); render();
  });
  document.getElementById("heightR").addEventListener("input",(e)=>{
    state.height=+e.target.value; resetFold(); render();
  });

  // Obtuse toggle: off = right/acute (apex over base), on = obtuse only (parallelogram)
  const tObtuse=document.getElementById("tObtuse");
  tObtuse.addEventListener("click",()=>{
    state.obtuse=!state.obtuse;
    tObtuse.classList.toggle("active",state.obtuse);
    resetFold();
    if(state.obtuse){ state.apexX=Math.min(state.base+3, state.base+4); }
    else { state.apexX=Math.round(state.base/2); }
    render();
  });

  function toggle(id, key){
    const btn=document.getElementById(id);
    btn.addEventListener("click",()=>{
      state[key]=!state[key];
      btn.classList.toggle("active",state[key]);
      render();
    });
  }
  toggle("tComp","showComp");
  toggle("tSplit","showSplit");

  document.getElementById("foldBtn").addEventListener("click",()=>{
    if(state.animating) return;
    playFold(state.foldTarget===1 ? 0 : 1);
  });
  document.getElementById("resetBtn").addEventListener("click",()=>{
    resetFold();
    state.base=9; state.height=6; state.apexX=3; state.obtuse=false;
    state.showComp=true; state.showSplit=false;
    document.getElementById("baseR").value=9;
    document.getElementById("heightR").value=6;
    document.getElementById("tObtuse").classList.remove("active");
    document.getElementById("tComp").classList.add("active");
    document.getElementById("tSplit").classList.remove("active");
    render();
  });

  // tools dropdown
  const tm=document.getElementById("toolsMenu");
  document.getElementById("toolsBtn").addEventListener("click",()=>tm.classList.toggle("open"));
  document.addEventListener("click",(e)=>{ if(!tm.contains(e.target)) tm.classList.remove("open"); });

  render();
})();
</script>
</body>
</html>
