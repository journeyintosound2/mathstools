<script>
/* DIVIDE BY 10 AND 100 — flip cards on the shared MMT engine (rebuilt 2026-11-18).
   Same four levels as the original page. Numbers are built as whole numbers and
   the quotient is written by moving the digits, never with floating point. */
(() => {
  const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const step = (min, max, s) => min + s * R(0, Math.floor((max - min) / s));
  /* n ÷ 10^k as an exact decimal string */
  const shift = (n, k) => {
    let s = String(n).padStart(k + 1, "0");
    let whole = s.slice(0, s.length - k), dec = s.slice(s.length - k).replace(/0+$/, "");
    return dec ? `${whole}.${dec}` : whole;
  };
  const LV = [
    { id:"l1", name:"Level 1", sub:"÷ 10, numbers from 10 to 120 in steps of 10", min:10, max:120, s:10, d:10 },
    { id:"l2", name:"Level 2", sub:"÷ 10, numbers from 10 to 1000 in steps of 10", min:10, max:1000, s:10, d:10 },
    { id:"l3", name:"Level 3", sub:"÷ 10, numbers from 1 to 200 (answers can be decimals)", min:1, max:200, s:1, d:10 },
    { id:"l4", name:"Level 4", sub:"÷ 100, numbers from 1 to 1000", min:1, max:1000, s:1, d:100 },
    { id:"l5", name:"Mixed ÷ 10, 100, 1000", sub:"Extension: any of the three, numbers to 5000", min:1, max:5000, s:1, d:0 }
  ];
  const PLACE = { 10:"one place", 100:"two places", 1000:"three places" };
  window.FLIP_DECK = {
    title:"Flip Cards — Divide by 10, 100 and 1000",
    outcome:"MA3-RN-01",
    storeKey:"mmtFlip.divideByTens.v2",
    prompt:"Work it out on your mini-whiteboard.",
    sets:LV.map(L => ({ id:L.id, name:L.name, sub:L.sub, ex:L.id === "l1" ? "80 ÷ 10 = 8" : L.id === "l3" ? "47 ÷ 10 = 4.7" : L.id === "l4" ? "305 ÷ 100 = 3.05" : "",
      gen(){
        const d = L.d || [10, 100, 1000][R(0, 2)], n = step(L.min, L.max, L.s), k = String(d).length - 1;
        return { key:n + "/" + d, render:o => ({
          front:{ main:`${n} ÷ ${d}` },
          back:{ main:shift(n, k), sub:o.why ? `The digits move ${PLACE[d]} to the right; the decimal point stays put.` : "" }
        }) };
      } })),
    settings:[
      { id:"why", type:"switch", label:"Say why on the back", def:false, repaint:true, note:"“The digits move one place to the right.”" }
    ],
    tools:[
      { href:"/interactive-tools/stage-3/number/multiply-divide-by-ten/", label:"Place Value — Multiply and Divide by 10", sub:"The teaching tool: watch the digits move" },
      { href:"/worksheet-creators/stage-3/number/multiply-divide-by-ten.html", label:"Worksheet Creator", sub:"Place value grids, multiply, divide, missing numbers" }
    ],
    notes:`<p>Levels 1 and 2 have whole-number answers. Level 3 can give tenths, Level 4 hundredths.</p><p>Ask: which way did the digits move, and how many places? Never &ldquo;take off a zero&rdquo;.</p>`
  };
})();
</script>
