<script>
/* ANGLES ON PARALLEL LINES — flip cards on the shared MMT engine (rebuilt 2026-11-18).
   The 30 original drawings (1–10 alternate, 11–20 corresponding, 21–30
   cointerior), now with a set for each kind as well as all three mixed. The back
   names the pair in its colour and says the rule. */
(() => {
  const KIND = {
    alt:{ name:"Alternate angles", colour:"#16a34a", rule:"Alternate angles on parallel lines are equal.", from:1 },
    cor:{ name:"Corresponding angles", colour:"#2563eb", rule:"Corresponding angles on parallel lines are equal.", from:11 },
    co:{ name:"Cointerior angles", colour:"#f97316", rule:"Cointerior angles on parallel lines add to 180°.", from:21 }
  };
  const img = n => `<img src="${n}.png" alt="Angle pair on parallel lines" draggable="false">`;
  const mk = kinds => () => {
    const k = kinds[Math.floor(Math.random() * kinds.length)], n = KIND[k].from + Math.floor(Math.random() * 10);
    return { key:n, colour:KIND[k].colour, render:o => ({
      front:{ pic:img(n) },
      back:{ main:`<span style="color:${KIND[k].colour}">${KIND[k].name}</span>`, ui:true, wrap:true, sub:o.why ? KIND[k].rule : "", pic:o.pic ? img(n) : "", side:o.pic }
    }) };
  };
  const pre = []; for(let i = 1; i <= 30; i++) pre.push(i + ".png");
  window.FLIP_DECK = {
    title:"Flip Cards — Angles on Parallel Lines",
    outcome:"MA4-ANG-C-01",
    storeKey:"mmtFlip.parallelLines.v2",
    prompt:"Name the pair of angles.",
    ratio:1.62,
    preload:pre,
    sets:[
      { id:"all", name:"All three", sub:"Alternate, corresponding and cointerior mixed", gen:mk(["alt", "cor", "co"]) },
      { id:"alt", name:"Alternate", sub:"The Z shape: equal", gen:mk(["alt"]) },
      { id:"cor", name:"Corresponding", sub:"The F shape: equal", gen:mk(["cor"]) },
      { id:"co", name:"Cointerior", sub:"The C shape: add to 180°", gen:mk(["co"]) },
      { id:"ac", name:"Alternate or corresponding?", sub:"The two that are both equal", gen:mk(["alt", "cor"]) }
    ],
    settings:[
      { id:"why", type:"switch", label:"Say the rule on the back", def:true, repaint:true },
      { id:"pic", type:"switch", label:"Keep the drawing on the back", def:true, repaint:true }
    ],
    tools:[],
    notes:`<p>The colours match each kind: alternate green, corresponding blue, cointerior orange.</p><p>Ask for the name, then: are they equal, or do they add to 180&deg;?</p>`
  };
})();
</script>
<script src="../shared/flipcards.js?v=ed8c1019"></script>
</body>
