<script>
/* MULTIPLY AND DIVIDE INTEGERS — flip cards on the shared MMT engine (rebuilt 2026-11-18).
   Same four levels as the original page; signed numbers are coloured (positive
   green, negative red) as they were. Division is built from a times-table fact,
   so every answer is a whole number. */
(() => {
  const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const sg = () => Math.random() < .5 ? -1 : 1;
  const M = "−";
  const num = (n, br) => { const t = (n < 0 ? M : br ? "+" : "") + Math.abs(n); return `<span class="${n < 0 ? "neg" : "pos"}">${br ? "(" + t + ")" : t}</span>`; };
  const ans = n => `<span class="${n < 0 ? "neg" : n > 0 ? "pos" : "zero"}">${n < 0 ? M : ""}${Math.abs(n)}</span>`;
  const rule = (a, b, op) => {
    const w = x => x < 0 ? "negative" : "positive";
    const r = a * b > 0 || (op === "÷" && a / b > 0) ? "positive" : "negative";
    return `${w(a)} ${op === "×" ? "×" : "÷"} ${w(b)} = ${r}`;
  };
  const mk = (a, b, op) => ({ key:a + op + b, render:o => {
    const v = op === "×" ? a * b : a / b;
    return { front:{ main:`${num(a, o.br)} ${op} ${num(b, o.br)}` },
      back:{ main:ans(v), sub:o.why ? (a > 0 && b > 0 ? "positive " + op + " positive = positive" : rule(a, b, op)) : "" } };
  } });
  const mul = (s1, s2) => mk(R(1, 12) * s1, R(1, 12) * s2, "×");
  window.FLIP_DECK = {
    title:"Flip Cards — Multiply and Divide Integers",
    outcome:"MA4-INT-C-01",
    storeKey:"mmtFlip.integers.v2",
    prompt:"Work it out on your mini-whiteboard.",
    sets:[
      { id:"l1", name:"Level 1", sub:"Multiply: both numbers positive (times tables)", ex:"(+4) × (+7)", gen:() => mul(1, 1) },
      { id:"l2", name:"Level 2", sub:"Multiply: positive, or one number negative", ex:"(−3) × (+8)", gen:() => Math.random() < .5 ? mul(1, 1) : (Math.random() < .5 ? mul(-1, 1) : mul(1, -1)) },
      { id:"l3", name:"Level 3", sub:"Multiply: any signs", ex:"(−6) × (−9)", gen:() => mul(sg(), sg()) },
      { id:"l4", name:"Level 4", sub:"Divide: any signs, from the 12 × 12 facts", ex:"(−56) ÷ (+8)", gen(){ const a = R(1, 12), b = R(1, 12); return mk(a * b * sg(), (Math.random() < .5 ? a : b) * sg(), "÷"); } },
      { id:"l5", name:"Mixed", sub:"Multiply or divide, any signs", ex:"(+42) ÷ (−7)", gen(){ if(Math.random() < .5) return mul(sg(), sg()); const a = R(1, 12), b = R(1, 12); return mk(a * b * sg(), b * sg(), "÷"); } }
    ],
    settings:[
      { id:"br", type:"select", label:"Write numbers as", def:"1", repaint:true, options:[["1", "(+4) × (−3)"], ["", "4 × −3"]] },
      { id:"why", type:"switch", label:"Show the sign rule on the back", def:false, repaint:true, note:"e.g. negative × negative = positive" }
    ],
    tools:[],
    notes:`<p>Positive numbers are green and negative numbers red, on the card and in the answer.</p><p>Ask for the sign first (&ldquo;thumbs up for positive&rdquo;), then the number.</p>`
  };
  /* "1" / "" select values: the engine stores strings */
  const d = window.FLIP_DECK; d.sets.forEach(s => { const g = s.gen; s.gen = (o, r, S) => { const c = g(o, r, S); const rd = c.render; c.render = opts => rd(Object.assign({}, opts, { br:opts.br !== "" && opts.br !== false })); return c; }; });
})();
</script>
