  .arc{ stroke:#2563eb; stroke-width:4; stroke-linecap:butt; fill:none; } .arc.green{ stroke:#16a34a; } .arc.orange{ stroke:#f97316; }
  .angleLabel{ font-family:"Cambria Math","Times New Roman",serif; font-weight:700; fill:#111827; text-anchor:middle; dominant-baseline:middle; font-size:22px; paint-order:stroke; stroke:#fff; stroke-width:6px; stroke-linejoin:round; }
  .angleLabel.ans{ fill:#15803d; }
  .facePic.side svg.angle-svg{ width:calc(var(--cw) * .46); height:auto; max-height:calc(var(--ch) * .72); max-width:none; }
  .vertexDot{ fill:#111827; } .rightMarker{ stroke:#111827; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; fill:none; }

<script>
/* ANGLE RELATIONSHIPS — flip cards on the shared MMT engine (rebuilt 2026-11-18).
   The original diagrams (complementary, supplementary, vertically opposite,
   angles at a point), drawn the same way. "Unknown angle" is now its own set;
   which relationships appear is a Settings choice (at least one stays on). */
(() => {
  const VIEW = { w:420, h:260 };
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const randMul = (min, max, s = 5) => min + s * Math.floor(Math.random() * (Math.floor((max - min) / s) + 1));
  const shuffle = a => { a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const STATE = { complementary:"Complementary angles add to 90°", supplementary:"Angles on a straight line add to 180°", vertical:"Vertically opposite angles are equal", point:"Angles at a point add to 360°" };
  const NAME = { complementary:"Complementary", supplementary:"Supplementary (straight line)", vertical:"Vertically opposite", point:"Angles at a point" };
  const POINT_SETS = [[80, 40, 100, 140], [60, 70, 110, 120], [45, 95, 130, 90], [100, 50, 80, 130], [75, 85, 60, 140], [55, 125, 90, 90], [70, 120, 35, 135], [105, 45, 80, 130], [65, 115, 80, 100], [40, 100, 150, 70]];
  const COL = { "arc":"#2563eb", "arc green":"#16a34a", "arc orange":"#f97316" };
  const P = (cx, cy, a, l) => { const r = a * Math.PI / 180; return { x:cx + Math.cos(r) * l, y:cy - Math.sin(r) * l }; };
  const sweep = (s, e) => { let v = e - s; while(v < 0) v += 360; return v; };
  function D(){
    const out = [];
    const f = n => (+n).toFixed(2);
    const g = {
      line(x1, y1, x2, y2){ out.push(`<line x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}" class="ray"/>`); },
      ray(cx, cy, a, l){ const p = P(cx, cy, a, l); g.line(cx, cy, p.x, p.y); },
      arrow(tip, base, c){ const dx = tip.x - base.x, dy = tip.y - base.y, L = Math.hypot(dx, dy) || 1, px = -dy / L, py = dx / L, w = 5.2;
        out.push(`<polygon points="${f(tip.x)},${f(tip.y)} ${f(base.x + px * w)},${f(base.y + py * w)} ${f(base.x - px * w)},${f(base.y - py * w)}" fill="${c}"/>`); },
      arc(cx, cy, s, e, r, cls){
        const tot = sweep(s, e), off = Math.min((11 / r) * 180 / Math.PI, Math.max(1.5, tot / 4)), ls = s + off, le = e - off, c = COL[cls];
        const a = P(cx, cy, ls, r), b = P(cx, cy, le, r);
        out.push(`<path d="M ${f(a.x)} ${f(a.y)} A ${r} ${r} 0 ${sweep(ls, le) > 180 ? 1 : 0} 0 ${f(b.x)} ${f(b.y)}" class="${cls}"/>`);
        g.arrow(P(cx, cy, s, r), P(cx, cy, ls, r), c); g.arrow(P(cx, cy, e, r), P(cx, cy, le, r), c);
      },
      label(t, cx, cy, s, e, d, ans){ const p = P(cx, cy, s + sweep(s, e) / 2, d); out.push(`<text x="${f(p.x)}" y="${f(p.y)}" class="angleLabel${ans ? " ans" : ""}">${t}</text>`); },
      dot(cx, cy){ out.push(`<circle cx="${cx}" cy="${cy}" r="4" class="vertexDot"/>`); },
      right(cx, cy, s = 24){ out.push(`<polyline points="${cx + s},${cy} ${cx + s},${cy - s} ${cx},${cy - s}" class="rightMarker"/>`); },
      svg(){ return `<svg viewBox="0 0 ${VIEW.w} ${VIEW.h}" class="angle-svg" role="img" aria-label="Angle diagram">${out.join("")}</svg>`; }
    };
    return g;
  }
  /* reveal: false = front (x shown), true = back (x replaced by its value, in green) */
  const XI = '<tspan font-style="italic">x</tspan>';
  const lab = (c, i, reveal) => c.hidden === i ? (reveal ? `${XI} = ${c.values[i]}°` : XI) : c.values[i] + "°";
  function draw(c, reveal){
    const g = D(), v = c.values, isA = i => reveal && c.hidden === i;
    if(c.type === "complementary"){ const cx = 175, cy = 178, a = v[0];
      g.ray(cx, cy, 0, 170); g.ray(cx, cy, 90, 132); g.ray(cx, cy, a, 132); g.right(cx, cy);
      g.arc(cx, cy, 0, a, 48, "arc"); g.arc(cx, cy, a, 90, 56, "arc green");
      g.label(lab(c, 0, reveal), cx, cy, 0, a, 76, isA(0)); g.label(lab(c, 1, reveal), cx, cy, a, 90, 87, isA(1)); g.dot(cx, cy); }
    else if(c.type === "supplementary"){ const cx = 210, cy = 166, a = v[0];
      g.ray(cx, cy, 180, 170); g.ray(cx, cy, 0, 170); g.ray(cx, cy, a, 132);
      g.arc(cx, cy, 0, a, 50, "arc"); g.arc(cx, cy, a, 180, 58, "arc green");
      g.label(lab(c, 0, reveal), cx, cy, 0, a, 78, isA(0)); g.label(lab(c, 1, reveal), cx, cy, a, 180, 88, isA(1)); g.dot(cx, cy); }
    else if(c.type === "vertical"){ const cx = 210, cy = 135, a = v[0], b = c.base, o = b + a;
      const a1 = P(cx, cy, b, 174), a2 = P(cx, cy, b + 180, 174), b1 = P(cx, cy, o, 164), b2 = P(cx, cy, o + 180, 164);
      g.line(a1.x, a1.y, a2.x, a2.y); g.line(b1.x, b1.y, b2.x, b2.y);
      g.arc(cx, cy, b, o, 48, "arc"); g.arc(cx, cy, b + 180, o + 180, 48, "arc green");
      g.label(lab(c, 0, reveal), cx, cy, b, o, 78, isA(0)); g.label(lab(c, 1, reveal), cx, cy, b + 180, o + 180, 78, isA(1)); g.dot(cx, cy); }
    else { const cx = 210, cy = 132; let cur = c.rotation; const st = v.map(p => { const s = cur; cur += p; return s; });
      st.forEach(a => g.ray(cx, cy, a, 126));
      v.forEach((p, i) => { g.arc(cx, cy, st[i], st[i] + p, 44 + i * 5, ["arc", "arc green", "arc orange"][i % 3]); g.label(lab(c, i, reveal), cx, cy, st[i], st[i] + p, 74 + i * 4 + (isA(i) ? 10 : 0), isA(i)); });
      g.dot(cx, cy); }
    return g.svg();
  }
  function make(type, unknown){
    let values, extra = {};
    if(type === "complementary"){ const a = randMul(15, 75); values = [a, 90 - a]; }
    else if(type === "supplementary"){ const a = randMul(30, 150); values = [a, 180 - a]; }
    else if(type === "vertical"){ const a = randMul(35, 145); values = [a, a]; extra.base = pick([-20, -10, 0, 10, 20]); }
    else { values = shuffle(pick(POINT_SETS)); extra.rotation = pick([0, 15, 25, 35]); }
    return Object.assign({ type, values, hidden:unknown ? Math.floor(Math.random() * values.length) : null }, extra);
  }
  const TYPES = ["complementary", "supplementary", "vertical", "point"];
  const chosen = o => { const t = TYPES.filter(k => o["t_" + k]); return t.length ? t : TYPES; };
  window.FLIP_DECK = {
    title:"Flip Cards — Angle Relationships",
    outcome:"MA4-ANG-C-01",
    storeKey:"mmtFlip.angleTypes.v2",
    ratio:1.62,
    sets:[
      { id:"name", name:"Name the relationship", sub:"Say what the angles do: add to 90°, add to 180°, are equal, add to 360°", prompt:"Which angle relationship is this?",
        gen(o){ const c = make(pick(chosen(o)), false); return { key:c.type + c.values.join(), render:() => ({ front:{ pic:draw(c, false) }, back:{ main:NAME[c.type], ui:true, wrap:true, sub:STATE[c.type] } }) }; } },
      { id:"unknown", name:"Find the unknown angle", sub:"Find x and give the reason", prompt:"Find the value of x. Give a reason.",
        gen(o){ const c = make(pick(chosen(o)), true); return { key:c.type + c.values.join() + c.hidden, render:r => ({ front:{ pic:draw(c, false) },
          back:{ main:`<i class="mv">x</i> = ${c.values[c.hidden]}°`, sub:r.why ? STATE[c.type] : "", pic:r.pic ? draw(c, true) : "", side:r.pic } }) }; } }
    ],
    settings:[
      { id:"t_complementary", type:"switch", label:"Complementary", def:true, group:"Relationships" },
      { id:"t_supplementary", type:"switch", label:"Supplementary (straight line)", def:true, group:"Relationships" },
      { id:"t_vertical", type:"switch", label:"Vertically opposite", def:true, group:"Relationships" },
      { id:"t_point", type:"switch", label:"Angles at a point", def:true, group:"Relationships", note:"With every relationship off, all four are used." },
      { id:"why", type:"switch", label:"Give the reason on the back", def:true, repaint:true, group:"On the back" },
      { id:"pic", type:"switch", label:"Diagram with x filled in on the back", def:true, repaint:true, group:"On the back" }
    ],
    tools:[],
    notes:`<p>Find the unknown angle wants the value <b>and</b> the reason, the way it is written in a book: x = 35&deg; (angles on a straight line add to 180&deg;).</p>`
  };
})();
</script>
