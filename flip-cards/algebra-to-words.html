<script>
/* WORDS AND ALGEBRA — flip cards on the shared MMT engine (rebuilt 2026-11-18).
   The original Basic and Expected phrases, both ways round: words → expression
   (as before) and, new, expression → words. "Clean notation" (2x, x/2) or the
   operation signs (2 × x, x ÷ 2) is a setting; it used to be the F key, which is
   now full screen in every flip-card deck. */
(() => {
  const VARS = ["x", "a", "b", "c", "n", "y", "p", "w"];
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const v = x => `<i class="mv">${x}</i>`;
  const fr = (t, b) => `<span class="frac"><span>${t}</span><span>${b}</span></span>`;
  const M = "−", X = "×", DV = "÷";
  const BASIC = [
    [x => `5 more than ${v(x)}`, x => [`${v(x)} + 5`, `${v(x)} + 5`]],
    [x => `${v(x)} increased by 7`, x => [`${v(x)} + 7`, `${v(x)} + 7`]],
    [x => `3 less than ${v(x)}`, x => [`${v(x)} ${M} 3`, `${v(x)} ${M} 3`]],
    [x => `${v(x)} decreased by 4`, x => [`${v(x)} ${M} 4`, `${v(x)} ${M} 4`]],
    [x => `twice ${v(x)}`, x => [`2 ${X} ${v(x)}`, `2${v(x)}`]],
    [x => `three times ${v(x)}`, x => [`3 ${X} ${v(x)}`, `3${v(x)}`]],
    [x => `${v(x)} divided by 2`, x => [`${v(x)} ${DV} 2`, fr(v(x), "2")]],
    [x => `half of ${v(x)}`, x => [`${v(x)} ${DV} 2`, fr(v(x), "2")]],
    [x => `10 more than ${v(x)}`, x => [`${v(x)} + 10`, `${v(x)} + 10`]],
    [x => `6 less than ${v(x)}`, x => [`${v(x)} ${M} 6`, `${v(x)} ${M} 6`]]
  ];
  const EXPECTED = [
    [x => `3 more than twice ${v(x)}`, x => [`2 ${X} ${v(x)} + 3`, `2${v(x)} + 3`]],
    [x => `5 less than three times ${v(x)}`, x => [`3 ${X} ${v(x)} ${M} 5`, `3${v(x)} ${M} 5`]],
    [x => `the sum of ${v(x)} and 7, multiplied by 2`, x => [`2 ${X} (${v(x)} + 7)`, `2(${v(x)} + 7)`]],
    [x => `half of (${v(x)} + 6)`, x => [`(${v(x)} + 6) ${DV} 2`, fr(`${v(x)} + 6`, "2")]],
    [x => `the difference between 10 and ${v(x)}`, x => [`10 ${M} ${v(x)}`, `10 ${M} ${v(x)}`]],
    [x => `4 more than three times ${v(x)}`, x => [`3 ${X} ${v(x)} + 4`, `3${v(x)} + 4`]],
    [x => `twice the sum of ${v(x)} and 5`, x => [`2 ${X} (${v(x)} + 5)`, `2(${v(x)} + 5)`]],
    [x => `the product of 4 and (${v(x)} ${M} 3)`, x => [`4 ${X} (${v(x)} ${M} 3)`, `4(${v(x)} ${M} 3)`]],
    [x => `7 less than half of ${v(x)}`, x => [`${v(x)} ${DV} 2 ${M} 7`, `${fr(v(x), "2")} ${M} 7`]],
    [x => `the quotient of (${v(x)} + 8) and 4`, x => [`(${v(x)} + 8) ${DV} 4`, fr(`${v(x)} + 8`, "4")]]
  ];
  const card = (bank, reverse) => () => {
    const i = Math.floor(Math.random() * bank.length), x = pick(VARS), [w, e] = bank[i];
    return { key:i + x, render:o => {
      const ex = e(x)[o.clean ? 1 : 0], words = w(x);
      return reverse
        ? { front:{ main:ex }, back:{ main:words, ui:true, wrap:true, sub:o.why ? "Other wordings are fine if they mean the same thing." : "" } }
        : { front:{ main:words, ui:true, wrap:true }, back:{ main:ex } };
    } };
  };
  window.FLIP_DECK = {
    title:"Flip Cards — Words and Algebra",
    outcome:"MA4-ALG-C-01",
    storeKey:"mmtFlip.algebraWords.v2",
    fontScale:.2,
    sets:[
      { id:"basic", name:"Basic: words → algebra", sub:"One step: “5 more than x”, “twice x”", ex:"5 more than x → x + 5", prompt:"Write it as an algebraic expression.", gen:card(BASIC, false) },
      { id:"expected", name:"Expected: words → algebra", sub:"Two steps, grouping, doubling and halving", ex:"twice the sum of x and 5 → 2(x + 5)", prompt:"Write it as an algebraic expression.", gen:card(EXPECTED, false) },
      { id:"basicR", name:"Basic: algebra → words", sub:"Say the expression in words", ex:"x − 3 → 3 less than x", prompt:"Write it in words.", gen:card(BASIC, true) },
      { id:"expectedR", name:"Expected: algebra → words", sub:"Say the order of the operations in words", ex:"2x + 3 → 3 more than twice x", prompt:"Write it in words.", gen:card(EXPECTED, true) }
    ],
    settings:[
      { id:"clean", type:"switch", label:"Algebra notation (2x, x/2)", def:false, repaint:true, note:"Off writes the operations: 2 × x, x ÷ 2. On writes 2x and a fraction bar." },
      { id:"why", type:"switch", label:"“Other wordings are fine” note", def:true, repaint:true, note:"On the algebra → words cards." }
    ],
    tools:[],
    notes:`<p>Two directions: words to algebra, and algebra back to words. Many wordings are right for the second; accept any that mean the same thing.</p><p>Talk about the order: &ldquo;3 more than twice x&rdquo; doubles first, so 2x + 3.</p>`
  };
})();
</script>
<script src="shared/flipcards.js?v=ed8c1019"></script>
