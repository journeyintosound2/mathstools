<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Integers — Worksheet Generator</title>
  <style>
    :root{
      --bg:#f6f7fb;
      --card:#ffffff;
      --ink:#111827;
      --muted:#6b7280;
      --border:#e5e7eb;
      --shadow: 0 14px 40px rgba(0,0,0,.10);
      --radius: 18px;

      --line:#111827;
      --tick:#111827;

      --box:#0f172a;
      --ok:#16a34a;

      --footer-h: 44px;
      --pagePad: 12mm;
      --innerRadius: 14px;

      --mathFont: "Cambria Math", "STIX Two Math", "STIXGeneral", "Times New Roman", serif;
      --uiFont: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: var(--uiFont);
      background: var(--bg);
      color: var(--ink);
      padding-bottom: var(--footer-h);
    }

    .wrap{ max-width: 1100px; margin: 18px auto 40px; padding: 0 16px; }
    .panel{
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .controls{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap: 14px;
      flex-wrap:wrap;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: linear-gradient(180deg,#ffffff,#f9fafb);
    }

    label{
      display:block;
      font-weight: 950;
      color: var(--ink);
      margin: 0 0 8px;
      font-size: 13px;
    }

    select, input[type="number"], input[type="text"]{
      border: 2px solid #e5e7eb;
      border-radius: 14px;
      padding: 12px 12px;
      font-weight: 950;
      font-size: 16px;
      background:#fff;
      min-width: 260px;
      outline:none;
    }
    input[type="number"]{ min-width: 220px; }

    .checks{
      display:flex;
      gap: 12px 14px;
      flex-wrap:wrap;
      align-items:center;
      padding: 6px 0 0;
    }

    .checksHeader{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
      width:100%;
      margin-bottom: 2px;
    }
    .checksTitle{
      margin:0;
      font-size:13px;
      font-weight:950;
      color:var(--muted);
    }
    .miniBtn{
      border:none;
      border-radius: 999px;
      padding: 8px 12px;
      font-weight: 950;
      cursor:pointer;
      background:#eef2ff;
      color:#1d4ed8;
      font-size: 12px;
      line-height:1;
      box-shadow: 0 8px 18px rgba(0,0,0,.04);
    }
    .miniBtn:active{ transform: scale(.98); }
    .chk{
      display:flex;
      gap: 10px;
      align-items:center;
      border: 1px solid rgba(229,231,235,.95);
      background:#fff;
      border-radius: 999px;
      padding: 10px 12px;
      box-shadow: 0 8px 18px rgba(0,0,0,.04);
      user-select:none;
    }
    .chk input{ width: 18px; height: 18px; }
    .chk span{
      font-weight: 950;
      font-size: 13px;
      color:#111827;
      white-space: nowrap;
    }

    .btnRow{
      display:flex;
      gap: 10px;
      flex-wrap:wrap;
      align-items:center;
      justify-content:flex-end;
    }

    button{
      border:none;
      border-radius: 14px;
      padding: 12px 16px;
      font-weight: 1000;
      cursor:pointer;
      background:#f3f4f6;
      color:#111827;
      transition: transform .04s ease, filter .15s ease, opacity .2s ease;
      user-select:none;
      font-size: 16px;
    }
    button:active{ transform: scale(.98); }
    button.primary{ background:#2563eb; color:#fff; }
    button.ghost{ background:#eef2ff; color:#1d4ed8; }
    button.danger{ background:#fee2e2; color:#991b1b; }

    .outWrap{ margin-top: 16px; }
    .outWrap.flashGenerate{
      animation: flashGenerate .42s ease-out;
    }
    @keyframes flashGenerate{
      0%{ filter: brightness(1.04); transform: translateY(-1px); }
      45%{ filter: brightness(1.01); transform: translateY(0); }
      100%{ filter: brightness(1); transform: translateY(0); }
    }

    .page{
      margin-top: 16px;
      background:#fff;
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 10px 26px rgba(15,23,42,.08);
      overflow:hidden;
      position: relative;
    }

    .pageBorder{
      position:absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      pointer-events:none;
      opacity: 1;
    }

    .pageInner{
      position: relative;
      z-index: 1;
      padding: 0;
    }

    .pageContent{
      margin: var(--pagePad);
      background:#fff;
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 0 0 1px rgba(229,231,235,.9) inset;
    }

    .pageHeader{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap: 14px;
      flex-wrap:wrap;
      margin-bottom: 10px;
    }

    .hdrLeft{ min-width: 240px; }
    .hdrTitle{
      font-weight: 1000;
      font-size: 18px;
      line-height: 1.15;
      margin-bottom: 2px;
    }
    .hdrSub{
      color: var(--muted);
      font-weight: 900;
      font-size: 12px;
      line-height: 1.2;
    }

    .nameRow{
      display:grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      align-items:end;
      min-width: min(420px, 100%);
    }
    .lineField{ display:flex; flex-direction:column; gap: 6px; min-width: 0; }
    .lineLabel{ font-size: 12px; font-weight: 950; color: var(--muted); }
    .lineBox{
      height: 30px;
      border: 2px solid #111827;
      border-radius: 10px;
      background:#fff;
      width: 100%;
    }

    .grid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px 16px;
      margin-top: 10px;
    }

    .grid.abMode{
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .qCard{
      border: 1px solid rgba(229,231,235,.95);
      border-radius: 16px;
      padding: 12px 12px 12px;
      background:#fff;
      min-height: 190px;
      display:flex;
      flex-direction:column;
      gap: 8px;
    }

    .qCard.abHard{
      min-height: 280px;
      padding: 16px 16px 14px;
    }

    .qTop{
      display:flex;
      align-items:flex-start;
      justify-content:flex-start;
      gap: 12px;
    }
    .qNum{
      font-weight: 1000;
      font-size: 18px;
      min-width: 44px;
      color:#111827;
    }
    .qText{
      font-family: var(--mathFont);
      font-weight: 700;
      font-size: 17px;
      line-height: 1.2;
      color:#111827;
      letter-spacing: 0;
    }

    .workArea{
      margin-top: 2px;
      border: 1px solid rgba(229,231,235,.95);
      border-radius: 16px;
      padding: 10px 10px;
      background: #fff;
      flex: 1;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .svg{
      width: 100%;
      height: 86px;
      display:block;
    }

    .ansRow{
      margin-top: 6px;
      display:flex;
      align-items:center;
      justify-content:flex-start;
      gap: 10px;
    }
    .ansLabel{
      font-weight: 900;
      font-size: 14px;
      font-family: var(--uiFont);
    }
    .ansBox{
      flex: 1;
      min-width: 0;
      height: 34px;
      border: 2px solid #111827;
      border-radius: 12px;
      background:#fff;
    }
    .ansBox.key{
      border-color: var(--ok);
      background: rgba(22,163,74,.08);
      display:flex;
      align-items:center;
      justify-content:center;
      font-family: var(--mathFont);
      font-weight: 700;
      color: var(--ok);
      font-size: 18px;
    }

    .ineqRow{
      margin-top: 8px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap: 10px;
      width: 100%;
      flex-wrap: wrap;
    }
    .pill{
      border: 2px solid rgba(17,24,39,.25);
      border-radius: 12px;
      padding: 8px 12px;
      font-family: var(--mathFont);
      font-weight: 700;
      font-size: 20px;
      min-width: 54px;
      text-align:center;
      background:#fff;
      white-space: nowrap;
    }
    .symBox{
      width: 46px;
      height: 40px;
      border: 2px solid #111827;
      border-radius: 10px;
      background:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      font-family: var(--mathFont);
      font-weight: 700;
      font-size: 22px;
    }
    .symBox.key{
      border-color: var(--ok);
      background: rgba(22,163,74,.08);
      color: var(--ok);
    }

    .orderRow{ margin-top: 6px; display:flex; justify-content:center; gap: 10px; flex-wrap:wrap; }
    .orderAns{ margin-top: 10px; display:flex; justify-content:center; gap: 8px; }
    .orderBox{ width: 42px; height: 38px; border: 2px solid #111827; border-radius: 10px; background:#fff; }
    .orderBox.key{
      border-color: var(--ok);
      background: rgba(22,163,74,.08);
      color: var(--ok);
      display:flex;
      align-items:center;
      justify-content:center;
      font-family: var(--mathFont);
      font-weight:700;
      font-size: 18px;
    }

    .opExpr{
      font-family: var(--mathFont);
      font-weight: 700;
      font-size: 24px;
      line-height: 1.2;
      color:#111827;
      text-align:center;
      width:100%;
    }

   .opExpr.hard{
  font-size: 25px;
  line-height: 1.15;
  text-align:left;
  width:100%;
  display:flex;
  align-items:flex-start;
  justify-content:flex-start;
  flex-wrap:wrap;
  gap: 0;
}
.opExpr.hard .mExpr{
  max-width: 100%;
}

.opExpr.hard .mFrac{
  flex: 0 1 auto;
}

.opExpr.hard .mParen,
.opExpr.hard .mOp,
.opExpr.hard .mAtom{
  flex: 0 1 auto;
}

    .hardWorkWrap{
      width:100%;
      border: none;
      background: transparent;
      display:flex;
      flex-direction:column;
      align-items:stretch;
      justify-content:flex-start;
      padding: 2px 4px 0;
      min-height: 210px;
    }

    .hardExprLine{
      min-height: 56px;
      display:flex;
      align-items:flex-start;
      justify-content:flex-start;
      padding: 2px 2px 8px;
    }

    .hardBlank{
      flex:1;
      min-height: 130px;
      border-radius: 12px;
      background:
        linear-gradient(to bottom, transparent 31px, rgba(17,24,39,.08) 32px, transparent 33px);
      background-size: 100% 32px;
    }

    .hardKeyRow{
      margin-top: 10px;
      display:flex;
      align-items:center;
      gap: 10px;
    }

    .hardKeyLabel{
      font-weight: 900;
      font-size: 14px;
    }

    .hardKeyValue{
      min-width: 120px;
      height: 38px;
      padding: 0 16px;
      border-radius: 12px;
      border: 2px solid var(--ok);
      background: rgba(22,163,74,.08);
      display:flex;
      align-items:center;
      justify-content:center;
      font-family: var(--mathFont);
      font-weight: 700;
      color: var(--ok);
      font-size: 20px;
    }

    .mExpr{
      display:inline-flex;
      align-items:center;
      flex-wrap:wrap;
      vertical-align:middle;
      font-family: var(--mathFont);
      font-weight:700;
      color:#111827;
    }

    .mParen,
    .mOp,
    .mAtom{
      display:inline-block;
      white-space:nowrap;
    }

    .mSpace{
      width: .26em;
      display:inline-block;
    }

    .mFrac{
      display:inline-flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      vertical-align:middle;
      margin: 0 .12em;
      line-height:1.05;
    }

    .mFracTop{
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 0 .18em .06em;
      border-bottom: 2px solid #111827;
      min-width: 1.4em;
    }

    .mFracBottom{
      display:flex;
      align-items:center;
      justify-content:center;
      padding: .06em .18em 0;
      min-width: 1.4em;
    }

    .baseline{ stroke: var(--line); stroke-width: 6; stroke-linecap: round; }
    .tickMajor{ stroke: var(--tick); stroke-width: 6; stroke-linecap: round; }
    .tickUnit{ stroke: rgba(17,24,39,.45); stroke-width: 3; stroke-linecap: round; }
    .dot{ fill: #111827; opacity: 0.92; }
    .dot.zero{ opacity: 0.85; }
    .dot.answer{ fill: var(--ok); opacity: 0.95; }
    .label{
      font-family: var(--mathFont);
      font-size: 24px;
      font-weight: 700;
      fill:#111827;
    }
    .label.answer{
      font-family: var(--mathFont);
      fill: var(--ok);
    }


    .topSelectors{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap: 14px;
      flex-wrap:wrap;
      width:100%;
    }
    .outcomeControl{ flex: 1 1 360px; min-width: 320px; }
    .outcomeControl select{ width:100%; }
    .languageControl{
      flex: 0 1 300px;
      min-width: 240px;
      display:flex;
      flex-direction:column;
      align-items:flex-end;
    }
    .languageControl select{ min-width: 240px; width:100%; }
    .languageControl label{ text-align:right; }

    .page.lang-rtl .pageHeader,
    .page.lang-rtl .qTop,
    .page.lang-rtl .ansRow,
    .page.lang-rtl .hardKeyRow{ direction: rtl; }
    .page.lang-rtl .qText,
    .page.lang-rtl .hdrTitle,
    .page.lang-rtl .hdrSub,
    .page.lang-rtl .lineLabel,
    .page.lang-rtl .ansLabel,
    .page.lang-rtl .hardKeyLabel{ text-align: right; }
    .page.lang-rtl .qNum{ text-align: left; }
    .page.lang-rtl .ineqRow,
    .page.lang-rtl .orderRow,
    .page.lang-rtl .orderAns,
    .page.lang-rtl .opExpr,
    .page.lang-rtl svg{ direction:ltr; }
    .page.lang-rtl .pill,
    .page.lang-rtl .symBox,
    .page.lang-rtl .ansBox.key,
    .page.lang-rtl .hardKeyValue{ direction:ltr; }

    @media print{
      @page{ size: A4; margin: 12mm; }

      body{ background:#fff !important; padding:0 !important; }
      .controls{ display:none !important; }

      .wrap{ max-width:none !important; margin:0 !important; padding:0 !important; }

      :root{ --pagePad: 4mm; }

      .page{
        width: 186mm;
        height: 273mm;
        margin: 0 auto;
        border: none;
        box-shadow: none;
        page-break-after: always;
      }
      .page:last-child{ page-break-after: auto; }

      .pageContent{ margin: var(--pagePad); padding: 12px; }
      .pageHeader{ flex-wrap: nowrap !important; gap: 10px !important; }
      .grid{ gap: 12px !important; }
      .grid.abMode{ gap: 12px !important; }
      .qCard{ break-inside: avoid; padding: 12px !important; }

 .qCard.abHard{
  min-height: 242px !important;
  padding: 10px 10px 12px !important;
}

.hardWorkWrap{
  min-height: 172px !important;
}

.hardExprLine{
  padding: 0 0 6px !important;
}

.hardBlank{
  min-height: 108px !important;
  background-size: 100% 28px !important;
}

.opExpr.hard{
  font-size: 19px !important;
  line-height: 1.08 !important;
  letter-spacing: -.01em !important;
}
    }
  </style>
<!-- mmt-pwa -->
<link rel="manifest" href="../../../../manifest.webmanifest">
<meta name="theme-color" content="#1f3a5f">
<link rel="apple-touch-icon" href="../../../../icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MMT">
<script src="../../../../pwa.js" defer></script>
<!-- /mmt-pwa -->
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <div class="controls">
        <div style="min-width:320px; flex:1 1 560px;">
          <div class="topSelectors">
            <div class="outcomeControl">
              <label for="outcomeSel">Stage outcome</label>
              <select id="outcomeSel">
                <option value="basic_de">Stage 4 — Integers (D/E basic)</option>
                <option value="c_expected">Stage 4 — Integers (C-Expected)</option>
                <option value="ab_thorough">Stage 4 — Integers (A/B thorough)</option>
              </select>
            </div>

            <div class="languageControl">
              <label for="languageSel">Worksheet language</label>
              <select id="languageSel">
                <option value="en">English</option>
                <option value="fa">Farsi / Persian (فارسی)</option>
                <option value="ar">Arabic (العربية)</option>
              </select>
            </div>
          </div>

          <div class="checks" aria-label="Question types">
            <div class="checksHeader">
              <label class="checksTitle">Question types (checkboxes)</label>
              <button id="toggleAllBtn" type="button" class="miniBtn">Deselect all</button>
            </div>
            <div id="checksHost" style="display:flex; gap:12px 14px; flex-wrap:wrap; align-items:center; width:100%;"></div>
          </div>
        </div>

        <div style="display:flex; gap:14px; align-items:flex-end; flex-wrap:wrap;">
          <div>
            <label id="countLabel" for="countInp">Total questions</label>
            <input id="countInp" type="number" min="3" max="48" step="1" value="6" />
          </div>
          <div class="btnRow">
            <button id="genBtn" class="primary">Generate</button>
            <button id="printBtn" class="ghost">Print / Save as PDF</button>
            <button id="resetBtn" class="danger">Reset</button>
          </div>
        </div>
      </div>

      <div id="out" class="outWrap"></div>
    </div>
  </div>

<script>
(() => {
  // ------------------------------------------------------------
  // Config
  // ------------------------------------------------------------
  const BORDER_SRC = "border_page0.png"; // must sit beside this HTML


  const I18N = {
    en: {
      dir:"ltr",
      worksheet:"Worksheet", answerKey:"Answer key", page:"Page", of:"of", name:"Name", className:"Class", date:"Date", answer:"Answer:", noTypes:"Please tick at least one question type.",
      basicHeader:"Stage 4 — Integers · Grades D/E — friendly numbers + diagrams",
      cHeader:"Stage 4 - Integers - Grade C - Expected",
      abHeader:"Stage 4 - Integers - A/B Thorough",
      place:v=>`Place ${v} on the number line.`,
      useLine:(a,op,b)=>`Use the number line to calculate: ${a} ${op} ${b}`,
      insertSym:"Insert either <, > or = to make the statement true.",
      order:(nums,dir)=>`Place the integers ${nums} in ${dir} order.`,
      ascending:"ascending", descending:"descending",
      calculateExpr:(a,op,b)=>`Calculate: ${a} ${op} ${b}`,
      calculate:"Calculate:",
      oop:"Use order of operations to calculate."
    },
    fa: {
      dir:"rtl",
      worksheet:"برگه تمرین", answerKey:"پاسخ‌نامه", page:"صفحه", of:"از", name:"نام", className:"کلاس", date:"تاریخ", answer:"پاسخ:", noTypes:"لطفاً حداقل یک نوع پرسش را انتخاب کنید.",
      basicHeader:"مرحله ۴ — اعداد صحیح · سطح D/E — عددهای ساده و نمودارها",
      cHeader:"مرحله ۴ — اعداد صحیح — سطح C مورد انتظار",
      abHeader:"مرحله ۴ — اعداد صحیح — سطح A/B پیشرفته",
      place:v=>`${v} را روی خط اعداد قرار دهید.`,
      useLine:(a,op,b)=>`از خط اعداد برای محاسبه استفاده کنید: ${a} ${op} ${b}`,
      insertSym:"یکی از علامت‌های <، > یا = را قرار دهید تا عبارت درست شود.",
      order:(nums,dir)=>`اعداد صحیح ${nums} را به ترتیب ${dir} قرار دهید.`,
      ascending:"صعودی", descending:"نزولی",
      calculateExpr:(a,op,b)=>`محاسبه کنید: ${a} ${op} ${b}`,
      calculate:"محاسبه کنید:",
      oop:"با رعایت ترتیب عملیات محاسبه کنید."
    },
    ar: {
      dir:"rtl",
      worksheet:"ورقة عمل", answerKey:"دليل الإجابات", page:"صفحة", of:"من", name:"الاسم", className:"الصف", date:"التاريخ", answer:"الإجابة:", noTypes:"يرجى اختيار نوع سؤال واحد على الأقل.",
      basicHeader:"المرحلة ٤ — الأعداد الصحيحة · المستوى D/E — أعداد سهلة ورسوم بيانية",
      cHeader:"المرحلة ٤ — الأعداد الصحيحة — المستوى C المتوقع",
      abHeader:"المرحلة ٤ — الأعداد الصحيحة — المستوى A/B المتقدم",
      place:v=>`ضع ${v} على خط الأعداد.`,
      useLine:(a,op,b)=>`استخدم خط الأعداد للحساب: ${a} ${op} ${b}`,
      insertSym:"ضع أحد الرموز < أو > أو = لتصبح العبارة صحيحة.",
      order:(nums,dir)=>`رتّب الأعداد الصحيحة ${nums} ترتيبًا ${dir}.`,
      ascending:"تصاعديًا", descending:"تنازليًا",
      calculateExpr:(a,op,b)=>`احسب: ${a} ${op} ${b}`,
      calculate:"احسب:",
      oop:"استخدم ترتيب العمليات للحساب."
    }
  };

  function lang(){ return languageSel?.value || "en"; }
  function L(){ return I18N[lang()] || I18N.en; }
  function tr(key){ return L()[key] ?? I18N.en[key] ?? key; }
  function joinList(items){ return items.join(lang() === "en" ? ", " : "، "); }
  function currentHeader(){
    if (outcomeSel.value === "basic_de") return tr("basicHeader");
    if (outcomeSel.value === "ab_thorough") return tr("abHeader");
    return tr("cHeader");
  }

  // Basic ranges

  // Helpers
  function xmur3(str){
    let h = 1779033703 ^ str.length;
    for (let i=0; i<str.length; i++){
      h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
      h = (h << 13) | (h >>> 19);
    }
    return function(){
      h = Math.imul(h ^ (h >>> 16), 2246822507);
      h = Math.imul(h ^ (h >>> 13), 3266489909);
      h ^= (h >>> 16);
      return h >>> 0;
    };
  }
  function mulberry32(a){
    return function(){
      let t = a += 0x6D2B79F5;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  let rng = Math.random;

  const randInt = (a,b) => Math.floor(rng()*(b-a+1))+a;
  const choice = (arr) => arr[randInt(0, arr.length-1)];
  const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
  const clearOut = () => { out.innerHTML = ""; };
  const fmtInt = (n) => String(Math.trunc(n));
  const shuffle = (arr) => {
    const a = arr.slice();
    for (let i=a.length-1; i>0; i--){
      const j = Math.floor(rng()*(i+1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };

  function uniqPush(arr, item, keyFn){
    const k = keyFn(item);
    if (arr.some(x => keyFn(x) === k)) return false;
    arr.push(item);
    return true;
  }

  function tok(n){
    return n < 0 ? `(${fmtInt(n)})` : fmtInt(n);
  }
  function randSign(){ return rng() < 0.5 ? -1 : 1; }

  function makeBalancedList(typeIds, n){
    const ids = typeIds.slice();
    if (!ids.length) return [];
    const list = [];
    let i = 0;
    while (list.length < n){
      list.push(ids[i % ids.length]);
      i++;
    }
    return shuffle(list);
  }

  function expandWeighted(forms){
    const bag = [];
    for (const f of forms){
      for (let i=0;i<f.w;i++) bag.push(f.id);
    }
    return bag;
  }

  function makeWeightedBalancedList(forms, m){
    const bag = expandWeighted(forms);
    const out = [];
    while (out.length < m){
      const chunk = shuffle(bag);
      for (const id of chunk){
        out.push(id);
        if (out.length >= m) break;
      }
    }
    return out;
  }

  function makeBalancedOpList(m){
    const ops = ["+","−","×","÷"];
    if (m<=0) return [];
    const list = [];
    let i=0;
    while (list.length < m){
      list.push(ops[i % ops.length]);
      i++;
    }
    return shuffle(list);
  }

  function elNS(name, attrs={}, children=[]){
    const n = document.createElementNS("http://www.w3.org/2000/svg", name);
    for (const [k,v] of Object.entries(attrs)) n.setAttribute(k, String(v));
    for (const c of children) n.appendChild(c);
    return n;
  }
  function textNS(str, attrs={}){
    const t = elNS("text", attrs);
    t.textContent = str;
    return t;
  }

  // ------------------------------------------------------------
  // Math HTML helpers for hard A/B mode
  // ------------------------------------------------------------
  function esc(s){
    return String(s)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;");
  }

  function unicodeInt(n, forcePlus=false){
    const v = Math.trunc(n);
    if (v < 0) return `−${Math.abs(v)}`;
    if (forcePlus) return `+${v}`;
    return `${v}`;
  }

  function intHTML(n, opts={}){
    const v = Math.trunc(n);
    const { forcePlus=false, parenNeg=true } = opts;
    if (v < 0){
      return parenNeg
        ? `<span class="mAtom">(${esc(unicodeInt(v))})</span>`
        : `<span class="mAtom">${esc(unicodeInt(v))}</span>`;
    }
    if (forcePlus){
      return `<span class="mAtom">(${esc(unicodeInt(v, true))})</span>`;
    }
    return `<span class="mAtom">${esc(unicodeInt(v))}</span>`;
  }

  function opHTML(op){
    return `<span class="mSpace"></span><span class="mOp">${esc(op)}</span><span class="mSpace"></span>`;
  }

  function wrapHTML(html){
    return `<span class="mParen">(</span>${html}<span class="mParen">)</span>`;
  }

  function fracHTML(top, bottom){
    return `
      <span class="mFrac">
        <span class="mFracTop">${top}</span>
        <span class="mFracBottom">${bottom}</span>
      </span>
    `;
  }

  function comp(html, val, ops){
    return { html, val, ops };
  }

  function smallInt(noZero=false){
    let v = randInt(-12, 12);
    if (noZero){
      while (v === 0) v = randInt(-12, 12);
    }
    return v;
  }

  function withinABLimit(n){
    return Number.isInteger(n) && Math.abs(n) <= AB_LIMIT;
  }

  function buildLeafAB(){
    const v = smallInt(false);
    return comp(intHTML(v), v, 0);
  }

  function buildPrim1AB(){
    let tries = 0;
    while (tries++ < 300){
      const kind = choice(["add","sub","mult","frac"]);
      if (kind === "add"){
        const a = smallInt();
        const b = smallInt();
        const val = a + b;
        if (!withinABLimit(val)) continue;
        return comp(
          `${intHTML(a)}${opHTML("+")}${intHTML(b, { forcePlus: b > 0 })}`,
          val,
          1
        );
      }
      if (kind === "sub"){
        const a = smallInt();
        const b = smallInt();
        const val = a - b;
        if (!withinABLimit(val)) continue;
        return comp(
          `${intHTML(a)}${opHTML("−")}${intHTML(b, { forcePlus: b > 0 })}`,
          val,
          1
        );
      }
      if (kind === "mult"){
        const a = smallInt(true);
        const b = smallInt(true);
        const val = a * b;
        if (!withinABLimit(val)) continue;
        return comp(
          `${intHTML(a)}${opHTML("×")}${intHTML(b, { forcePlus: b > 0 })}`,
          val,
          1
        );
      }
      if (kind === "frac"){
        const dAbs = randInt(2, 8);
        const d = dAbs * randSign();
        const q = smallInt();
        const n = q * d;
        const val = q;
        if (!withinABLimit(val)) continue;
        return comp(
          fracHTML(intHTML(n, { parenNeg: false }), intHTML(d, { parenNeg: false })),
          val,
          1
        );
      }
    }
    return comp(`${intHTML(6)}${opHTML("+")}${intHTML(-3)}`, 3, 1);
  }

  function buildPrim2AB(){
    let tries = 0;
    while (tries++ < 600){
      const kind = choice(["a_times_group","group_times_c","frac_addsub","frac_prod","triple_chain"]);
      if (kind === "a_times_group"){
        const a = smallInt(true);
        const b = smallInt();
        const c = smallInt();
        const innerOp = rng() < 0.5 ? "+" : "−";
        const innerVal = innerOp === "+" ? b + c : b - c;
        const val = a * innerVal;
        if (!withinABLimit(val)) continue;
        const inner = `${intHTML(b)}${opHTML(innerOp)}${intHTML(c, { forcePlus: c > 0 })}`;
        return comp(
          `${intHTML(a)}${opHTML("×")}${wrapHTML(inner)}`,
          val,
          2
        );
      }
      if (kind === "group_times_c"){
        const a = smallInt();
        const b = smallInt();
        const c = smallInt(true);
        const innerOp = rng() < 0.5 ? "+" : "−";
        const innerVal = innerOp === "+" ? a + b : a - b;
        const val = innerVal * c;
        if (!withinABLimit(val)) continue;
        const inner = `${intHTML(a)}${opHTML(innerOp)}${intHTML(b, { forcePlus: b > 0 })}`;
        return comp(
          `${wrapHTML(inner)}${opHTML("×")}${intHTML(c, { forcePlus: c > 0 })}`,
          val,
          2
        );
      }
      if (kind === "frac_addsub"){
        const dAbs = randInt(2, 8);
        const d = dAbs * randSign();
        const a = smallInt();
        const q = smallInt();
        const target = q * d;
        const b = randInt(-12, 12);
        const op = rng() < 0.5 ? "+" : "−";
        const topVal = op === "+" ? a + b : a - b;
        const offset = target - topVal;

        const aa = a + offset;
        const topFinal = op === "+" ? aa + b : aa - b;
        if (topFinal !== target) continue;
        if (Math.abs(aa) > 20) continue;
        const val = target / d;
        if (!withinABLimit(val)) continue;

        const topExpr = `${intHTML(aa)}${opHTML(op)}${intHTML(b, { forcePlus: b > 0 })}`;
        return comp(
          fracHTML(topExpr, intHTML(d, { parenNeg: false })),
          val,
          2
        );
      }
      if (kind === "frac_prod"){
        const dAbs = randInt(2, 8);
        const d = dAbs * randSign();
        const a = smallInt(true);
        const q = smallInt();
        const target = q * d;
        if (target % a !== 0) continue;
        const b = target / a;
        if (b < -12 || b > 12 || b === 0) continue;
        const val = target / d;
        if (!withinABLimit(val)) continue;
        const topExpr = `${intHTML(a)}${opHTML("×")}${intHTML(b, { forcePlus: b > 0 })}`;
        return comp(
          fracHTML(wrapHTML(topExpr), intHTML(d, { parenNeg: false })),
          val,
          2
        );
      }
      if (kind === "triple_chain"){
        const a = smallInt();
        const b = smallInt();
        const c = smallInt();
        const op1 = rng() < 0.5 ? "+" : "−";
        const op2 = rng() < 0.5 ? "+" : "−";
        const val1 = op1 === "+" ? a + b : a - b;
        const val = op2 === "+" ? val1 + c : val1 - c;
        if (!withinABLimit(val)) continue;
        const html = wrapHTML(
          `${intHTML(a)}${opHTML(op1)}${intHTML(b, { forcePlus: b > 0 })}${opHTML(op2)}${intHTML(c, { forcePlus: c > 0 })}`
        );
        return comp(html, val, 2);
      }
    }
    return comp(
      `${intHTML(-3)}${opHTML("−")}${fracHTML(intHTML(-12, { parenNeg:false }), intHTML(4, { parenNeg:false }))}`,
      0,
      2
    );
  }

  function buildPrim3AB(){
    let tries = 0;
    while (tries++ < 1000){
      const kind = choice(["frac_of_group_times","group_mult_group","frac_then_plus","prod_group_minus"]);
      if (kind === "frac_of_group_times"){
        const dAbs = randInt(2, 8);
        const d = dAbs * randSign();

        const a = smallInt();
        const b = smallInt();
        const innerOp = rng() < 0.5 ? "+" : "−";
        const groupVal = innerOp === "+" ? a + b : a - b;
        const c = smallInt(true);
        const topVal = groupVal * c;
        if (topVal % d !== 0) continue;
        const val = topVal / d;
        if (!withinABLimit(val)) continue;

        const inner = `${intHTML(a)}${opHTML(innerOp)}${intHTML(b, { forcePlus: b > 0 })}`;
        const topExpr = `${wrapHTML(inner)}${opHTML("×")}${intHTML(c, { forcePlus: c > 0 })}`;
        return comp(
          fracHTML(topExpr, intHTML(d, { parenNeg:false })),
          val,
          3
        );
      }

      if (kind === "group_mult_group"){
        const a = smallInt();
        const b = smallInt();
        const c = smallInt();
        const d = smallInt();
        const op1 = rng() < 0.5 ? "+" : "−";
        const op2 = rng() < 0.5 ? "+" : "−";
        const leftVal = op1 === "+" ? a + b : a - b;
        const rightVal = op2 === "+" ? c + d : c - d;
        const val = leftVal * rightVal;
        if (!withinABLimit(val)) continue;

        const left = wrapHTML(`${intHTML(a)}${opHTML(op1)}${intHTML(b, { forcePlus: b > 0 })}`);
        const right = wrapHTML(`${intHTML(c)}${opHTML(op2)}${intHTML(d, { forcePlus: d > 0 })}`);
        return comp(
          `${left}${opHTML("×")}${right}`,
          val,
          3
        );
      }

      if (kind === "frac_then_plus"){
        const dAbs = randInt(2, 8);
        const d = dAbs * randSign();
        const q = smallInt();
        const top = q * d;
        const e = smallInt();
        const sign = rng() < 0.5 ? "+" : "−";
        const val = sign === "+" ? q + e : q - e;
        if (!withinABLimit(val)) continue;

        const frac = fracHTML(intHTML(top, { parenNeg:false }), intHTML(d, { parenNeg:false }));
        return comp(
          `${frac}${opHTML(sign)}${intHTML(e, { forcePlus: e > 0 })}`,
          val,
          2
        );
      }

      if (kind === "prod_group_minus"){
        const a = smallInt(true);
        const b = smallInt();
        const c = smallInt();
        const d = smallInt();
        const innerOp = rng() < 0.5 ? "+" : "−";
        const innerVal = innerOp === "+" ? b + c : b - c;
        const val = (a * innerVal) - d;
        if (!withinABLimit(val)) continue;
        const inner = wrapHTML(`${intHTML(b)}${opHTML(innerOp)}${intHTML(c, { forcePlus: c > 0 })}`);
        return comp(
          `${intHTML(a)}${opHTML("×")}${inner}${opHTML("−")}${intHTML(d, { forcePlus: d > 0 })}`,
          val,
          3
        );
      }
    }

    return comp(
      `${intHTML(5)}${opHTML("×")}${intHTML(-3)}${opHTML("+")}${fracHTML(intHTML(-24, { parenNeg:false }), wrapHTML(`${intHTML(5)}${opHTML("−")}${intHTML(-3)}`))}`,
      -18,
      3
    );
  }

  function combineAB(left, right, op){
    let val;
    if (op === "+") val = left.val + right.val;
    else if (op === "−") val = left.val - right.val;
    else val = left.val * right.val;

    if (!withinABLimit(val)) return null;

    const leftHTML = left.ops > 0 ? wrapHTML(left.html) : left.html;
    const rightHTML = right.ops > 0 ? wrapHTML(right.html) : right.html;
    return comp(`${leftHTML}${opHTML(op)}${rightHTML}`, val, left.ops + right.ops + 1);
  }

  function buildHardExprAB(opCount, depth=0){
    if (opCount <= 0) return buildLeafAB();
    if (opCount === 1) return buildPrim1AB();
    if (opCount === 2) return buildPrim2AB();
    if (opCount === 3) return buildPrim3AB();

    let tries = 0;
    while (tries++ < 1200){
      const leftOps = randInt(1, opCount - 2);
      const rightOps = opCount - 1 - leftOps;

      const left = buildHardExprAB(leftOps, depth + 1);
      const right = buildHardExprAB(rightOps, depth + 1);

      const opChoices = ["+","−","−","×"];
      const op = choice(opChoices);

      if (op === "×"){
        if (Math.abs(left.val) > 15 || Math.abs(right.val) > 15) continue;
      }

      const merged = combineAB(left, right, op);
      if (!merged) continue;

      const fracSeen = merged.html.includes("mFrac");
      if (depth === 0 && !fracSeen && rng() < 0.7){
        continue;
      }

      return merged;
    }

    // fallback
    const a = buildPrim2AB();
    const b = buildPrim3AB();
    const merged = combineAB(a, b, "−");
    return merged || comp(
      `${fracHTML(
        `${intHTML(6)}${opHTML("+")}${intHTML(-3)}`,
        intHTML(-3, { parenNeg:false })
      )}${opHTML("−")}${wrapHTML(`${intHTML(4)}${opHTML("×")}${intHTML(-6)}${opHTML("−")}${intHTML(-6)}`)}`,
      -7,
      5
    );
  }

  function genHardOOPAB(){
    let tries = 0;
    while (tries++ < 2000){
      const ops = randInt(5, 10);
      const ex = buildHardExprAB(ops, 0);
      if (!Number.isInteger(ex.val)) continue;
      if (!withinABLimit(ex.val)) continue;

      return {
        type: "hard_oop_ab",
        exprHTML: `<span class="mExpr">${ex.html}</span>`,
        ans: ex.val,
        ops,
        key: ex.html.replace(/\s+/g, " ").trim()
      };
    }

    return {
      type: "hard_oop_ab",
      exprHTML: `<span class="mExpr">${
        fracHTML(
          `${intHTML(6)}${opHTML("+")}${intHTML(-3)}`,
          intHTML(-3, { parenNeg:false })
        )
      }${opHTML("−")}${wrapHTML(`${intHTML(4)}${opHTML("×")}${intHTML(-6)}${opHTML("−")}${intHTML(-6)}`)}</span>`,
      ans: -7,
      ops: 5,
      key: "fallback-hard"
    };
  }

  // ------------------------------------------------------------
  // SVG builders
  // ------------------------------------------------------------
  function buildFixedNumberLineSVG(answerVal, showAnswer){
    const vmin = -10, vmax = 10;

    const svg = elNS("svg", { viewBox:"0 0 1000 200", class:"svg", role:"img", "aria-label":"number line" });

    const left = 85, right = 915;
    const yLine = 86;
    const tickMajorTop = yLine - 22;
    const tickMajorBot = yLine + 22;
    const tickUnitTop  = yLine - 12;
    const tickUnitBot  = yLine + 12;

    const dotR = 9;
    const labelY = 170;

    const x = (v) => {
      const t = (v - vmin) / (vmax - vmin);
      return left + t * (right - left);
    };

    svg.appendChild(elNS("line", { x1:left, y1:yLine, x2:right, y2:yLine, class:"baseline" }));

    for (let v = vmin; v <= vmax; v++){
      if (v === vmin || v === 0 || v === vmax) continue;
      const xi = x(v);
      svg.appendChild(elNS("line", { x1: xi, y1: tickUnitTop, x2: xi, y2: tickUnitBot, class:"tickUnit" }));
    }

    function major(v, clsDot="", clsLabel=""){
      const xi = x(v);
      svg.appendChild(elNS("line", { x1: xi, y1: tickMajorTop, x2: xi, y2: tickMajorBot, class:"tickMajor" }));
      svg.appendChild(elNS("circle", { cx: xi, cy: yLine, r: dotR, class:`dot ${clsDot}`.trim() }));
      svg.appendChild(textNS(fmtInt(v), { x: xi, y: labelY, "text-anchor":"middle", class:`label ${clsLabel}`.trim() }));
    }

    major(-10);
    major(0, "zero");
    major(10);

    if (showAnswer){
      const xa = x(answerVal);
      svg.appendChild(elNS("circle", { cx: xa, cy: yLine, r: dotR, class:"dot answer" }));
      if (answerVal !== -10 && answerVal !== 0 && answerVal !== 10){
        svg.appendChild(textNS(fmtInt(answerVal), { x: xa, y: labelY, "text-anchor":"middle", class:"label answer" }));
      }
    }
    return svg;
  }

  function buildCalcLineSVG(a){
    const lo = Math.min(a, 0);
    const hi = Math.max(a, 0);
    const span = Math.max(1, hi - lo);
    const pad = clamp(Math.ceil(span * 0.35), 4, 10);

    let vmin = clamp(lo - pad, -20, 20);
    let vmax = clamp(hi + pad, -20, 20);
    if (vmax - vmin < 10){
      vmin = clamp(vmin - 2, -20, 20);
      vmax = clamp(vmax + 2, -20, 20);
    }

    const svg = elNS("svg", { viewBox:"0 0 1000 200", class:"svg", role:"img", "aria-label":"number line" });

    const left = 85, right = 915;
    const yLine = 86;
    const tickMajorTop = yLine - 22;
    const tickMajorBot = yLine + 22;
    const tickUnitTop  = yLine - 11;
    const tickUnitBot  = yLine + 11;

    const dotR = 9;
    const labelY = 176;

    const x = (v) => {
      const t = (v - vmin) / (vmax - vmin);
      return left + t * (right - left);
    };

    svg.appendChild(elNS("line", { x1:left, y1:yLine, x2:right, y2:yLine, class:"baseline" }));

    const start = Math.ceil(vmin);
    const end = Math.floor(vmax);
    for (let v = start; v <= end; v++){
      if (v === 0 || v === a) continue;
      const xi = x(v);
      svg.appendChild(elNS("line", { x1: xi, y1: tickUnitTop, x2: xi, y2: tickUnitBot, class:"tickUnit" }));
    }

    function major(v, clsDot="", clsLabel=""){
      const xi = x(v);
      svg.appendChild(elNS("line", { x1: xi, y1: tickMajorTop, x2: xi, y2: tickMajorBot, class:"tickMajor" }));
      svg.appendChild(elNS("circle", { cx: xi, cy: yLine, r: dotR, class:`dot ${clsDot}`.trim() }));
      svg.appendChild(textNS(fmtInt(v), { x: xi, y: labelY, "text-anchor":"middle", class:`label ${clsLabel}`.trim() }));
    }

    major(a);
    major(0, "zero");
    return svg;
  }

  // ------------------------------------------------------------
  // C-Expected number line
  // ------------------------------------------------------------
  function tooClose(a,b,step){ return Math.abs(a-b) < 2*step; }

  function buildPlaceLineCE({ step, labels, answer }, showAnswer){
    const vmax = clamp(step * 10, 1, CE_MAX_ABS);
    const vmin = -vmax;

    const svg = elNS("svg", { viewBox:"0 0 1000 200", class:"svg", role:"img", "aria-label":"number line" });

    const left = 85, right = 915;
    const yLine = 86;
    const tickMajorTop = yLine - 22;
    const tickMajorBot = yLine + 22;
    const tickUnitTop  = yLine - 12;
    const tickUnitBot  = yLine + 12;

    const dotR = 9;
    const labelY = 170;

    const x = (v) => left + ((v - vmin) / (vmax - vmin)) * (right - left);

    svg.appendChild(elNS("line", { x1:left, y1:yLine, x2:right, y2:yLine, class:"baseline" }));

    const labelSet = new Set(labels.map(Number));
    for (let v = vmin; v <= vmax; v += step){
      if (labelSet.has(v)) continue;
      const xi = x(v);
      svg.appendChild(elNS("line", { x1: xi, y1: tickUnitTop, x2: xi, y2: tickUnitBot, class:"tickUnit" }));
    }

    function major(v, clsDot="", clsLabel=""){
      const xi = x(v);
      svg.appendChild(elNS("line", { x1: xi, y1: tickMajorTop, x2: xi, y2: tickMajorBot, class:"tickMajor" }));
      svg.appendChild(elNS("circle", { cx: xi, cy: yLine, r: dotR, class:`dot ${clsDot}`.trim() }));
      svg.appendChild(textNS(fmtInt(v), { x: xi, y: labelY, "text-anchor":"middle", class:`label ${clsLabel}`.trim() }));
    }

    const majors = labels.slice().sort((a,b)=>a-b);
    for (const v of majors){
      if (v === 0) major(v, "zero");
      else major(v);
    }

    if (showAnswer){
      const xa = x(answer);
      svg.appendChild(elNS("circle", { cx: xa, cy: yLine, r: dotR, class:"dot answer" }));
      if (!labelSet.has(answer)){
        svg.appendChild(textNS(fmtInt(answer), { x: xa, y: labelY, "text-anchor":"middle", class:"label answer" }));
      }
    }
    return svg;
  }

  // ------------------------------------------------------------
  // Question generators
  // ------------------------------------------------------------
  function genPlace(){ return { type:"place", v: randInt(PLACE_RANGE.min, PLACE_RANGE.max) }; }

  function genCalc(){
    const a = randInt(CALC_A_RANGE.min, CALC_A_RANGE.max);
    const b = randInt(CALC_B_RANGE.min, CALC_B_RANGE.max);
    const op = rng() < 0.5 ? "+" : "−";
    const ans = (op === "+") ? (a + b) : (a - b);
    if (ans < -20 || ans > 20) return genCalc();
    return { type:"calc", a, b, op, ans };
  }

  function genIneq(){
    const a = randInt(-20, 20);
    const b = randInt(-20, 20);
    const sym = (a < b) ? "<" : (a > b ? ">" : "=");
    return { type:"ineq", a, b, sym };
  }

  function genOrder(){
    const dir = rng() < 0.5 ? "ascending" : "descending";
    const set = new Set();
    while (set.size < 5) set.add(randInt(ORDER_RANGE.min, ORDER_RANGE.max));
    const nums = Array.from(set);
    const answer = nums.slice().sort((x,y) => dir === "ascending" ? x-y : y-x);

    let shown = shuffle(nums);
    let tries = 0;
    while (tries < 6){
      if (!shown.every((v,i) => v === answer[i])) break;
      shown = shuffle(nums);
      tries++;
    }
    return { type:"order", dir, shown, answer };
  }

  function genMult(){
    const a = randInt(MULT_RANGE.min, MULT_RANGE.max);
    const b = randInt(MULT_RANGE.min, MULT_RANGE.max);
    if (a === 0 && b === 0) return genMult();
    return { type:"mult", a, b, ans: a*b };
  }

  function genDiv(){
    const bAbs = randInt(DIV_FACT.min, DIV_FACT.max);
    const cAbs = randInt(DIV_FACT.min, DIV_FACT.max);
    const b = rng() < 0.5 ? -bAbs : bAbs;
    const c = rng() < 0.5 ? -cAbs : cAbs;
    const a = b * c;
    return { type:"div", a, b, ans: c };
  }

  function genPlaceCE(){
    const step = choice(CE_STEPS);
    const vmax = step * 10;
    const vmin = -vmax;

    const labels = [vmin, 0, vmax];

    const ticks = [];
    for (let v=vmin; v<=vmax; v+=step){
      if (v===vmin || v===0 || v===vmax) continue;
      ticks.push(v);
    }

    let answer = choice(ticks);
    let tries = 0;
    while (tries++ < 300){
      answer = choice(ticks);
      if (tooClose(answer, 0, step)) continue;
      if (tooClose(answer, vmin, step)) continue;
      if (tooClose(answer, vmax, step)) continue;
      break;
    }

    const extras = [];
    tries = 0;
    while (extras.length < 2 && tries++ < 1200){
      const cand = choice(ticks);
      if (cand === answer) continue;
      if (labels.some(l => tooClose(cand, l, step))) continue;
      if (extras.some(e => tooClose(cand, e, step))) continue;
      if (tooClose(answer, cand, step)) continue;
      extras.push(cand);
    }

    if (extras.length < 2) return genPlaceCE();
    labels.push(...extras);
    return { type:"place_ce", step, labels, answer };
  }

  function genCalcCE(opForced=null){
    const op = opForced ?? choice(["+","−","×","÷"]);

    if (op === "+" || op === "−"){
      let a=0,b=0,ans=0,tries=0;
      while (tries++ < 600){
        a = randInt(CE_ADD_A.min, CE_ADD_A.max);
        b = randInt(CE_ADD_B.min, CE_ADD_B.max);
        ans = (op === "+") ? a+b : a-b;
        if (ans < -100 || ans > 100) continue;
        break;
      }
      return { type:"calc_ce", op, a, b, ans };
    }

    if (op === "×"){
      const aAbs = randInt(CE_MULT_ABS.min, CE_MULT_ABS.max);
      const bAbs = randInt(CE_MULT_ABS.min, CE_MULT_ABS.max);
      const a = aAbs * randSign();
      const b = bAbs * randSign();
      return { type:"calc_ce", op:"×", a, b, ans: a*b };
    }

    const dAbs = randInt(CE_DIV_ABS.min, CE_DIV_ABS.max);
    const qAbs = randInt(CE_DIV_ABS.min, CE_DIV_ABS.max);
    const divisor = dAbs * randSign();
    const quotient = qAbs * randSign();
    const dividend = divisor * quotient;
    return { type:"calc_ce", op:"÷", a: dividend, b: divisor, ans: quotient };
  }

  function dynBand(E){
    return clamp(4 + Math.floor(Math.abs(E)/6), 4, 14);
  }

  function fmtExpr(a, op, b){
    return `${tok(a)} ${op} ${tok(b)}`;
  }

  function genCompareCE(form){
    let tries = 0;
    while (tries++ < 5000){
      const a = randInt(-50, 50);
      let b = randInt(-50, 50);
      const op = form.includes("_sub") ? "−" : "+";
      if (b === 0) continue;

      const E = (op === "+") ? (a + b) : (a - b);
      if (Math.abs(E) > CE_EXPR_CAP) continue;
      if (E < CE_C_RANGE.min || E > CE_C_RANGE.max) continue;

      const band = dynBand(E);
      let c;

      const wantEq = rng() < CE_EQ_RATE;
      if (wantEq){
        c = E;
      } else {
        let deltaTries = 0;
        while (deltaTries++ < 200){
          const delta = randInt(-band, band);
          if (delta === 0) continue;
          const cand = E + delta;
          if (cand < CE_C_RANGE.min || cand > CE_C_RANGE.max) continue;
          c = cand;
          break;
        }
        if (typeof c !== "number") continue;
      }

      const exprStr = fmtExpr(a, op, b);
      let leftText, rightText, leftVal, rightVal;

      if (form.startsWith("ab_c")){
        leftText = exprStr;
        rightText = tok(c);
        leftVal = E;
        rightVal = c;
      } else {
        leftText = tok(c);
        rightText = exprStr;
        leftVal = c;
        rightVal = E;
      }

      const sym = (leftVal < rightVal) ? "<" : (leftVal > rightVal ? ">" : "=");
      if (Math.abs(leftVal - rightVal) > band) continue;

      return { type:"comp_ce", leftText, rightText, sym, form };
    }
    return genCompareCE(form);
  }

  function makeCombiningSignsForms(m){
    return makeWeightedBalancedList(CS_FORMS, m);
  }

  function exprKey(a, op, b){
    return `${a}${op}${b}`;
  }

  function genCombiningSignsCE(form){
    let tries = 0;
    while (tries++ < 6000){
      let a = randInt(CS_RANGE.min, CS_RANGE.max);
      if (a === 0) continue;

      let bAbs = randInt(1, 50);
      let b = bAbs;

      if (form === "pn_add" || form === "pn_sub"){
        b = -bAbs;
      } else {
        b = bAbs;
      }

      const op = (form === "pp_sub" || form === "pn_sub") ? "−" : "+";
      const ans = (op === "+") ? (a + b) : (a - b);

      if (Math.abs(ans) > CS_CAP) continue;

      const bStr = b >= 0 ? `(+${fmtInt(b)})` : `(${fmtInt(b)})`;
      const aStr = a >= 0 ? fmtInt(a) : `(${fmtInt(a)})`;

      const exprStr = `${aStr} ${op} ${bStr}`;
      return { type:"signs_ce", a, b, op, exprStr, ans, form };
    }

    return genCombiningSignsCE(form);
  }

  function pickNonZeroInt(min, max){
    let v = 0;
    let safety = 0;
    while (v === 0 && safety++ < 200){
      v = randInt(min, max);
    }
    return v || 1;
  }

  function withinOOLimit(n){
    return Number.isInteger(n) && Math.abs(n) <= OO_LIMIT;
  }

  function genOrderOpsCE(){
    let tries = 0;

    while (tries++ < 10000){
      const form = choice(OO_FORMS);

      let expr = "";
      let ans = null;

      if (form === "a_plus_bxc"){
        const a = randInt(-20,20);
        const b = pickNonZeroInt(-12,12);
        const c = pickNonZeroInt(-12,12);
        ans = a + b * c;
        expr = `${tok(a)} + ${tok(b)} × ${tok(c)}`;
      }

      else if (form === "a_minus_bxc"){
        const a = randInt(-20,20);
        const b = pickNonZeroInt(-12,12);
        const c = pickNonZeroInt(-12,12);
        ans = a - b * c;
        expr = `${tok(a)} − ${tok(b)} × ${tok(c)}`;
      }

      else if (form === "ax_b_plus_c"){
        const a = pickNonZeroInt(-12,12);
        const b = pickNonZeroInt(-12,12);
        const c = randInt(-20,20);
        ans = a * b + c;
        expr = `${tok(a)} × ${tok(b)} + ${tok(c)}`;
      }

      else if (form === "ax_b_minus_c"){
        const a = pickNonZeroInt(-12,12);
        const b = pickNonZeroInt(-12,12);
        const c = randInt(-20,20);
        ans = a * b - c;
        expr = `${tok(a)} × ${tok(b)} − ${tok(c)}`;
      }

      else if (form === "a_times_paren_b_plus_c"){
        const a = pickNonZeroInt(-12,12);
        const b = randInt(-12,12);
        const c = randInt(-12,12);
        ans = a * (b + c);
        expr = `${tok(a)} × (${tok(b)} + ${tok(c)})`;
      }

      else if (form === "a_times_paren_b_minus_c"){
        const a = pickNonZeroInt(-12,12);
        const b = randInt(-12,12);
        const c = randInt(-12,12);
        ans = a * (b - c);
        expr = `${tok(a)} × (${tok(b)} − ${tok(c)})`;
      }

      else if (form === "paren_a_plus_b_div_c"){
        const cAbs = randInt(2,12);
        const c = cAbs * randSign();
        const q = randInt(-12,12);
        const sum = q * c;
        const a = randInt(-12,12);
        const b = sum - a;
        ans = (a + b) / c;
        expr = `(${tok(a)} + ${tok(b)}) ÷ ${tok(c)}`;
      }

      else if (form === "paren_a_minus_b_div_c"){
        const cAbs = randInt(2,12);
        const c = cAbs * randSign();
        const q = randInt(-12,12);
        const diff = q * c;
        const a = randInt(-12,12);
        const b = a - diff;
        ans = (a - b) / c;
        expr = `(${tok(a)} − ${tok(b)}) ÷ ${tok(c)}`;
      }

      else if (form === "paren_axb_div_c"){
        const cAbs = randInt(2,12);
        const c = cAbs * randSign();
        const q = randInt(-12,12);
        const a = q;
        const b = c;
        ans = (a * b) / c;
        expr = `(${tok(a)} × ${tok(b)}) ÷ ${tok(c)}`;
      }

      else if (form === "paren_axb_plus_c"){
        const a = pickNonZeroInt(-12,12);
        const b = pickNonZeroInt(-12,12);
        const c = randInt(-20,20);
        ans = (a * b) + c;
        expr = `(${tok(a)} × ${tok(b)}) + ${tok(c)}`;
      }

      else if (form === "paren_axb_minus_c"){
        const a = pickNonZeroInt(-12,12);
        const b = pickNonZeroInt(-12,12);
        const c = randInt(-20,20);
        ans = (a * b) - c;
        expr = `(${tok(a)} × ${tok(b)}) − ${tok(c)}`;
      }

      else if (form === "paren_a_plus_b_times_c"){
        const a = randInt(-12,12);
        const b = randInt(-12,12);
        const c = pickNonZeroInt(-12,12);
        ans = (a + b) * c;
        expr = `(${tok(a)} + ${tok(b)}) × ${tok(c)}`;
      }

      else if (form === "paren_a_minus_b_times_c"){
        const a = randInt(-12,12);
        const b = randInt(-12,12);
        const c = pickNonZeroInt(-12,12);
        ans = (a - b) * c;
        expr = `(${tok(a)} − ${tok(b)}) × ${tok(c)}`;
      }

      else if (form === "paren_a_div_b_plus_c"){
        const bAbs = randInt(2,12);
        const b = bAbs * randSign();
        const q = randInt(-12,12);
        const a = q * b;
        const c = randInt(-20,20);
        ans = (a / b) + c;
        expr = `(${tok(a)} ÷ ${tok(b)}) + ${tok(c)}`;
      }

      else if (form === "paren_a_div_b_minus_c"){
        const bAbs = randInt(2,12);
        const b = bAbs * randSign();
        const q = randInt(-12,12);
        const a = q * b;
        const c = randInt(-20,20);
        ans = (a / b) - c;
        expr = `(${tok(a)} ÷ ${tok(b)}) − ${tok(c)}`;
      }

      if (!withinOOLimit(ans)) continue;
      return { type:"oop_ce", expr, ans, form };
    }

    return {
      type:"oop_ce",
      expr:"3 + 4 × (−3)",
      ans:-9,
      form:"fallback"
    };
  }

  // ------------------------------------------------------------
  // Planning + generation
  // ------------------------------------------------------------
  function generateQuestions(n){
    const pool = enabledTypes();
    if (!pool.length) return [];

    const plan = makeBalancedList(pool, n);

    const calcPositions = [];
    for (let i=0;i<plan.length;i++){
      if (plan[i] === "calc_ce") calcPositions.push(i);
    }
    const opPlan = makeBalancedOpList(calcPositions.length);
    const opByIdx = new Map();
    calcPositions.forEach((pos,j)=>opByIdx.set(pos, opPlan[j]));

    const compPositions = [];
    for (let i=0;i<plan.length;i++){
      if (plan[i] === "comp_ce") compPositions.push(i);
    }
    const formPlan = (() => {
      const forms = ["ab_c_add","ab_c_sub","c_ab_add","c_ab_sub"];
      if (compPositions.length<=0) return [];
      const list = [];
      let i=0;
      while (list.length < compPositions.length){
        list.push(forms[i % forms.length]);
        i++;
      }
      return shuffle(list);
    })();
    const formByIdx = new Map();
    compPositions.forEach((pos,j)=>formByIdx.set(pos, formPlan[j]));

    const signsPositions = [];
    for (let i=0;i<plan.length;i++){
      if (plan[i] === "signs_ce") signsPositions.push(i);
    }
    const signsFormPlan = makeCombiningSignsForms(signsPositions.length);
    const signsFormByIdx = new Map();
    signsPositions.forEach((pos,j)=>signsFormByIdx.set(pos, signsFormPlan[j]));

    const qs = [];
    let safety = 0;

    while (qs.length < n && safety++ < 50000){
      const t = plan[qs.length];
      let q=null;

      if (t==="place") q=genPlace();
      if (t==="calc")  q=genCalc();
      if (t==="ineq")  q=genIneq();
      if (t==="order") q=genOrder();
      if (t==="mult")  q=genMult();
      if (t==="div")   q=genDiv();

      if (t==="place_ce") q=genPlaceCE();
      if (t==="calc_ce")  q=genCalcCE(opByIdx.get(qs.length) ?? null);
      if (t==="comp_ce")  q=genCompareCE(formByIdx.get(qs.length) ?? "ab_c_add");
      if (t==="signs_ce") q=genCombiningSignsCE(signsFormByIdx.get(qs.length) ?? "pn_sub");
      if (t==="oop_ce")   q=genOrderOpsCE();
      if (t==="hard_oop_ab") q=genHardOOPAB();

      if (!q) continue;

      const ok = uniqPush(qs, q, (x) => {
        if (x.type==="place") return `p:${x.v}`;
        if (x.type==="calc")  return `c:${x.a}${x.op}${x.b}`;
        if (x.type==="ineq")  return `i:${x.a}?${x.b}`;
        if (x.type==="order") return `o:${x.dir}:${x.shown.join(',')}`;
        if (x.type==="mult")  return `m:${x.a}x${x.b}`;
        if (x.type==="div")   return `d:${x.a}÷${x.b}`;
        if (x.type==="place_ce") return `pce:s${x.step}:a${x.answer}:L${x.labels.slice().sort((a,b)=>a-b).join('|')}`;
        if (x.type==="calc_ce") return `cce:${x.op}:${x.a},${x.b}`;
        if (x.type==="comp_ce") return `cmp:${x.leftText}?${x.rightText}`;
        if (x.type==="oop_ce")  return `oop:${x.expr}`;
        if (x.type==="hard_oop_ab") return `ab:${x.key}`;
        return `sig:${exprKey(x.a, x.op, x.b)}`;
      });
      if (!ok) continue;
    }

    return qs;
  }

  // ------------------------------------------------------------
  // Rendering cards
  // ------------------------------------------------------------
  function makeCard(q, idx1, showAnswers){
    const card = document.createElement("div");
    card.className = "qCard";

    if (q.type === "hard_oop_ab"){
      card.classList.add("abHard");
    }

    const top = document.createElement("div");
    top.className = "qTop";

    const num = document.createElement("div");
    num.className = "qNum";
    num.textContent = `Q${idx1}`;

    const text = document.createElement("div");
    text.className = "qText";

    top.appendChild(num);
    top.appendChild(text);
    card.appendChild(top);

    const work = document.createElement("div");
    work.className = "workArea";

    let deferredAnsRow = null;

    if (q.type === "place"){
      text.textContent = L().place(fmtInt(q.v));
      work.appendChild(buildFixedNumberLineSVG(q.v, showAnswers));

    } else if (q.type === "calc"){
      text.textContent = L().useLine(fmtInt(q.a), q.op, fmtInt(q.b));
      work.appendChild(buildCalcLineSVG(q.a));

      const ansRow = document.createElement("div");
      ansRow.className = "ansRow";
      ansRow.innerHTML = `<div class="ansLabel">${tr("answer")}</div>`;
      const box = document.createElement("div");
      box.className = "ansBox" + (showAnswers ? " key" : "");
      box.textContent = showAnswers ? fmtInt(q.ans) : "";
      ansRow.appendChild(box);
      deferredAnsRow = ansRow;

    } else if (q.type === "ineq"){
      text.textContent = tr("insertSym");

      const row = document.createElement("div");
      row.className = "ineqRow";
      const left = document.createElement("div");
      left.className = "pill";
      left.textContent = fmtInt(q.a);
      const mid = document.createElement("div");
      mid.className = "symBox" + (showAnswers ? " key" : "");
      mid.textContent = showAnswers ? q.sym : "";
      const right = document.createElement("div");
      right.className = "pill";
      right.textContent = fmtInt(q.b);

      row.appendChild(left);
      row.appendChild(mid);
      row.appendChild(right);

      work.style.border = "none";
      work.style.padding = "0";
      work.appendChild(row);

    } else if (q.type === "order"){
      text.textContent = L().order(joinList(q.shown.map(fmtInt)), tr(q.dir));

      work.style.border = "none";
      work.style.padding = "0";

      const row = document.createElement('div');
      row.className = 'orderRow';
      for (const n of q.shown){
        const p = document.createElement('div');
        p.className = 'pill';
        p.textContent = fmtInt(n);
        row.appendChild(p);
      }

      const ans = document.createElement('div');
      ans.className = 'orderAns';
      for (let i=0;i<5;i++){
        const b = document.createElement('div');
        b.className = 'orderBox' + (showAnswers ? ' key' : '');
        b.textContent = showAnswers ? fmtInt(q.answer[i]) : '';
        ans.appendChild(b);
      }

      const wrap = document.createElement('div');
      wrap.style.width = '100%';
      wrap.style.display = 'flex';
      wrap.style.flexDirection = 'column';
      wrap.style.alignItems = 'center';
      wrap.style.justifyContent = 'center';
      wrap.appendChild(row);
      wrap.appendChild(ans);

      work.appendChild(wrap);

    } else if (q.type === "mult"){
      text.textContent = L().calculateExpr(fmtInt(q.a), "×", fmtInt(q.b));

      work.style.alignItems = 'flex-start';
      work.style.justifyContent = 'flex-start';
      work.innerHTML = '';

      const ansRow = document.createElement("div");
      ansRow.className = "ansRow";
      ansRow.innerHTML = `<div class="ansLabel">${tr("answer")}</div>`;
      const box = document.createElement("div");
      box.className = "ansBox" + (showAnswers ? " key" : "");
      box.textContent = showAnswers ? fmtInt(q.ans) : "";
      ansRow.appendChild(box);
      deferredAnsRow = ansRow;

    } else if (q.type === "div"){
      text.textContent = L().calculateExpr(fmtInt(q.a), "÷", fmtInt(q.b));

      work.style.alignItems = 'flex-start';
      work.style.justifyContent = 'flex-start';
      work.innerHTML = '';

      const ansRow = document.createElement("div");
      ansRow.className = "ansRow";
      ansRow.innerHTML = `<div class="ansLabel">${tr("answer")}</div>`;
      const box = document.createElement("div");
      box.className = "ansBox" + (showAnswers ? " key" : "");
      box.textContent = showAnswers ? fmtInt(q.ans) : "";
      ansRow.appendChild(box);
      deferredAnsRow = ansRow;

    } else if (q.type === "place_ce"){
      text.textContent = L().place(fmtInt(q.answer));
      work.appendChild(buildPlaceLineCE(q, showAnswers));

    } else if (q.type === "calc_ce"){
      text.textContent = L().calculateExpr(tok(q.a), q.op, tok(q.b));

      work.style.alignItems = 'flex-start';
      work.style.justifyContent = 'flex-start';
      work.innerHTML = '';

      const ansRow = document.createElement("div");
      ansRow.className = "ansRow";
      ansRow.innerHTML = `<div class="ansLabel">${tr("answer")}</div>`;
      const box = document.createElement("div");
      box.className = "ansBox" + (showAnswers ? " key" : "");
      box.textContent = showAnswers ? fmtInt(q.ans) : "";
      ansRow.appendChild(box);
      deferredAnsRow = ansRow;

    } else if (q.type === "comp_ce"){
      text.textContent = tr("insertSym");

      const row = document.createElement("div");
      row.className = "ineqRow";

      const left = document.createElement("div");
      left.className = "pill";
      left.textContent = q.leftText;

      const mid = document.createElement("div");
      mid.className = "symBox" + (showAnswers ? " key" : "");
      mid.textContent = showAnswers ? q.sym : "";

      const right = document.createElement("div");
      right.className = "pill";
      right.textContent = q.rightText;

      row.appendChild(left);
      row.appendChild(mid);
      row.appendChild(right);

      work.style.border = "none";
      work.style.padding = "0";
      work.appendChild(row);

    } else if (q.type === "signs_ce"){
      text.textContent = tr("calculate");

      work.style.border = "none";
      work.style.padding = "0";
      work.style.background = "transparent";

      const row = document.createElement("div");
      row.className = "ineqRow";
      row.style.marginTop = "0";

      const p = document.createElement("div");
      p.className = "pill";
      p.style.fontSize = "22px";
      p.style.fontFamily = 'var(--mathFont)';
      p.style.fontWeight = '700';
      p.textContent = q.exprStr;

      row.appendChild(p);
      work.appendChild(row);

      const ansRow = document.createElement("div");
      ansRow.className = "ansRow";
      ansRow.innerHTML = `<div class="ansLabel">${tr("answer")}</div>`;
      const box = document.createElement("div");
      box.className = "ansBox" + (showAnswers ? " key" : "");
      box.textContent = showAnswers ? fmtInt(q.ans) : "";
      ansRow.appendChild(box);
      deferredAnsRow = ansRow;

    } else if (q.type === "oop_ce"){
      text.textContent = tr("oop");

      work.style.border = "none";
      work.style.padding = "0";
      work.style.background = "transparent";

      const exprWrap = document.createElement("div");
      exprWrap.className = "ineqRow";
      exprWrap.style.marginTop = "0";

      const expr = document.createElement("div");
      expr.className = "opExpr";
      expr.textContent = q.expr;

      exprWrap.appendChild(expr);
      work.appendChild(exprWrap);

      const ansRow = document.createElement("div");
      ansRow.className = "ansRow";
      ansRow.innerHTML = `<div class="ansLabel">${tr("answer")}</div>`;
      const box = document.createElement("div");
      box.className = "ansBox" + (showAnswers ? " key" : "");
      box.textContent = showAnswers ? fmtInt(q.ans) : "";
      ansRow.appendChild(box);
      deferredAnsRow = ansRow;

    } else if (q.type === "hard_oop_ab"){
      text.textContent = tr("oop");

      work.style.border = "none";
      work.style.padding = "0";
      work.style.background = "transparent";
      work.style.alignItems = "stretch";
      work.style.justifyContent = "stretch";

      const wrap = document.createElement("div");
      wrap.className = "hardWorkWrap";

      const exprLine = document.createElement("div");
      exprLine.className = "hardExprLine";

      const expr = document.createElement("div");
      expr.className = "opExpr hard";
      expr.innerHTML = q.exprHTML;

      exprLine.appendChild(expr);
      wrap.appendChild(exprLine);

      const blank = document.createElement("div");
      blank.className = "hardBlank";
      wrap.appendChild(blank);

      work.appendChild(wrap);

      if (showAnswers){
        const keyRow = document.createElement("div");
        keyRow.className = "hardKeyRow";
        keyRow.innerHTML = `
          <div class="hardKeyLabel">${tr("answer")}</div>
          <div class="hardKeyValue">${esc(unicodeInt(q.ans))}</div>
        `;
        deferredAnsRow = keyRow;
      }
    }

    card.appendChild(work);
    if (deferredAnsRow) card.appendChild(deferredAnsRow);
    return card;
  }

  function pageHTML(pageTitle, pageIndex, pageCount){
    const page = document.createElement("div");
    page.className = "page" + (L().dir === "rtl" ? " lang-rtl" : "");

    const border = document.createElement("img");
    border.className = "pageBorder";
    border.alt = "";
    border.src = BORDER_SRC;
    page.appendChild(border);

    const inner = document.createElement("div");
    inner.className = "pageInner";
    page.appendChild(inner);

    const content = document.createElement('div');
    content.className = 'pageContent';
    inner.appendChild(content);

    const header = document.createElement("div");
    header.className = "pageHeader";
    header.innerHTML = `
      <div class="hdrLeft">
        <div class="hdrTitle">${pageTitle} — ${tr("page")} ${pageIndex} ${tr("of")} ${pageCount}</div>
        <div class="hdrSub">${currentHeader()}</div>
      </div>
      <div class="nameRow">
        <div class="lineField"><div class="lineLabel">${tr("name")}</div><div class="lineBox"></div></div>
        <div class="lineField"><div class="lineLabel">${tr("className")}</div><div class="lineBox"></div></div>
        <div class="lineField"><div class="lineLabel">${tr("date")}</div><div class="lineBox"></div></div>
      </div>
    `;
    content.appendChild(header);

    const grid = document.createElement("div");
    grid.className = "grid";
    if (isABMode()) grid.classList.add("abMode");
    content.appendChild(grid);

    return { page, grid };
  }

  function buildPages(questions, pageTitle, showAnswers){
    const pages = [];
    const perPage = currentPerPage();
    const totalPages = Math.ceil(questions.length / perPage);
    let qNum = 1;

    for (let p=0; p<totalPages; p++){
      const { page, grid } = pageHTML(pageTitle, p+1, totalPages);

      const slice = questions.slice(p*perPage, p*perPage + perPage);
      for (const q of slice){
        grid.appendChild(makeCard(q, qNum, showAnswers));
        qNum++;
      }
      pages.push(page);
    }
    return pages;
  }

  function normalizeCountForMode(v){
    const cfg = currentCfg();
    let n = Number(v);
    if (!Number.isFinite(n)) n = cfg.defaultCount;
    n = Math.round(n);
    n = clamp(n, cfg.minCount, cfg.maxCount);

    if (cfg.countStep > 1){
      n = Math.max(cfg.minCount, Math.round(n / cfg.countStep) * cfg.countStep);
      n = clamp(n, cfg.minCount, cfg.maxCount);
    }
    return n;
  }

  function generate(){
    rng = Math.random;
    clearOut();

    let n = normalizeCountForMode(countInp.value);
    countInp.value = String(n);

    const qs = generateQuestions(n);
    if (!qs.length){
      out.innerHTML = `<div style="padding:12px; font-weight:950; color:#991b1b;">${tr("noTypes")}</div>`;
      return;
    }

    const ws = buildPages(qs, tr("worksheet"), false);
    const key = buildPages(qs, tr("answerKey"), true);

    ws.forEach(pg => out.appendChild(pg));
    key.forEach(pg => out.appendChild(pg));

    out.classList.remove("flashGenerate");
    void out.offsetWidth;
    out.classList.add("flashGenerate");

    if (out.firstElementChild) out.firstElementChild.scrollIntoView({ behavior:"smooth", block:"start" });
  }

 function reset(){
  clearOut();
  outcomeSel.value = "basic_de";
  renderCheckboxes();
  updateCountUI(true);
}

  function applyOutcomeChange(){
    clearOut();
    renderCheckboxes();
    updateCountUI(true);
  }

  outcomeSel.value = "basic_de";
  renderCheckboxes();
  updateCountUI(true);

  outcomeSel.addEventListener("change", applyOutcomeChange);
  languageSel.addEventListener("change", () => { if (out.children.length) generate(); });
  toggleAllBtn.addEventListener("click", () => {
    const allChecked = activeCbs.length && activeCbs.every(cb => cb.checked);
    setAllCheckboxes(!allChecked);
  });
  genBtn.addEventListener("click", generate);
  printBtn.addEventListener("click", () => window.print());
  resetBtn.addEventListener("click", reset);
})();
