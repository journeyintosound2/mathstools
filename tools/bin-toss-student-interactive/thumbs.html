<!doctype html><body style="margin:0;background:#888"><canvas id=c width=320 height=400></canvas><script type="module">
import * as THREE from './three.module.min.js?v=954c1c22';
import {GLTFLoader} from './GLTFLoader.js';import {MeshoptDecoder} from './meshopt_decoder.module.js';
