<body>
<div class="app">
  <header class="mmtTopbar">
    <a class="mmtBrand" href="https://www.millsmathstools.au" aria-label="Back to Mills Maths Tools">
      <span class="mmtBrandLogo" aria-hidden="true">MMT</span>
      <span class="mmtBrandText"><strong>MMT</strong><span>Mills Maths Tools</span></span>
    </a>
    <div class="mmtTopTitle"><small>Student Interactive</small>Bin Toss: Run the Stall</div>
    <div class="topActions">
      <button class="btn chBtn" id="charBtn" type="button" title="Change character" hidden><span class="chFace" id="charFace" aria-hidden="true"></span><span class="lbl" data-t="Change character">Change character</span></button>
      <button class="btn icon" id="helpBtn" type="button" title="How to play" aria-label="How to play">?</button>
      <button class="btn" id="goalBtn" type="button" title="Challenges">🏆 <span id="goalCount">0/11</span></button>
      <button class="btn" id="logBtn" type="button" title="My results">📊 <span class="lbl" data-t="My results">My results</span></button>
      <div class="menuWrap"><button class="btn icon" id="setBtn" type="button" aria-haspopup="true" aria-expanded="false" title="Settings" aria-label="Settings">⚙</button>
        <div class="setMenu" id="setMenu" hidden></div></div>
      <button class="btn acctBtn" id="acctChip" type="button" title="Sign in"></button>
      <button class="btn btn-primary" id="teachBtn" type="button" data-t="Teacher">Teacher</button>
    </div>
  </header>

  <main id="stage">
    <canvas id="c" tabindex="-1" aria-label="A classroom in 3D with a bin at the front"></canvas>
    <div id="loading">Setting up the classroom…</div>

    <div class="hud" id="status" hidden><div class="cardG" id="statusCard"></div></div>

    <div class="hud" id="controls" hidden>
      <div class="cardG">
        <div class="stepPills"><span id="pill1">1 Angle</span><span id="pill2">2 Power</span></div>
        <div class="ctlCols">
          <div class="ctl" id="ctlAngle">
            <h4 id="hAngle">Angle</h4>
            <div class="read"><span id="angRead">45</span>°</div>
            <div class="vTrack" id="angTrack" role="slider" tabindex="0" aria-label="Throwing angle in degrees" aria-valuemin="15" aria-valuemax="75" aria-valuenow="45" aria-orientation="vertical">
              <div class="rail"></div><div class="fill" id="angFill"></div>
              <div id="angTicks"></div>
              <div class="thumb" id="angThumb">&#8597;</div>
            </div>
            <div class="zoneNote" id="angNote">Drag up for a higher throw</div>
          </div>
          <div class="ctl off" id="ctlPower">
            <h4 id="hPower">Power</h4>
            <div class="read"><span id="powRead">0</span><small>%</small></div>
            <div class="meter" id="meter">
              <div class="bar"><div class="zone" id="zone"></div></div>
              <div class="zoneL" id="zoneL">sweet spot</div>
              <div class="mark" id="mark" style="bottom:0"></div>
            </div>
            <div class="zoneNote" id="zoneNote"></div>
          </div>
        </div>
        <button class="bigBtn" id="actBtn" type="button">Lock in angle <kbd>Space</kbd></button>
        <button class="backLnk" id="unlockBtn" type="button" hidden>&#8592; change the angle</button>
      </div>
    </div>

    <div class="hud" id="pop" aria-live="polite"></div>
    <div class="hud" id="hint" hidden></div>
    <button class="hud" id="replayTag" type="button" hidden>&#9654; REPLAY <small>slow motion · tap to skip</small></button>
    <div class="hud" id="skip" hidden><button type="button" id="skipBtn" data-t="Skip to the end ⏩">Skip to the end ⏩</button></div>
    <div class="hud" id="toast" hidden role="status"></div>

    <div id="veil" hidden></div>
  </main>
</div>
